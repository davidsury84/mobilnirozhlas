<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Výsledky — spokojenost zákazníků shop.elkoplast.cz</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f2f5f1;--paper:#fff;--ink:#111713;--ink-soft:#5d675f;--muted:#8a948c;--line:#dce4dc;
    --green:#0e8a43;--green-2:#18a957;--green-d:#08612d;--green-soft:#e3f3e9;--r:16px}
  *{box-sizing:border-box;margin:0;padding:0} html{color-scheme:light}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header.app{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .app-in{max-width:860px;margin:0 auto;padding:10px 16px}
  .brand b{font-size:14px;letter-spacing:.05em;color:var(--green-d)}
  .brand span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:600}
  main{max-width:860px;margin:0 auto;padding:22px 16px 64px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:0 1px 2px rgba(17,23,19,.05);margin-bottom:14px}
  h1{font-size:23px;line-height:1.25;margin-bottom:4px}
  .hint{color:var(--muted);font-size:12.5px}
  .tiles{display:flex;gap:26px;flex-wrap:wrap}
  .tiles b{display:block;font-size:24px;color:var(--green-d)}
  .tiles span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
  .sekce-nadpis{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--green);margin-bottom:4px}
  .ot{padding:12px 0;border-top:1px solid var(--line)}
  .ot:first-of-type{border-top:none;padding-top:2px}
  .ot .t{font-weight:600;font-size:14px;margin-bottom:8px}
  .ot .t small{font-weight:400;color:var(--muted)}
  .radek{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12.5px}
  .radek .n{flex:0 0 50%}
  .radek .bar{flex:1;height:13px;background:var(--green-soft);border-radius:99px;overflow:hidden}
  .radek .bar i{display:block;height:100%;background:var(--green);border-radius:99px}
  .radek .c{flex:0 0 62px;text-align:right;font-weight:700;font-size:12px}
  .radek .c small{font-weight:400;color:var(--muted)}
  .hist{display:flex;align-items:flex-end;gap:3px;height:34px;max-width:420px}
  .hist span{flex:1;background:var(--green);border-radius:3px 3px 0 0}
  .hist-pop{display:flex;gap:3px;max-width:420px}
  .hist-pop span{flex:1;text-align:center;font-size:10.5px;color:var(--ink-soft)}
  .nacitam{text-align:center;padding:60px 0;color:var(--muted)}
  .pill{padding:8px 13px;font-size:13.5px;font-family:inherit;cursor:pointer;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink-soft)}
</style>
</head>
<body>
<header class="app"><div class="app-in">
  <div class="brand"><b>ELKOPLAST CZ</b><span>Výsledky průzkumu · spokojenost zákazníků e-shopu</span></div>
</div></header>
<main id="obsah"><div class="nacitam">Načítám výsledky…</div></main>
<script>
'use strict';
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(x,des){return x.toFixed(des==null?2:des).replace('.',',');}
var DATA=null;
function render(d){
  DATA=d;
  var h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><h1>Jak jsou zákazníci spokojení se shop.elkoplast.cz?</h1>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
      '<button class="pill" style="border-color:var(--green);color:var(--green-d);font-weight:700" onclick="stahni()">⬇ CSV</button>'+
      '<button class="pill" id="btnPptx" style="border-color:var(--green);color:var(--green-d);font-weight:700" onclick="stahniPptx()">⬇ PowerPoint (PPTX)</button></div></div>'+
    '<p class="hint">Průběžné výsledky anonymního dotazníku (NPS, CSAT, Heureka standard). Kontakty ani volné odpovědi se ve veřejném náhledu nezobrazují.</p>'+
    '<div class="tiles" style="margin-top:14px">'+
      '<div><b>'+d.respondentu+'</b><span>respondentů</span></div>'+
      '<div><b>'+d.dokonceno+'</b><span>dokončeno</span></div>'+
      '<div><b>'+(d.nps.n?((d.nps.score>0?'+':'')+d.nps.score):'—')+'</b><span>NPS'+(d.nps.n?' ('+d.nps.prom+'↑ '+d.nps.det+'↓)':'')+'</span></div>'+
      '<div><b>'+(d.csat.n?fmt(d.csat.avg)+' / 5':'—')+'</b><span>celková spokojenost</span></div></div></div>';
  d.sekce.forEach(function(s){
    var inner='';
    s.otazky.forEach(function(q){
      if(q.typ==='moznosti'){
        if(!q.n){ inner+=blok(q,'<p class="hint">zatím bez odpovědí</p>'); return; }
        var max=Math.max(1,...q.polozky.map(p=>p.pocet));
        inner+=blok(q,q.polozky.map(p=>'<div class="radek"><span class="n">'+esc(p.t)+'</span><span class="bar"><i style="width:'+Math.round(p.pocet/max*100)+'%"></i></span><span class="c">'+p.pocet+'× <small>'+(q.n?Math.round(p.pocet/q.n*100):0)+'%</small></span></div>').join(''));
      }else if(q.typ==='skala'){
        if(!q.n&&!q.nehodnotim){ inner+=blok(q,'<p class="hint">zatím bez odpovědí</p>'); return; }
        var mx=Math.max(1,...q.dist);
        var g='<div class="hist">'+q.dist.map(function(c,i){return '<span title="'+(q.min+i)+': '+c+'×" style="height:'+Math.max(10,Math.round(c/mx*100))+'%;opacity:'+(c?1:.15)+'"></span>';}).join('')+'</div>'+
          '<div class="hist-pop">'+q.dist.map(function(_,i){return '<span>'+(q.min+i)+'</span>';}).join('')+'</div>'+
          '<div style="font-size:13px;margin-top:5px"><strong>Ø '+(q.n?fmt(q.avg):'—')+'</strong> <span class="hint">('+q.n+' odp.'+(q.nehodnotim?(' · '+q.nehodnotim+'× nehodnotí'):'')+')</span></div>';
        inner+=blok(q,g);
      }else if(q.typ==='kategorie'){
        if(!q.polozky.length){ inner+=blok(q,'<p class="hint">zatím bez odpovědí</p>'); return; }
        inner+=blok(q,q.polozky.map(p=>'<div class="radek"><span class="n">'+esc(p.t)+'</span><span class="bar"><i style="width:'+Math.round(p.avg/5*100)+'%"></i></span><span class="c">Ø '+fmt(p.avg,1)+' <small>('+p.n+'×)</small></span></div>').join(''));
      }else{
        inner+=blok(q,'<p class="hint">'+q.n+' odpovědí — volné texty se veřejně nezobrazují</p>');
      }
    });
    if(inner) h+='<div class="card"><div class="sekce-nadpis">'+esc(s.nazev)+(s.jen!=='vsichni'?' <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">· jen '+(s.jen==='kupujici'?'kupující':'nekupující')+'</span>':'')+'</div>'+inner+'</div>';
  });
  h+='<p class="hint" style="text-align:center">ELKOPLAST CZ, s.r.o. · průzkum je anonymní, zobrazují se pouze souhrnné výsledky</p>';
  $('obsah').innerHTML=h;
}
function blok(q,inner){ return '<div class="ot"><div class="t">'+esc(q.text)+' <small>('+(q.n||0)+' odp.)</small></div>'+inner+'</div>'; }
function csvBunka(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';}
function stahni(){
  var d=DATA, r=[['Spokojenost zákazníků shop.elkoplast.cz — souhrn výsledků']];
  r.push(['Staženo',new Date().toLocaleString('cs-CZ')]);
  r.push(['Respondentů',d.respondentu],['Dokončeno',d.dokonceno]);
  r.push(['NPS',(d.nps.score>0?'+':'')+d.nps.score,'promotérů',d.nps.prom,'kritiků',d.nps.det,'z',d.nps.n]);
  r.push(['CSAT (celková spokojenost, 1–5)',d.csat.n?d.csat.avg.toFixed(2).replace('.',','):'',' z '+d.csat.n]); r.push([]);
  d.sekce.forEach(function(s){
    r.push([]); r.push(['— '+s.nazev+(s.jen!=='vsichni'?' (jen '+(s.jen==='kupujici'?'kupující':'nekupující')+')':'')+' —']);
    s.otazky.forEach(function(q){
      if(q.typ==='moznosti'){ r.push([q.text,'odpovědí:',q.n]); q.polozky.forEach(p=>r.push(['',p.t,p.pocet,(q.n?Math.round(p.pocet/q.n*100)+' %':'')])); }
      else if(q.typ==='skala'){ r.push([q.text,'Ø '+(q.n?q.avg.toFixed(2).replace('.',','):'—'),'odpovědí:',q.n,(q.nehodnotim?('nehodnotí: '+q.nehodnotim):'')]);
        var lab=[]; for(var v=q.min;v<=q.max;v++) lab.push(v); r.push(['','rozdělení '+q.min+'–'+q.max].concat(q.dist.map((c,i)=>lab[i]+': '+c))); }
      else if(q.typ==='kategorie'){ r.push([q.text]); q.polozky.forEach(p=>r.push(['',p.t,'Ø '+p.avg.toFixed(2).replace('.',','),'(n='+p.n+')'])); }
      else { r.push([q.text,'volných odpovědí:',q.n,'(text se veřejně nezobrazuje)']); }
    });
  });
  var csv=r.map(x=>x.map(csvBunka).join(';')).join('\r\n');
  var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}), u=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=u; a.download='vysledky-spokojenost-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); URL.revokeObjectURL(u);
}
var GRN='0E8A43', GRND='08612D', INK='111713', MUT='8A948C';
function nactiPptx(cb){
  if(window.PptxGenJS){cb();return;}
  var b=$('btnPptx'); if(b){b.disabled=true;b.textContent='Připravuji…';}
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';
  s.onload=function(){ if(b){b.disabled=false;b.textContent='⬇ PowerPoint (PPTX)';} cb(); };
  s.onerror=function(){ if(b){b.disabled=false;b.textContent='⬇ PowerPoint (PPTX)';} alert('Nepodařilo se načíst generátor prezentace. Zkuste to prosím znovu.'); };
  document.head.appendChild(s);
}
function nadpis(s,t){ s.addText(t,{x:0.7,y:0.45,w:12,h:0.7,fontSize:22,bold:true,color:INK}); s.addShape('line',{x:0.7,y:1.2,w:11.9,h:0,line:{color:GRN,width:2}}); }
function stahniPptx(){ nactiPptx(function(){
  var d=DATA, p=new PptxGenJS(); p.defineLayout({name:'W',width:13.33,height:7.5}); p.layout='W';
  // titulní
  var s=p.addSlide(); s.background={color:GRN};
  s.addText('Spokojenost zákazníků',{x:0.7,y:2.3,w:12,h:1.1,color:'FFFFFF',fontSize:40,bold:true});
  s.addText('shop.elkoplast.cz · ELKOPLAST CZ',{x:0.7,y:3.5,w:12,h:0.5,color:'D9F0E2',fontSize:18});
  s.addText('Průběžné výsledky k '+new Date().toLocaleDateString('cs-CZ')+' · '+d.respondentu+' respondentů ('+d.dokonceno+' dokončeno)',{x:0.7,y:4.1,w:12,h:0.5,color:'D9F0E2',fontSize:14});
  // KPI
  s=p.addSlide(); nadpis(s,'Hlavní metriky');
  var kpis=[[(d.nps.n?((d.nps.score>0?'+':'')+d.nps.score):'—'),'NPS (ochota doporučit)'],[(d.csat.n?d.csat.avg.toFixed(2).replace('.',',')+' / 5':'—'),'Celková spokojenost (CSAT)'],[d.respondentu,'respondentů'],[d.dokonceno,'dokončených dotazníků']];
  kpis.forEach(function(a,i){ var x=0.7+i*3.12; s.addShape('roundRect',{x:x,y:2,w:2.9,h:2.2,fill:{color:'E3F3E9'},line:{color:GRN,width:1},rectRadius:0.1}); s.addText(String(a[0]),{x:x,y:2.35,w:2.9,h:0.9,fontSize:34,bold:true,color:GRND,align:'center'}); s.addText(a[1],{x:x+0.15,y:3.35,w:2.6,h:0.7,fontSize:12,color:INK,align:'center'}); });
  if(d.nps.n) s.addText('NPS = podíl promotérů (9–10) minus kritiků (0–6). '+d.nps.prom+' promotérů, '+d.nps.det+' kritiků z '+d.nps.n+' hodnotících.',{x:0.7,y:4.6,w:12,h:0.5,fontSize:12,color:MUT});
  // všechny škály — porovnání průměrů
  var skaly=[]; d.sekce.forEach(function(sek){ sek.otazky.forEach(function(q){ if(q.typ==='skala'&&q.n&&q.max<=5) skaly.push([q.text,q.avg]); }); });
  if(skaly.length){ s=p.addSlide(); nadpis(s,'Spokojenost podle oblastí (průměr 1–5)');
    s.addChart(p.ChartType.bar,[{name:'Ø',labels:skaly.map(x=>zkrat(x[0],42)),values:skaly.map(x=>Math.round(x[1]*100)/100)}],
      {x:0.6,y:1.5,w:12.1,h:5.6,barDir:'bar',showValue:true,chartColors:[GRN],catAxisLabelFontSize:9,valAxisMinVal:0,valAxisMaxVal:5,showLegend:false,dataLabelFontSize:10,dataLabelColor:GRND}); }
  // výběrové otázky — jeden graf na slide, po dvou vedle sebe pro top otázky
  var vybery=[]; d.sekce.forEach(function(sek){ sek.otazky.forEach(function(q){ if(q.typ==='moznosti'&&q.n) vybery.push(q); }); });
  vybery.forEach(function(q){
    var pol=q.polozky.filter(x=>x.pocet>0).sort((a,b)=>b.pocet-a.pocet).slice(0,8); if(!pol.length) return;
    var s=p.addSlide(); nadpis(s,zkrat(q.text,80));
    s.addText('Odpovědí: '+q.n,{x:0.7,y:1.25,w:12,h:0.35,fontSize:12,color:MUT});
    s.addChart(p.ChartType.bar,[{name:'počet',labels:pol.map(x=>zkrat(x.t,46)),values:pol.map(x=>x.pocet)}],
      {x:0.6,y:1.7,w:12.1,h:5.3,barDir:'bar',showValue:true,chartColors:[GRN],catAxisLabelFontSize:11,valAxisHidden:true,showLegend:false,dataLabelFontSize:11,dataLabelColor:GRND});
  });
  // kategorie-skala
  d.sekce.forEach(function(sek){ sek.otazky.forEach(function(q){ if(q.typ==='kategorie'&&q.polozky.length){
    var s=p.addSlide(); nadpis(s,zkrat(q.text,80));
    s.addChart(p.ChartType.bar,[{name:'Ø',labels:q.polozky.map(x=>zkrat(x.t,40)),values:q.polozky.map(x=>Math.round(x.avg*100)/100)}],
      {x:0.6,y:1.6,w:12.1,h:5.4,barDir:'bar',showValue:true,chartColors:['18A957'],catAxisLabelFontSize:11,valAxisMinVal:0,valAxisMaxVal:5,showLegend:false,dataLabelFontSize:11,dataLabelColor:GRND});
  }}); });
  p.writeFile({fileName:'vysledky-spokojenost-'+new Date().toISOString().slice(0,10)+'.pptx'});
});}
function zkrat(t,n){ t=String(t).replace(/[\uD800-\uDFFF]./g,'').trim(); return t.length>n?t.slice(0,n-1)+'…':t; }
fetch('/api/spokojenost/verejne-vysledky?k='+encodeURIComponent(location.pathname.slice(1)),{cache:'no-store'})
  .then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(render)
  .catch(function(){ $('obsah').innerHTML='<div class="nacitam">Výsledky se nepodařilo načíst. <br><button class="pill" style="margin-top:10px" onclick="location.reload()">Zkusit znovu</button></div>'; });
</script>
</body>
</html>
