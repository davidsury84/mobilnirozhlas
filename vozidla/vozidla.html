<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vozový park · Intranet ELKOPLAST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0e8a43; --green-2:#12a350; --green-d:#0a6b34; --green-soft:#e6f6ec;
  --ink:#0f1512; --ink-soft:#5b635c; --faint:#8b938c;
  --bg:#eef1ec; --bg-2:#f7f9f5; --paper:#fff; --line:#e3e7e0; --line-strong:#cdd3ca;
  --yellow-soft:#fff6d2; --amber:#7a5c0e; --red:#c23636; --red-soft:#fbe9e7;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --shadow:0 1px 2px rgba(15,21,18,.04),0 10px 30px rgba(15,21,18,.07);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-2);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.wrap{max-width:1240px;margin:0 auto;padding:20px}
.mono{font-family:var(--mono)}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.top .ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#15ab57,#0a6b34);display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 6px 16px rgba(10,107,52,.28)}
.top h1{font-family:var(--cond);font-weight:700;font-size:22px;margin:0}
.top .sub{font-size:12.5px;color:var(--ink-soft)}
.top .sp{flex:1}

.btn{border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--green);color:var(--green-d)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-d);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--red);border-color:#e7c3c0}
.btn.danger:hover{background:var(--red-soft);color:var(--red)}

.tabs{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:5px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 15px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-soft)}
.tabs button.on{background:var(--green-soft);color:var(--green-d)}

.stat{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat .s{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 16px;min-width:120px;
  font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.stat .s:hover{border-color:var(--line-strong);box-shadow:0 2px 8px rgba(28,29,26,.07)}
.stat .s:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.stat .s.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.stat .s .f{font-size:10.5px;color:var(--faint);margin-top:4px;letter-spacing:.3px}
.stat .s.on .f{color:var(--green)}
.stat .s .n{font-family:var(--cond);font-weight:700;font-size:22px;line-height:1}
.stat .s .l{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.stat .s.warn{border-color:#e8d9a8;background:var(--yellow-soft)}
.stat .s.warn .n{color:var(--amber)}
.stat .s.bad{border-color:#e7c3c0;background:var(--red-soft)}
.stat .s.bad .n{color:var(--red)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card .h{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#fbfdfb,#f6faf6);flex-wrap:wrap}
.card .h h2{font-family:var(--cond);font-weight:700;font-size:16px;margin:0}
.card .h .sp{flex:1}
.card .b{padding:16px 18px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-strong)}
th.rad{cursor:pointer;user-select:none;white-space:nowrap}
th.rad:hover{color:var(--ink);background:var(--bg-2)}
th.rad.akt{color:var(--green);border-bottom-color:var(--green)}
th.rad .sip{opacity:0;font-size:10px}
th.rad:hover .sip{opacity:.55}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fafcf9}
td.num{font-family:var(--mono);white-space:nowrap}
/* Široká tabulka přehledu: karta má overflow:hidden, takže bez tohohle obalu
   se pravý okraj (tlačítko Detail) jen oříznul a nešlo k němu dorolovat. */
.tabWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabWrap table{min-width:1080px}
/* Akce zůstanou vidět i při rolování doprava. */
.tabWrap th.akce,.tabWrap td.akce{position:sticky;right:0;background:var(--paper);
  box-shadow:-8px 0 8px -8px rgba(15,21,18,.18);white-space:nowrap;text-align:right}
.tabWrap tr:hover td.akce{background:#fafcf9}
.tabWrap th.akce{background:var(--paper);z-index:2}

.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green-d)}
.pill.warn{background:var(--yellow-soft);color:var(--amber)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.mute{background:#eef1ec;color:var(--ink-soft)}

.spz{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.4px}
.mut{color:var(--ink-soft);font-size:12.5px}
.f{display:block;margin-bottom:10px}
.f span{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:3px;font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--paper)}
.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}

.modal{position:fixed;inset:0;background:rgba(15,21,18,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:24px 14px}
.modal.on{display:flex}
.modal .box{background:var(--paper);border-radius:16px;max-width:920px;width:100%;box-shadow:0 20px 60px rgba(15,21,18,.3)}
.modal .box .h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .box .h h2{font-family:var(--cond);font-size:18px;margin:0;flex:1}
.modal .box .b{padding:18px}
.modal .box .f2{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* Políčka, do kterých se dá psát rovnou v tabulce. Dřív byla průhledná a nebylo
   poznat, že jde o políčko — proto mají vlastní podklad, rámeček a tužku. */
.inl{width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:4px 6px;font-size:12.5px;
  background:var(--bg-2);font-family:inherit;color:var(--ink);transition:border-color .12s,background .12s,box-shadow .12s}
.inl:hover{border-color:var(--green);background:var(--paper)}
.inl:focus{outline:none;border-color:var(--green);background:var(--paper);box-shadow:0 0 0 3px rgba(14,138,67,.14)}
.inl::placeholder{color:var(--faint);font-style:italic}
/* prázdné políčko = něco chybí; ať to táhne oko a je jasné, že se čeká na doplnění */
.inl:placeholder-shown,.inl.chybi{background:var(--yellow-soft);border-color:#e8d9a8;border-style:dashed}
.inl:placeholder-shown:hover,.inl:placeholder-shown:focus,.inl.chybi:hover,.inl.chybi:focus{border-style:solid}
.inl.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.2px}
/* tužka u editovatelného políčka — ať je poznat, že se do něj dá psát */
.pero{position:relative;display:block}
.pero .inl{padding-right:21px}
.pero .ic{position:absolute;right:5px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--green);opacity:.75;pointer-events:none}
.pero:hover .ic{opacity:1}
.pero:focus-within .ic{opacity:0}
/* vysvětlivka nad tabulkou */
.napoveda{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.napoveda .vz{display:inline-block;border:1px dashed #e8d9a8;background:var(--yellow-soft);border-radius:5px;padding:1px 14px 1px 6px;position:relative}
.napoveda .vz::after{content:"✎";position:absolute;right:4px;top:0;font-size:10px;color:var(--green)}
.inl.num{text-align:right}
td.num .pero{max-width:104px;margin-left:auto}
/* šipky u number inputu ukrajovaly šířku, takže rok nebyl vidět celý */
.inl[type=number]{-moz-appearance:textfield;appearance:textfield;text-align:center;min-width:54px}
.inl[type=number]::-webkit-outer-spin-button,.inl[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inl[type=date]{min-width:118px}
.radekStav{font-size:10.5px;color:var(--ink-soft);white-space:nowrap}
.ac{position:relative}
.ac .acin{width:100%;padding:8px 30px 8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--paper)}
.ac .acin:focus{outline:none;border-color:var(--green)}
.ac .acx{position:absolute;right:6px;top:6px;border:0;background:transparent;color:var(--faint);font-size:13px;padding:2px 4px;line-height:1}
.ac .acx:hover{color:var(--red)}
.acbox{position:absolute;left:0;right:0;top:100%;z-index:60;background:var(--paper);border:1px solid var(--line-strong);
  border-radius:10px;box-shadow:0 12px 30px rgba(15,21,18,.16);max-height:260px;overflow:auto;display:none;margin-top:3px}
.acbox.on{display:block}
.acbox .it{padding:7px 11px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
.acbox .it:last-child{border-bottom:0}
.acbox .it:hover,.acbox .it.sel{background:var(--green-soft)}
.acbox .it b{font-weight:600}
.acbox .it .m{color:var(--ink-soft);font-size:11.5px}
.acbox .prazdno{padding:10px 11px;color:var(--ink-soft);font-size:12.5px}
.fotky{display:flex;gap:10px;flex-wrap:wrap}
.fotky .fo{position:relative;width:132px}
.fotky .fo img{width:132px;height:99px;object-fit:cover;border-radius:9px;border:1px solid var(--line-strong);display:block;cursor:zoom-in}
.fotky .fo .x{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.92);border:1px solid var(--line-strong);border-radius:6px;padding:1px 6px;font-size:12px;line-height:1.4}
.fotky .fo .p{font-size:11px;color:var(--ink-soft);margin-top:3px;word-break:break-word}

.upoz{display:flex;flex-direction:column;gap:4px}
.upoz .u{font-size:12.5px}
.upoz .u.urg{color:var(--red);font-weight:600}
.upoz .u.vic{color:var(--faint);font-size:11.5px}
.hint{font-size:12px;color:var(--ink-soft);line-height:1.5}
.empty{padding:30px;text-align:center;color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:90;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.sm-doc{max-width:900px;font-size:14px;line-height:1.65}
.sm-doc h1{font-family:var(--cond);font-size:22px;margin:0 0 6px}
.sm-doc h2{font-family:var(--cond);font-size:16px;margin:22px 0 6px;color:var(--green-d)}
.sm-doc .uvod{color:var(--ink-soft);font-size:13px}
.sm-doc ul{margin:6px 0 6px 18px;padding:0}
.sm-doc li{margin-bottom:4px}
.sm-doc .odkaz{background:var(--green-soft);border:1px solid #cfe9d8;border-radius:10px;padding:10px 13px;font-size:13.5px}
.sm-doc a{color:var(--green-d)}
@media print{ .top,.tabs,.btn,.card .h{display:none!important} .card{border:0;box-shadow:none} .wrap{padding:0} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="ic">🚚</div>
    <div>
      <h1>Vozový park</h1>
      <div class="sub" id="podtitul">Načítám…</div>
    </div>
    <div class="sp"></div>
    <div class="tabs" id="zalozky"></div>
  </div>

  <div id="obsah"><div class="card"><div class="empty">Načítám data…</div></div></div>
</div>

<div class="modal" id="modal"><div class="box">
  <div class="h"><h2 id="mTitul">—</h2><button class="btn sm" onclick="zavri()">Zavřít</button></div>
  <div class="b" id="mObsah"></div>
  <div class="f2" id="mPaticka"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cis=n=>(n==null||n==="")?"—":Number(n).toLocaleString("cs-CZ");
const dat=s=>s?new Date(s+(s.length===10?"T00:00:00":"")).toLocaleDateString("cs-CZ"):"—";
let D=null, ZALOZKA="prehled", FILTR={q:"",stredisko:"",jen:"",radit:"",smer:1};

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2600);}

/* ---------- export tabulek ----------
   Každá tabulka v modulu má vedle sebe „⬇ CSV" a stáhne přesně to, co je vidět
   (včetně filtru a řazení). Středníky a BOM, ať to Excel otevře rovnou bez průvodce. */
function csvPole(x){ const t=String(x==null?"":x); return /[";\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; }
function exportCsv(nazev,hlavicka,radky){
  if(!radky.length){ toast("Tabulka je prázdná — není co exportovat."); return; }
  const txt="\uFEFF"+[hlavicka].concat(radky).map(r=>r.map(csvPole).join(";")).join("\r\n");
  const url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");
  a.href=url; a.download=nazev+"-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast("Staženo "+radky.length+" řádků.");
}
function btnExport(fn,titul){ return '<button class="btn sm" title="'+esc(titul||"Stáhnout tuto tabulku jako CSV pro Excel")+'" onclick="'+fn+'">⬇ CSV</button>'; }
const expCis=n=>(n==null||n===""||isNaN(n))?"":Number(n);       // do CSV čísla bez mezer, ať se dá počítat
const expDes=n=>(n==null||n==="")?"":String(n).replace(".",",");  // desetinná čárka — jinak to Excel bere jako text
const expMesic=d=>d?(d.m+"/"+d.y):"";
function zavri(){$("#modal").classList.remove("on");}
function modal(titul,obsah,paticka){$("#mTitul").textContent=titul;$("#mObsah").innerHTML=obsah;$("#mPaticka").innerHTML=paticka||'<button class="btn" onclick="zavri()">Zavřít</button>';$("#modal").classList.add("on");}
async function api(cesta,telo){
  const o=telo?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(telo)}:{cache:"no-store"};
  const r=await fetch(cesta,o); const j=await r.json().catch(()=>({}));
  if(!r.ok||j.chyba)throw new Error(j.chyba||("Chyba "+r.status));
  return j;
}
async function nacti(){
  try{ D=await api("/api/vozidla/data"); vykresli(); }
  catch(e){ $("#obsah").innerHTML='<div class="card"><div class="empty">'+esc(e.message)+'</div></div>'; }
}

/* ---------- záhlaví ---------- */
function role(){
  const m=D.me, r=[];
  if(m.admin)r.push("správce modulu");
  if(m.spravce)r.push("správce vozu");
  if(m.zodpovedny)r.push("zodpovědná osoba za středisko "+m.strediska.join(", "));
  return r.join(" · ")||"host";
}
function vykresliZalozky(){
  const z=[["prehled","Vozidla"]];
  if(D.me.spravce)z.push(["moje","Moje vozidla"]);
  if(D.me.admin||D.me.zodpovedny)z.push(["strediska","Střediska a odpovědnost"]);
  if(D.me.admin||D.me.zodpovedny)z.push(["vyrazeni","Vyřazení a ocenění"]);
  z.push(["smernice","Směrnice"]);
  if(D.me.admin)z.push(["nastaveni","Nastavení"]);
  $("#zalozky").innerHTML=z.map(([k,t])=>'<button class="'+(ZALOZKA===k?"on":"")+'" onclick="prepni(\''+k+'\')">'+t+'</button>').join("");
}
function prepni(k){ZALOZKA=k;vykresli();}

/* ---------- přehled ---------- */
// V řádku přehledu stačí to nejdůležitější — celý výpis je v detailu vozidla.
// Dřív se vypisovala všechna upozornění pod sebe a řádky byly vysoké přes půl obrazovky.
function upozStrucne(v){
  const u=v.stav_.upozorneni; if(!u.length)return '';
  const poradi=u.slice().sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0));
  const prvni=poradi.slice(0,2), zbyva=poradi.length-prvni.length;
  return '<div class="upoz">'+prvni.map(x=>'<span class="u'+(x.urgent?" urg":"")+'">'+esc(x.text)+'</span>').join("")
    +(zbyva?'<span class="u vic">+ '+zbyva+' '+(zbyva===1?"další":zbyva<5?"další":"dalších")+'</span>':'')+'</div>';
}
function planPill(v){
  if(!v.plan)return '';
  return ' <span class="pill '+(v.plan==="likvidace"?"bad":"warn")+'" title="'+esc(v.planText)+(v.planKdo?' · '+esc(v.planKdo):'')+'">'+(v.plan==="likvidace"?"k likvidaci":"k prodeji")+'</span>';
}
// Návrh na vyřazení (obměnu) rovnou v přehledu — ne až v záložce Vyřazení a ocenění.
function vyrazeniBunka(v){
  const o=v.oceneni||{};
  if(v.stav==="prodano"||v.stav==="vyrazeno") return archivBunka(v);
  if(v.plan) return planPill(v).trim()+(o.termin?'<div class="mut">termín '+fm(o.termin)+'</div>':'');
  if(!o.termin) return '<span class="mut">—</span>';
  if(o.terminNyni) return '<span class="pill bad">nyní</span>'+(o.duvod?'<div class="mut">'+esc(o.duvod)+'</div>':'');
  const doRoka=o.mesicuDoTerminu!=null&&o.mesicuDoTerminu<=12;
  return '<span class="pill '+(doRoka?"warn":"mute")+'">'+fm(o.termin)+'</span>'+(o.duvod?'<div class="mut">'+esc(o.duvod)+'</div>':'');
}
function stavPill(v){
  const s=v.stav_;
  if(v.stav!=="aktivni")return '<span class="pill mute">'+esc(D.stavy[v.stav]||v.stav)+'</span>'+planPill(v);
  if(v.plan)return planPill(v).trim();
  const urg=s.upozorneni.some(u=>u.urgent);
  if(urg)return '<span class="pill bad">vyžaduje zásah</span>';
  // chybějící údaje po importu evidence nejsou problém vozidla, ale nedoplněná evidence
  const jenDoplnit=s.upozorneni.every(u=>["stk-chybi","vin","km","inventura","spravce"].indexOf(u.druh)>=0);
  if(s.upozorneni.length)return '<span class="pill warn">'+(jenDoplnit?"doplnit údaje":s.upozorneni.length+" upozornění")+'</span>';
  return '<span class="pill ok">v pořádku</span>';
}
function stkPill(v){
  const d=v.stav_.dnyStk;
  if(d===null)return '<span class="pill bad">nezadáno</span>';
  if(d<0)return '<span class="pill bad">propadlá ('+dat(v.stkDo)+')</span>';
  if(d<=30)return '<span class="pill warn">'+dat(v.stkDo)+' · '+d+' dní</span>';
  return '<span class="pill ok">'+dat(v.stkDo)+'</span>';
}
function filtrovana(){
  let vs=D.vozidla.slice();
  if(ZALOZKA==="moje")vs=vs.filter(v=>v.spravceEmail===D.me.email);
  const tok=bezDiak(FILTR.q).split(/\s+/).filter(Boolean);
  if(tok.length)vs=vs.filter(v=>{
    const k=v.spravceKontakt||{};
    const seno=bezDiak([v.spz,v.znacka,v.model,v.vin,v.stredisko,v.evidCislo,v.cisloTp,
      v.spravceJmeno,v.spravceZTabulky,k.jmeno,k.email,k.pozice].join(" "));
    return tok.every(t=>seno.includes(t));
  });
  // Prodaná a vyřazená auta mají vlastní box — v základním přehledu by jen překážela.
  // Když někdo hledá podle SPZ, najde i je.
  if(!FILTR.jen&&!tok.length)vs=vs.filter(v=>v.stav!=="prodano"&&v.stav!=="vyrazeno");
  if(FILTR.jen==="archiv")vs=vs.filter(v=>v.stav==="prodano"||v.stav==="vyrazeno");
  if(FILTR.stredisko)vs=vs.filter(v=>v.stredisko===FILTR.stredisko);
  if(FILTR.jen==="provoz")vs=vs.filter(v=>v.stav==="aktivni");
  if(FILTR.jen==="stk")vs=vs.filter(v=>v.stav_.upozorneni.some(u=>u.druh==="stk"));
  if(FILTR.jen==="doplnit")vs=vs.filter(v=>v.stav_.upozorneni.some(u=>["stk-chybi","vin","spravce"].indexOf(u.druh)>=0));
  if(FILTR.jen==="nepotvrzeno")vs=vs.filter(v=>v.spravceEmail&&!v.spravcePotvrzen);
  if(FILTR.jen==="km")vs=vs.filter(v=>v.stav_.chybejiciRoky.length);
  if(FILTR.jen==="inv")vs=vs.filter(v=>v.stav_.inventura.potreba);
  if(FILTR.jen==="vyraz")vs=vs.filter(kVyrazeni);
  if(FILTR.radit&&SLOUPCE[FILTR.radit])return seradit(vs);
  return vs.sort((a,b)=>{
    const ua=a.stav_.upozorneni.some(u=>u.urgent)?0:a.stav_.upozorneni.length?1:2;
    const ub=b.stav_.upozorneni.some(u=>u.urgent)?0:b.stav_.upozorneni.length?1:2;
    return ua-ub || String(a.spz||"").localeCompare(String(b.spz||""),"cs");
  });
}
/* Řazení klikem na záhlaví sloupce (jako v Excelu). Vozidla bez údaje jdou
   vždycky na konec, v obou směrech — prázdný tachometr není „nula km". */
function tachometr(v){ const z=(v.km||[]).slice().sort((a,b)=>a.rok-b.rok).pop(); return z?Number(z.km):null; }
const SLOUPCE={
  spz:      {popis:"Vozidlo",      text:true,  hodnota:v=>[v.spz,v.znacka,v.model].filter(Boolean).join(" ")},
  vin:      {popis:"VIN",          text:true,  hodnota:v=>v.vin||""},
  rok:      {popis:"Rok",          hodnota:v=>Number(v.rokVyroby)||null},
  spravce:  {popis:"Správce vozu", text:true,  hodnota:v=>((v.spravceKontakt&&v.spravceKontakt.jmeno)||v.spravceJmeno||"")},
  stredisko:{popis:"Středisko",    text:true,  hodnota:v=>v.stredisko||""},
  stk:      {popis:"Technická do", hodnota:v=>v.stkDo?Date.parse(v.stkDo+"T00:00:00"):null},
  km:       {popis:"Tachometr",    hodnota:v=>tachometr(v)},
  najezd:   {popis:"Nájezd",       hodnota:v=>(v.stav_.prodej&&v.stav_.prodej.najezd)||null},
  vyrazeni: {popis:"Návrh na vyřazení", hodnota:v=>{const o=v.oceneni||{}; return o.termin?(o.termin.y*12+o.termin.m):null;}},
  stav:     {popis:"Stav",         hodnota:v=>v.stav_.upozorneni.filter(u=>u.urgent).length*100+v.stav_.upozorneni.length},
};
function seradit(vs){
  const sl=SLOUPCE[FILTR.radit], smer=FILTR.smer<0?-1:1;
  return vs.sort((a,b)=>{
    const x=sl.hodnota(a), y=sl.hodnota(b);
    const prazdne=h=>h==null||h==="";
    if(prazdne(x)&&prazdne(y))return String(a.spz||"").localeCompare(String(b.spz||""),"cs");
    if(prazdne(x))return 1;            // bez údaje vždycky dolů
    if(prazdne(y))return -1;
    const r=sl.text?String(x).localeCompare(String(y),"cs"):(x-y);
    return r*smer || String(a.spz||"").localeCompare(String(b.spz||""),"cs");
  });
}
// 1. klik = vzestupně, 2. = sestupně, 3. = zpátky na výchozí pořadí (nejdřív problémy)
function radit(klic){
  if(FILTR.radit!==klic){ FILTR.radit=klic; FILTR.smer=1; }
  else if(FILTR.smer===1){ FILTR.smer=-1; }
  else { FILTR.radit=""; FILTR.smer=1; }
  vykresli();
}
function thRadit(klic,styl){
  const sl=SLOUPCE[klic], akt=FILTR.radit===klic;
  const sip=akt?(FILTR.smer===1?"▲":"▼"):"<span class=\"sip\">↕</span>";
  return '<th'+(styl?' style="'+styl+'"':'')+' class="rad'+(akt?" akt":"")+'"'
    +' title="'+(akt?(FILTR.smer===1?"Seřadit sestupně":"Zrušit řazení"):"Seřadit vzestupně")+'"'
    +' role="button" tabindex="0" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();radit(\''+klic+'\');}"'
    +' onclick="radit(\''+klic+'\')">'+esc(sl.popis)+' '+sip+'</th>';
}
/* Dlaždice nahoře: číslo i seznam za ním se počítají ze stejné funkce,
   aby v okně bylo vždycky přesně tolik aut, kolik dlaždice ukazuje. */
// Vůz, u kterého je obměna na stole: termín vyřazení je tady nebo do roka, nebo už má plán.
function kVyrazeni(v){
  const o=v.oceneni||{};
  return !!v.plan || !!o.terminNyni || (o.mesicuDoTerminu!=null&&o.mesicuDoTerminu<=12);
}
function statVozidla(klic){
  const akt=D.vozidla.filter(v=>v.stav==="aktivni");
  const vs = klic==="stk"     ? akt.filter(v=>v.stav_.upozorneni.some(u=>u.druh==="stk"))
           : klic==="doplnit" ? akt.filter(v=>v.stav_.upozorneni.some(u=>["stk-chybi","vin","spravce"].indexOf(u.druh)>=0))
           : klic==="km"      ? akt.filter(v=>v.stav_.chybejiciRoky.length)
           : klic==="inv"     ? akt.filter(v=>v.stav_.inventura.potreba)
           : klic==="vyraz"   ? akt.filter(kVyrazeni)
           : klic==="archiv"  ? D.vozidla.filter(v=>v.stav==="prodano"||v.stav==="vyrazeno")
           : akt;
  return vs.slice().sort((a,b)=>{
    const ua=a.stav_.upozorneni.some(u=>u.urgent)?0:1, ub=b.stav_.upozorneni.some(u=>u.urgent)?0:1;
    return ua-ub || String(a.spz||"").localeCompare(String(b.spz||""),"cs");
  });
}
const STAT_POHLED={

      +moznostiSelect(v)+' <button class="btn sm" onclick="detail(\''+v.id+'\')">Detail</button></td>'
      +'</tr>';
  });
  h+='</tbody></table></div></div>';

}

/* ---------- našeptávač zaměstnanců ----------
   Vybírat člověka z 85 položek v rozbalovacím seznamu je utrpení. Tohle hledá
   při psaní v celém jméně, e-mailu, pozici i středisku, bez ohledu na diakritiku
   a na pořadí slov („sury david" najde i „Surý David"). */
function bezDiak(t){return String(t==null?"":t).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function lidi(){return (D.zamestnanci||[]);}
function osobaPodleMailu(em){return lidi().find(x=>x.email===String(em||"").toLowerCase())||null;}
function hleda(q){
  const tok=bezDiak(q).split(/\s+/).filter(Boolean);
  const vse=lidi();
  if(!tok.length)return vse.slice(0,50);
  return vse.filter(e=>{
    const seno=bezDiak([e.name,e.email,e.pozice,e.stredisko].join(" "));
    return tok.every(t=>seno.includes(t));
  }).slice(0,50);
}
let AC_SEL={};
const AC_AKCE={};   // co se má stát po výběru — např. rovnou uložit
const AC_POTVRD={};  // na co se zeptat, než se ✕ smaže už vyplněného člověka
function acHtml(id,email,placeholder,akce,potvrdit){
  if(akce)AC_AKCE[id]=akce;
  if(potvrdit)AC_POTVRD[id]=potvrdit;
  const k=osobaPodleMailu(email);
  return '<div class="ac">'
    +'<input type="hidden" id="'+id+'" value="'+esc(email||"")+'">'
    +'<input class="acin" id="'+id+'_in" autocomplete="off" placeholder="'+esc(placeholder||"Začni psát jméno, pozici nebo středisko…")+'"'
    +' value="'+esc(k?k.name:(email||""))+'"'
    +" oninput=\"acOtevri('"+id+"')\" onfocus=\"acOtevri('"+id+"')\" onkeydown=\"acKlavesa(event,'"+id+"')\">"
    +"<button type=\"button\" class=\"acx\" onclick=\"acZrus('"+id+"')\" title=\"Zrušit výběr\">✕</button>"
    +'<div class="acbox" id="'+id+'_box"></div></div>';
}
function acOtevri(id){
  const vstup=document.getElementById(id+"_in"), box=document.getElementById(id+"_box");
  if(!vstup||!box)return;
  const nalezeno=hleda(vstup.value);
  AC_SEL[id]=0;
  box.innerHTML=nalezeno.length
    ? nalezeno.map((e,i)=>'<div class="it'+(i===0?" sel":"")+'" data-em="'+esc(e.email)+'"'
        +" onmousedown=\"acVyber('"+id+"','"+esc(e.email)+"')\">"
        +'<b>'+esc(e.name)+'</b>'
        +'<div class="m">'+[e.pozice,e.stredisko].filter(Boolean).map(esc).join(" · ")+(e.telefon?' · '+esc(e.telefon):'')+'</div>'
        +'<div class="m">'+esc(e.email)+'</div></div>').join("")
    : '<div class="prazdno">Nikdo takový v databázi zaměstnanců není.</div>';
  box.classList.add("on");
}
function acVyber(id,email){
  const e=osobaPodleMailu(email);
  document.getElementById(id).value=email;
  document.getElementById(id+"_in").value=e?e.name:email;
  acZavri(id);
  if(AC_AKCE[id])AC_AKCE[id]();
}
function acZrus(id){
  // omylem kliknuté ✕ u přiřazeného člověka nemá tiše smazat správce vozu
  const hod=document.getElementById(id);
  if(hod&&hod.value&&AC_POTVRD[id]&&!confirm(AC_POTVRD[id]))return;
  document.getElementById(id).value="";
  document.getElementById(id+"_in").value="";
  acZavri(id);
  if(AC_AKCE[id])AC_AKCE[id]();
}
function acZavri(id){const b=document.getElementById(id+"_box");if(b)b.classList.remove("on");}
function acKlavesa(ev,id){
  const box=document.getElementById(id+"_box");if(!box)return;
  const it=[...box.querySelectorAll(".it")];
  if(ev.key==="Escape"){acZavri(id);return;}
  if(!it.length)return;
  if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){
    ev.preventDefault();
    AC_SEL[id]=Math.max(0,Math.min(it.length-1,(AC_SEL[id]||0)+(ev.key==="ArrowDown"?1:-1)));
    it.forEach((x,i)=>x.classList.toggle("sel",i===AC_SEL[id]));
    it[AC_SEL[id]].scrollIntoView({block:"nearest"});
  } else if(ev.key==="Enter"){
    ev.preventDefault();
    const x=it[AC_SEL[id]||0]; if(x)acVyber(id,x.dataset.em);
  }
}
document.addEventListener("mousedown",function(ev){
  if(!ev.target.closest(".ac")) document.querySelectorAll(".acbox.on").forEach(function(b){b.classList.remove("on");});
});

/* ---------- průběžné ukládání ----------
   Nikde se nemačká „Uložit": co se napíše nebo vybere, to se po chvilce samo uloží.
   U nového vozidla to neplatí — to by vznikl poloprázdný záznam po prvním písmenu. */
const ULOZ_T={};
function ulozZa(klic,ms,fn){ clearTimeout(ULOZ_T[klic]); ULOZ_T[klic]=setTimeout(fn,ms); }
/* Tachometr rovnou v přehledu: políčko je za letošní rok, starší zápisy zůstávají.
   Ukládá se až po opuštění políčka (onchange) — při psaní po číslicích by server
   hlásil „nižší než loni". */
function kmBunka(v,pk){
  const letos=new Date().getFullYear();
  const letosni=(v.km||[]).find(x=>Number(x.rok)===letos);
  return '<label class="pero" title="Klikni a zapiš, kolik má vůz teď na tachometru (rok '+letos+')">'
    +'<input class="inl num" id="in_'+v.id+'_km" type="number" min="0" step="1" autocomplete="off" inputmode="numeric"'
    +' placeholder="'+(pk?cis(pk.km):"zapsat km")+'" value="'+(letosni?letosni.km:"")+'"'
    +' onchange="ulozKmRadek(\''+v.id+'\',this)"><span class="ic">✎</span></label>'
    +'<div class="mut">'+(letosni?('za '+letos):(pk?('naposled '+pk.rok):'letos nezapsáno'))+'</div>';
}
async function ulozKmRadek(id,el){
  const hod=String(el.value||"").trim();
  if(hod==="")return;                      // prázdné pole nic nemaže
  // Překlep (5 místo 150 000) by server nechytil, když se opravuje letošní zápis.
  const v=vuz(id), nej=Math.max(0,...(v.km||[]).map(x=>Number(x.km)||0));
  if(nej&&Number(hod)<nej&&!confirm("Zapsali jste "+cis(Number(hod))+" km, ale poslední známý stav je "+cis(nej)+" km. Opravdu uložit?")){
    el.value=((v.km||[]).find(x=>Number(x.rok)===new Date().getFullYear())||{}).km||""; return;
  }
  stavUlozeni("rs_"+id,"ukládám…");
  try{
    await api("/api/vozidla/km",{id,rok:new Date().getFullYear(),km:Number(hod)});
    D=await api("/api/vozidla/data");
    stavUlozeni("rs_"+id,"uloženo ✓","var(--green-d)");
    setTimeout(vykresli,900);              // přepočítá nájezd, upozornění i dlaždice
  }catch(e){ stavUlozeni("rs_"+id,"neuloženo","var(--red)"); alert(e.message); }
}
function stavUlozeni(id,text,barva){
  const e=document.getElementById(id); if(!e)return;
  e.textContent=text; e.style.color=barva||"var(--ink-soft)";
  if(text==="uloženo ✓") setTimeout(()=>{ if(e.textContent==="uloženo ✓") e.textContent=""; },2500);
}

// Uloží to, co je zrovna vyplněné v řádku přehledu. Tabulku po uložení nepřekreslujeme,
// aby člověku nezmizelo políčko pod rukou — jen se potiše obnoví data a stav řádku.
async function ulozRadek(id,znovuVykreslit){
  const el=k=>document.getElementById("in_"+id+"_"+k);
  if(!el("vin"))return;
  stavUlozeni("rs_"+id,"ukládám…");
  const t={id, vin:el("vin").value, rokVyroby:el("rok").value};
  if(el("stk"))t.stkDo=el("stk").value;
  const sp=el("spravce"); if(sp)t.spravceEmail=sp.value;
  try{
    await api("/api/vozidla/vuz",t);
    D=await api("/api/vozidla/data");
    stavUlozeni("rs_"+id,"uloženo ✓","var(--green-d)");
    if(znovuVykreslit)setTimeout(vykresli,900);   // změna správce mění i odznaky a upozornění
  }catch(e){ stavUlozeni("rs_"+id,"neuloženo","var(--red)"); alert(e.message); }
}

// Žádost k jednomu vozidlu — rovnou z řádku přehledu nebo z detailu.
async function zadostVuz(id){
  let n; try{ n=await api("/api/vozidla/zadost",{nahled:true,id}); }catch(e){ alert(e.message); return; }
  if(!n.lide.length){
    alert(n.bezAdresata.length
      ? "Tomuhle vozidlu není komu žádost poslat — nemá správce ani zodpovědnou osobu za středisko."
      : "U tohoto vozidla nic nechybí.");
    return;
  }
  const z=n.lide[0], v=z.vozidla[0];
  if(!confirm("Poslat žádost o doplnění?\n\nKomu: "+(z.jmeno||z.email)+" ("+z.duvod+")\nVozidlo: "+v.spz+(v.popis?" "+v.popis:"")
    +"\nChybí: "+v.chybi.join(", ")
    +(z.naposled?("\n\nPoslední žádost: "+new Date(z.naposled).toLocaleDateString("cs-CZ")):"")
    +"\n\nPřidá se do jeho ranního souhrnu z intranetu."))return;
  try{
    const r=await api("/api/vozidla/zadost",{id,komu:[z.email]});
    zavri();
    toast(r.odeslano?("Žádost odeslána — "+(z.jmeno||z.email)):"E-mail se nepodařilo odeslat");
    await nacti();
  }catch(e){ alert(e.message); }
}
async function zadostOdeslat(){
  const komu=[...document.querySelectorAll(".zadostChk")].filter(c=>c.checked).map(c=>c.value);
  if(!komu.length){ alert("Nikdo není vybraný."); return; }
  if(!confirm("Odeslat žádost o doplnění údajů "+komu.length+" lidem?\n\nŽádost se přidá do jejich ranního souhrnu z intranetu — nechodí jako samostatný e-mail."))return;
  try{
    const r=await api("/api/vozidla/zadost",{komu});
    zavri();
    toast("Odesláno "+r.odeslano+" lidem"+(r.selhalo&&r.selhalo.length?(" · "+r.selhalo.length+" se nepodařilo"):""));
    if(r.selhalo&&r.selhalo.length)alert("Nepodařilo se odeslat na: "+r.selhalo.join(", "));
    await nacti();
  }catch(e){ alert(e.message); }
}

// Fotku z telefonu zmenšíme v prohlížeči, ať se nenahrávají desetimegové soubory.
function nahrajFoto(id,input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=async()=>{
      const max=1600, k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const data=c.toDataURL("image/jpeg",0.82);
      try{ await api("/api/vozidla/foto",{id,data,popis:f.name.replace(/\.[a-z0-9]+$/i,"").slice(0,120)});
        toast("Fotka uložena."); await nacti(); detail(id);
      }catch(e){alert(e.message);}
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
  input.value="";
}

        +'<button class="btn" onclick="ukonVyber(\''+v.id+'\',\'vyradit\')">✅ Zapsat vyřazení / likvidaci</button> '
        +(v.stav==="odstaveno"?'<button class="btn" onclick="ukonProvoz(\''+v.id+'\')">▶ Vrátit do provozu</button>':'<button class="btn" onclick="ukonVyber(\''+v.id+'\',\'odstavit\')">⏸ Odstavit</button>')
        +'<div class="hint" style="margin-top:8px">Plánovaný prodej vůz zveřejní zaměstnancům k odkupu na <a href="/vozidla/odkup" target="_blank" rel="noopener">/vozidla/odkup</a> za cenu obvyklou (tržní) — správce vozu dostane zprávu jako první. Prodej pod cenou obvyklou je u zaměstnance nepeněžním příjmem (daň + odvody). Až je prodáno nebo zlikvidováno, zapiš to tlačítkem výš — vozidlo se přesune do boxu prodaných a vyřazených a upomínky k němu skončí.</div></div>';
    } else if(D.me.admin){
      h+='<div style="margin-top:6px"><button class="btn sm" onclick="ukonProvoz(\''+v.id+'\')">↩ Vrátit do evidence (omyl v zápisu)</button></div>';
    }
  } else if(v.plan==="prodej"){
    h+='<div class="hint" style="margin-top:10px">Vozidlo je nabízeno zaměstnancům k odkupu za cenu obvyklou '+kc(o.cenaZamestnanec)+'. Nabídku můžeš podat na <a href="/vozidla/odkup" target="_blank" rel="noopener">/vozidla/odkup</a>.</div>';
  }
  h+=inzerceBlok(v);
  h+='<div class="hint" style="margin-top:8px">Termín vyřazení = dřívější z prahů '+cis(n.prahKm)+' km / '+n.prahRoky+' let. Tržní cena = medián srovnatelných inzerátů na Sauto.cz posunutý na náš nájezd; když inzeráty nejsou, pořizovací × zbytek hodnoty dle stáří × korekce na nájezd proti '+cis(n.rocniKm)+' km/rok. Je to podklad pro rozhodnutí, ne znalecký posudek.</div>';
  // nabídky
  if(v.smiRozhodovat&&v.plan==="prodej"){
    h+='<div style="margin-top:14px"><div class="mut" style="margin-bottom:6px">Nabídky odkupu</div>'+nabidkyTabulka(v,v.nabidky)+'</div>';
  }
  return h+'</div></div>';
}
async function ulozCenu(id){
  stavUlozeni("cenaStav","ukládám…");
  try{ await api("/api/vozidla/cena",{id,porizovaciCena:$("#cenaPoriz").value,prodejniCena:$("#cenaProdej").value});
    stavUlozeni("cenaStav","uloženo ✓","var(--green-d)"); D=await api("/api/vozidla/data"); detail(id); }
  catch(e){ stavUlozeni("cenaStav","neuloženo — "+e.message,"var(--red)"); }
}
async function nastavPlan(id,plan){
  const v=vuz(id);
  if(plan&&plan!==v.plan){
    const txt=plan==="prodej"?"Označit vozidlo "+(v.spz||"")+" jako plánovaný prodej? Zveřejní se zaměstnancům k odkupu.":"Vyřadit vozidlo "+(v.spz||"")+" z provozu — ekologická likvidace?";
    if(!confirm(txt))return;
  }
  const pozn=plan&&plan!==v.plan?(prompt("Poznámka k rozhodnutí (nepovinné):","")||""):undefined;
  try{ await api("/api/vozidla/plan",{id,plan,pozn}); toast(plan?"Plán uložen.":"Plán zrušen."); await nacti(); detail(id); }
  catch(e){alert(e.message);}
}
async function nabidkaStav(nid,stav,vozId){
  if(stav==="prijata"&&!confirm("Přijmout tuto nabídku? Zájemce dostane e-mail."))return;
  try{ await api("/api/vozidla/odkup/stav",{id:nid,stav}); toast("Nabídka "+(stav==="prijata"?"přijata.":"zamítnuta.")); await nacti(); if(ZALOZKA==="vyrazeni")vykresli(); else detail(vozId); }
  catch(e){alert(e.message);}
}
/* ---------- co s vozidlem: možnosti, zápis prodeje / vyřazení / odstavení ----------
   Plán (prodej / likvidace) je záměr. Tady se zapisuje, co se skutečně stalo — vozidlo
   se tím přesune do boxu prodaných a vyřazených a upomínky k němu přestanou chodit. */
let UKON_FORM=null;   // {id, typ} — který formulář je v detailu rozbalený
function moznostiSelect(v){
  if(!v.smiRozhodovat) return '';
  const arch=v.stav==="prodano"||v.stav==="vyrazeno";
  const o=[['','Možnosti…']];
  if(!arch){
    if(v.stav==="odstaveno") o.push(['provoz','▶ Vrátit do provozu']);
    if(v.plan!=="prodej") o.push(['plan-prodej','Plánovat prodej (nabídnout zaměstnancům)']);
    if(v.plan!=="likvidace") o.push(['plan-likvidace','Plánovat vyřazení — likvidace']);
    if(v.plan) o.push(['plan-zrusit','Zrušit plán']);
    o.push(['prodat','✅ Zapsat prodej'],['vyradit','✅ Zapsat vyřazení / likvidaci']);
    if(v.stav==="aktivni") o.push(['odstavit','⏸ Odstavit — dočasně mimo provoz'],['predat','Předat jinému správci']);
  } else if(D.me.admin) o.push(['provoz','↩ Vrátit do evidence (omyl)']);
  o.push(['detail','Otevřít detail']);
  return '<select class="btn sm" style="font-weight:600;width:112px;cursor:pointer;padding-right:4px" title="Co s vozidlem" onclick="event.stopPropagation()" onchange="const k=this.value;this.value=\'\';ukonVyber(\''+v.id+'\',k)">'
    +o.map(([k,t])=>'<option value="'+k+'">'+t+'</option>').join('')+'</select>';
}
async function ukonVyber(id,k){
  if(!k)return;
  if(k==="plan-prodej")return nastavPlan(id,"prodej");
  if(k==="plan-likvidace")return nastavPlan(id,"likvidace");
  if(k==="plan-zrusit")return nastavPlan(id,"");
  if(k==="provoz")return ukonProvoz(id);
  if(k==="detail")return detail(id);
  if(k==="predat"){ detail(id); setTimeout(()=>{const el=document.getElementById("predatKdo_"+id); if(el)el.scrollIntoView({behavior:"smooth",block:"center"});},120); return; }
  UKON_FORM={id,typ:k}; detail(id);
  setTimeout(()=>{const el=document.getElementById("ukonForm"); if(el)el.scrollIntoView({behavior:"smooth",block:"center"});},120);
}
async function ukonProvoz(id){
  const v=vuz(id), arch=v.stav==="prodano"||v.stav==="vyrazeno";
  if(!confirm(arch?"Vrátit vozidlo "+(v.spz||"")+" do evidence? Zápis o prodeji / vyřazení se zruší (v historii zůstane).":"Vrátit vozidlo "+(v.spz||"")+" do provozu?"))return;
  const pozn=prompt("Poznámka (nepovinné):","")||"";
  try{ await api("/api/vozidla/ukon",{id,ukon:"provoz",pozn}); UKON_FORM=null; toast("Vozidlo je zpět v provozu."); await nacti(); if(ZALOZKA==="vyrazeni")vykresli(); detail(id); }
  catch(e){alert(e.message);}
}

async function ukonOdeslat(id,typ){
  const g=i=>{const el=document.getElementById(i);return el?el.value:undefined;};
  const telo={id,ukon:typ,datum:g("ukDatum"),pozn:g("ukPozn")};
  if(typ==="prodat"){
    telo.kupujici=g("ukKupujici"); telo.kupujiciEmail=g("ukEmail"); telo.cena=g("ukCena");
    if(!telo.kupujici){alert("Vyplň, komu se vozidlo prodalo.");return;}
    if(!telo.cena){alert("Vyplň skutečnou prodejní cenu.");return;}
    if(!confirm("Zapsat prodej za "+cis(Number(String(telo.cena).replace(/\s/g,"")))+" Kč kupujícímu "+telo.kupujici+"?"))return;
  }
  if(typ==="vyradit"){ telo.zpusob=g("ukZpusob"); telo.doklad=g("ukDoklad"); if(!confirm("Zapsat vyřazení vozidla z evidence?"))return; }
  try{ await api("/api/vozidla/ukon",telo); UKON_FORM=null; toast(typ==="prodat"?"Prodej zapsán.":typ==="vyradit"?"Vyřazení zapsáno.":"Vozidlo odstaveno."); await nacti(); if(ZALOZKA==="vyrazeni")vykresli(); detail(id); }
  catch(e){alert(e.message);}
}
function obmenaStavPill(v){

  if(v.stav==="vyrazeno")return '<span class="pill mute">vyřazeno'+(v.vyrazeni?' '+dat(v.vyrazeni.datum):'')+'</span>';
  if(v.stav==="odstaveno")return '<span class="pill warn">odstaveno</span>'+(v.plan?' '+planPill(v).trim():'');
  return v.plan?'<span class="pill '+(v.plan==="likvidace"?"bad":"warn")+'">'+esc(v.planText)+'</span>':'<span class="pill ok">v provozu, bez plánu</span>';
}
function archivBunka(v){

// Box prodaných a vyřazených vozidel (záložka Vyřazení a ocenění)
function archivSeznam(){
  return D.vozidla.filter(v=>v.stav==="prodano"||v.stav==="vyrazeno").sort((a,b)=>(((b.prodej||b.vyrazeni||{}).ts)||0)-(((a.prodej||a.vyrazeni||{}).ts)||0));
}
function archivKarta(){
  const arch=archivSeznam(), prodana=arch.filter(v=>v.stav==="prodano"), sumProd=prodana.reduce((a,v)=>a+((v.prodej&&v.prodej.cena)||0),0);
  let h='<div class="card"><div class="h"><h2>Prodaná a vyřazená vozidla</h2><div class="sp"></div><span class="pill mute">'+prodana.length+' prodáno · '+(arch.length-prodana.length)+' vyřazeno</span>'
    +(sumProd?' <span class="pill ok">utrženo '+kc(sumProd)+'</span>':'')+' '+(arch.length?btnExport("exportArchiv()"):'')+'</div><div class="b">';
  if(!arch.length) h+='<div class="mut">Zatím žádné. Prodej nebo vyřazení zapíšeš u vozidla přes „Možnosti…" — v přehledu, v tabulce výš nebo v detailu.</div>';
  else h+='<div style="overflow-x:auto"><table><thead><tr><th>Vozidlo</th><th>Středisko</th><th>Co se stalo</th><th>Kdy</th><th>Komu / způsob</th><th class="num">Cena</th><th class="num">Tržní tehdy</th><th class="num">Zůstatková</th><th class="num" title="Prodejní cena − účetní zůstatková">Výsledek</th><th>Zapsal</th><th></th></tr></thead><tbody>'
    +arch.map(v=>{const p=v.prodej,z=v.vyrazeni,r=p||z||{};
      const vysl=p&&p.zustatkovaTehdy!=null?p.cena-p.zustatkovaTehdy:(z&&z.zustatkovaTehdy?-z.zustatkovaTehdy:null);
      return '<tr><td><strong>'+esc(v.spz||v.vin)+'</strong><div class="mut">'+esc([v.znacka,v.model].filter(Boolean).join(' '))+'</div></td><td>'+esc(v.stredisko||'—')+'</td>'
        +'<td>'+(p?'<span class="pill ok">prodáno</span>':'<span class="pill mute">vyřazeno</span>')+'</td><td>'+dat(r.datum)+'</td>'
        +'<td>'+(p?esc(p.kupujici)+(p.kupujiciEmail?'<div class="mut">'+esc(p.kupujiciEmail)+'</div>':''):esc((z&&z.zpusobText)||'')+(z&&z.doklad?'<div class="mut">doklad '+esc(z.doklad)+'</div>':''))+'</td>'
        +'<td class="num">'+(p?'<strong>'+cis(p.cena)+'</strong>':'—')+'</td><td class="num">'+(r.trzniTehdy?cis(r.trzniTehdy):'—')+'</td><td class="num">'+(r.zustatkovaTehdy!=null?cis(r.zustatkovaTehdy):'—')+'</td>'
        +'<td class="num">'+(vysl==null?'—':'<strong style="color:'+(vysl<0?'var(--red)':'var(--green-d)')+'">'+(vysl>0?'+':'')+cis(vysl)+'</strong>')+'</td>'
        +'<td>'+esc(r.kdo||'')+(r.pozn?'<div class="mut">'+esc(r.pozn)+'</div>':'')+'</td>'
        +'<td style="white-space:nowrap"><button class="btn sm" onclick="detail(\''+v.id+'\')">Detail</button>'+(D.me.admin?' <button class="btn sm" title="Vrátit do evidence (omyl v zápisu)" onclick="ukonProvoz(\''+v.id+'\')">↩</button>':'')+'</td></tr>';}).join('')
    +'</tbody></table></div>';
  return h+'</div></div>';
}
function exportArchiv(){
  exportCsv("prodana-a-vyrazena-vozidla",["SPZ","Značka a model","Středisko","Co se stalo","Datum","Kupující / způsob","E-mail kupujícího","Doklad","Cena (Kč)","Tržní tehdy (Kč)","Zůstatková tehdy (Kč)","Výsledek (Kč)","Tachometr (km)","Zapsal","Poznámka"],
    archivSeznam().map(v=>{const p=v.prodej,z=v.vyrazeni,r=p||z||{};
      return [v.spz||"",[v.znacka,v.model].filter(Boolean).join(" "),v.stredisko||"",p?"prodáno":"vyřazeno",r.datum||"",p?p.kupujici:((z&&z.zpusobText)||""),p?(p.kupujiciEmail||""):"",z?(z.doklad||""):"",
        expCis(p&&p.cena),expCis(r.trzniTehdy),expCis(r.zustatkovaTehdy),expCis(p&&p.zustatkovaTehdy!=null?p.cena-p.zustatkovaTehdy:(z&&z.zustatkovaTehdy?-z.zustatkovaTehdy:null)),expCis(r.tachometr),r.kdo||"",r.pozn||""];}));
}

/* ---------- porovnání s inzercí (Sauto.cz) ----------
   Tržní cena z reálných inzerátů: stejná značka a model, stejný rok, podobný nájezd.
   Server to obnovuje sám po dávkách; tady se to jen ukazuje a dá ručně spustit. */
const TRH_STAV_TXT={ok:'',"bez-roku":"chybí rok výroby",malo:"málo inzerátů",nenalezeno:"značka není na Sauto",chyba:"spojení selhalo"};
function trhDatum(t){ return t&&t.ts?new Date(t.ts).toLocaleDateString("cs-CZ"):""; }
function trzniBunka(v,o){
  const t=v.trh||null;
  let h='';
  if(o.trzniZdroj==="inzerce"){
    const i=o.inzerce;
    h='<strong>'+cis(o.trzni)+'</strong><div class="mut" title="'+esc(i.n+' inzerátů · medián '+cis(i.median)+' · Q1–Q3 '+cis(i.q1)+'–'+cis(i.q3)+' · porovnáno '+trhDatum(t))+'">inzerce · '+i.n+' inz.'+(i.rozsireno?' · širší okno':'')+(i.shoda==="značka"?' · jen značka':'')+'</div>';
  }else if(o.trzni!=null){
    h='<strong>'+cis(o.trzni)+'</strong><div class="mut">model'+(t&&t.stav!=="ok"?' · '+esc(TRH_STAV_TXT[t.stav]||t.stav):' · bez inzerce')+(o.odhadCeny?' · odhad':'')+'</div>';
  }else h='<span class="mut">—</span>'+(t&&t.stav!=="ok"?'<div class="mut">'+esc(TRH_STAV_TXT[t.stav]||t.stav)+'</div>':'');
  if(v.smiRozhodovat&&!(D.trhStav&&D.trhStav.bezi)) h+='<div><button class="btn sm" style="padding:1px 7px;font-size:11px" title="Porovnat s inzercí teď (Sauto.cz)" onclick="event.stopPropagation();trhObnovVuz(\''+v.id+'\')">↻ inzerce</button></div>';
  return h;
}
function trhTlacitko(){
  if(!(D.me.admin||D.me.zodpovedny))return '';
  const b=D.trhStav||{};
  if(b.bezi) return '<span class="pill warn" id="trhBeh">porovnávám '+b.hotovo+' / '+b.celkem+'…</span>';
  return '<button class="btn sm" title="Pro všechna vozidla s rokem výroby najít srovnatelné inzeráty na Sauto.cz a přepočítat tržní ceny" onclick="trhObnovVse()">↻ Porovnat s inzercí</button>';
}
function trhStavRadek(vs){
  const b=D.trhStav||{};
  const sInz=vs.filter(v=>v.trh&&v.trh.stav==="ok").length, bezRoku=vs.filter(v=>!(v.oceneni&&v.oceneni.reg)).length;
  const nejst=vs.map(v=>v.trh&&v.trh.ts).filter(Boolean).sort((a,b)=>a-b)[0];
  let h='<div class="hint" style="margin-bottom:8px">Srovnání s inzercí Sauto.cz: <strong>'+sInz+' z '+vs.length+'</strong> vozidel má tržní cenu z inzerátů'
    +(nejst?' · nejstarší porovnání '+new Date(nejst).toLocaleDateString("cs-CZ"):'')
    +(bezRoku?' · <span style="color:var(--amber)">'+bezRoku+' bez roku výroby — ty porovnat nejdou</span>':'')
    +(b.bezi?' · <strong>právě běží hromadné porovnání ('+b.hotovo+' / '+b.celkem+')</strong>':(b.konec?' · poslední běh '+new Date(b.konec).toLocaleString("cs-CZ")+(b.chyby?' ('+b.chyby+' chyb)':''):''))
    +'</div>';
  if(b.bezi) trhSleduj();
  return h;
}
let TRH_T=null;
function trhSleduj(){
  clearTimeout(TRH_T);
  TRH_T=setTimeout(async()=>{
    try{ const st=await api("/api/vozidla/trh/stav"); if(st.bezi){ const el=document.getElementById("trhBeh"); if(el)el.textContent="porovnávám "+st.hotovo+" / "+st.celkem+"…"; trhSleduj(); }
         else { D=await api("/api/vozidla/data"); if(ZALOZKA==="vyrazeni")vykresli(); toast("Porovnání s inzercí dokončeno."); } }
    catch(e){ /* zkusí to příští kolo */ }
  },4000);
}
async function trhObnovVse(){
  if(!confirm("Najít srovnatelné inzeráty pro všechna vozidla s rokem výroby? Běží to na pozadí asi 1–2 s na vozidlo.")) return;
  try{ const r=await api("/api/vozidla/trh",{vse:true}); toast(r.bezi?"Porovnání už běží.":"Spuštěno pro "+r.spusteno+" vozidel."); D=await api("/api/vozidla/data"); vykresli(); }
  catch(e){ alert(e.message); }
}
async function trhObnovVuz(id){
  toast("Hledám inzeráty…");
  try{ const r=await api("/api/vozidla/trh",{id}); D=await api("/api/vozidla/data");
    const t=r.trh||{}; toast(t.stav==="ok"?("Nalezeno "+t.n+" inzerátů, tržní cena "+kc(t.odhad)+"."):("Porovnání: "+(t.zprava||t.stav)));
    if(ZALOZKA==="vyrazeni")vykresli(); if($("#modal").classList.contains("on"))detail(id); }
  catch(e){ toast("Nepodařilo se: "+e.message); }
}
// Blok v detailu vozidla: souhrn + nejbližší inzeráty s odkazy.
function inzerceBlok(v){
  const t=v.trh||null, o=v.oceneni||{}, d=(t&&t.dotaz)||{};
  let h='<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><div class="spread" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><strong>Srovnání s inzercí (Sauto.cz)</strong>'
    +(t?'<span class="mut">porovnáno '+trhDatum(t)+'</span>':'<span class="mut">zatím neporovnáno</span>')+'<div class="sp" style="flex:1"></div>'
    +(t&&t.odkaz?'<a class="btn sm" href="'+esc(t.odkaz)+'" target="_blank" rel="noopener" title="Otevřít výpis se stejnými filtry na Sauto.cz">Výpis na Sauto ↗</a> ':'')
    +(v.smiRozhodovat?'<button class="btn sm" onclick="trhObnovVuz(\''+v.id+'\')">↻ Aktualizovat</button>':'')+'</div>';
  if(!t){ h+='<div class="mut" style="margin-top:6px">Porovnání proběhne automaticky na pozadí'+(v.smiRozhodovat?', nebo ho spusť tlačítkem':'')+'.</div>'; return h+'</div>'; }
  if(t.stav!=="ok"){ h+='<div class="hint" style="margin-top:6px;color:var(--amber)">⚠ '+esc(t.zprava||TRH_STAV_TXT[t.stav]||t.stav)+'</div>'; }
  if(d.znacka){
    h+='<div class="mut" style="margin-top:6px">Hledáno: <strong>'+esc(d.znacka+(d.model?' '+d.model:''))+'</strong>'+(d.shoda==="značka"?' <span class="pill warn" title="Model se nepodařilo spárovat s číselníkem Sauto — srovnává se celá značka">jen značka</span>':'')
      +' · rok '+(d.rokOd===d.rokDo?d.rokOd:d.rokOd+'–'+d.rokDo)+(d.kmOd!=null?' · nájezd '+cis(d.kmOd)+'–'+cis(d.kmDo)+' km':' · bez filtru nájezdu')+' · kategorie '+esc(d.kategorieNazev||'')
      +(d.rozsireno?' <span class="pill mute" title="Přesně stejný rok a nájezd ±30 % nedaly dost inzerátů, okno se rozšířilo">širší okno</span>':'')+'</div>';
  }
  if(t.stav==="ok"){
    const kpi=(l,val,pozn)=>'<div><div class="mut">'+l+'</div><div style="font-size:16px"><strong>'+val+'</strong></div>'+(pozn?'<div class="mut">'+pozn+'</div>':'')+'</div>';
    h+='<div class="grid3" style="margin-top:10px">'
      +kpi('Doporučená prodejní cena',kc(t.odhad),'medián inzerátů posunutý na náš nájezd'+(t.sklon10k?' ('+cis(t.sklon10k)+' Kč / 10 tis. km)':''))
      +kpi('Medián · rozpětí Q1–Q3',kc(t.median),cis(t.q1)+' – '+cis(t.q3)+' Kč · '+t.n+' inzerátů')
      +kpi('Rychlý prodej',kc(t.rychly),'dolní kvartil, pro prodej do měsíce')
      +'</div>';
    if(o.trzniModel!=null) h+='<div class="mut" style="margin-top:6px">Odhad z křivky by dal '+kc(o.trzniModel)+' — inzerce je '+(o.rozdilModel>=0?'o '+cis(o.rozdilModel)+' Kč výš':'o '+cis(-o.rozdilModel)+' Kč níž')+'.</div>';
  }
  const vz=t.vzorek||[];
  if(vz.length){
    h+='<div class="mut" style="margin:10px 0 4px">Nejbližší inzeráty (nájezdem a rokem)</div>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>Inzerát</th><th class="num">Rok</th><th class="num">Nájezd</th><th class="num">Cena</th><th>Kraj</th><th></th></tr></thead><tbody>'
      +vz.map(x=>'<tr><td>'+esc(x.nazev)+'</td><td class="num">'+(x.rok||'—')+'</td><td class="num">'+(x.km?cis(x.km)+' km':'—')+'</td><td class="num"><strong>'+(x.cena?cis(x.cena)+' Kč':'dohodou')+'</strong></td><td>'+esc(x.kraj||'')+'</td>'
        +'<td><a href="'+esc(x.url)+'" target="_blank" rel="noopener">otevřít ↗</a></td></tr>').join('')
      +'</tbody></table></div>';
  }
  return h+'</div>';
}

/* ---------- záložka Vyřazení a ocenění ---------- */
/* Cena rovnou v tabulce: u 50 vozů nikdo nebude otevírat 50 detailů. Prázdné políčko
   ukazuje jako nápovědu odhad, ze kterého se zatím počítá. Ukládá se až po opuštění
   políčka (onchange) — při psaní po číslicích by se tabulka překreslovala pod rukama. */
function cenaBunka(v,co,o){
  if(!v.smiRozhodovat){
    const h=co==='poriz'?o.porizovaci:o.prodejni;
    return (h!=null?cis(h):'—')+(co==='poriz'&&o.odhadCeny?'<div class="mut">odhad dle typu</div>':'');
  }
  const hod=co==='poriz'?(v.porizovaciCena||''):(v.prodejniCena||'');
  const napoveda=co==='poriz'?(o.odhadCeny&&o.porizovaci?cis(o.porizovaci)+' ?':'z faktury'):(o.prodejniNavrh?cis(o.prodejniNavrh):'návrh');
  return '<label class="pero" title="'+(co==='poriz'?'Pořizovací cena z faktury nebo leasingu — přepiš a uloží se sama':'Prodejní cena ručně; prázdné = návrh z modelu')+'">'
    +'<input class="inl num" id="cn_'+co+'_'+v.id+'" inputmode="numeric" autocomplete="off" value="'+hod+'" placeholder="'+esc(napoveda)+'"'
    +' onchange="ulozCenuRadek(\''+v.id+'\')"><span class="ic">✎</span></label>'
    +(co==='poriz'&&o.odhadCeny?'<div class="mut">odhad dle typu</div>':'');
}
async function ulozCenuRadek(id){
  const p=document.getElementById("cn_poriz_"+id), r=document.getElementById("cn_prodej_"+id);
  if(!p&&!r)return;
  try{
    await api("/api/vozidla/cena",{id,porizovaciCena:p?p.value:undefined,prodejniCena:r?r.value:undefined});
    D=await api("/api/vozidla/data");
    if(ZALOZKA==="vyrazeni")vykresli();
    toast("Cena uložena.");
  }catch(e){ toast("Neuloženo: "+e.message); }
}
function exportVyrazeni(){
  const vs=D.vozidla.filter(v=>v.stav!=="prodano"&&v.stav!=="vyrazeno");
  exportCsv("vyrazeni-a-oceneni",
    ["SPZ","Značka a model","Středisko","Pořízeno","Stáří (let)","Nájezd (km)","km/rok","Vyřazení dle stáří","Vyřazení dle nájezdu",
     "Návrh na vyřazení","Důvod","Pořizovací (Kč)","Zdroj pořizovací ceny","Zůstatková (Kč)","Tržní (Kč)","Zdroj tržní ceny","Inzerátů","Inzerce medián (Kč)","Inzerce Q1 (Kč)","Inzerce Q3 (Kč)","Rychlý prodej (Kč)","Porovnáno","Výpis inzerátů","Prodejní (Kč)","Tržní − zůstatková (Kč)","Plán","Upozornění"],
    vs.map(v=>{const o=v.oceneni||{};
      return [v.spz||"",[v.znacka,v.model].filter(Boolean).join(" "),v.stredisko||"",expMesic(o.reg),
        expDes(o.stariLet),expCis(o.najezd),expCis(o.kmRok),expMesic(o.terminStari),expMesic(o.terminNajezd),
        o.terminNyni?"nyní":expMesic(o.termin),o.duvod||"",expCis(o.porizovaci),o.porizovaciZdroj||"",
        expCis(o.zustatkova),expCis(o.trzni),o.trzniZdroj||"",o.inzerce?o.inzerce.n:"",expCis(o.inzerce&&o.inzerce.median),expCis(o.inzerce&&o.inzerce.q1),expCis(o.inzerce&&o.inzerce.q3),
        expCis(o.rychly),trhDatum(v.trh),(v.trh&&v.trh.odkaz)||"",expCis(o.prodejni),expCis(o.rozdilZustatkova),v.planText||"",(o.upozorneni||[]).join(" · ")];}));
}
function exportNabidky(){
  const radky=[];
  D.vozidla.forEach(v=>(v.nabidky||[]).forEach(n=>radky.push([v.spz||"",[v.znacka,v.model].filter(Boolean).join(" "),
    (n.kontakt&&n.kontakt.jmeno)||n.jmeno||n.email,n.email,(n.kontakt&&n.kontakt.telefon)||"",expCis(n.cena),
    expCis(v.oceneni&&v.oceneni.cenaZamestnanec),n.pozn||"",new Date(n.ts).toLocaleDateString("cs-CZ"),
    n.stav==="prijata"?"přijata":n.stav==="zamitnuta"?"zamítnuta":"nová",n.stavKdo||""])));
  exportCsv("nabidky-odkupu",["SPZ","Vozidlo","Zájemce","E-mail","Telefon","Nabídka (Kč)","Cena obvyklá (Kč)","Poznámka","Podáno","Stav","Rozhodl"],radky);
}
function vykresliVyrazeni(){
  const n=D.nastaveni;
  const vs=D.vozidla.filter(v=>v.stav!=="prodano"&&v.stav!=="vyrazeno").map(v=>({v,o:v.oceneni||{}}));
  const ord=r=>r.o.termin?(r.o.termin.y*12+r.o.termin.m):9e9;
  vs.sort((a,b)=>ord(a)-ord(b));
  const nyni=vs.filter(r=>r.o.terminNyni), rok=vs.filter(r=>!r.o.terminNyni&&r.o.mesicuDoTerminu!=null&&r.o.mesicuDoTerminu<=12);
  const sumT=vs.reduce((a,r)=>a+(r.o.trzni||0),0), sumZ=vs.reduce((a,r)=>a+(r.o.zustatkova||0),0), sPod=vs.filter(r=>r.o.trzni!=null).length;
  const sumP=vs.reduce((a,r)=>a+(r.o.porizovaci||0),0), sumPr=vs.reduce((a,r)=>a+(r.o.prodejni||0),0);
  const odhadu=vs.filter(r=>r.o.odhadCeny).length;
  const prodej=vs.filter(r=>r.v.plan==="prodej"), likv=vs.filter(r=>r.v.plan==="likvidace");
  const nab=[]; D.vozidla.forEach(v=>(v.nabidky||[]).forEach(x=>nab.push(Object.assign({v},x))));
  const odh=z=>z&&/odhad|bez měsíce|\+ \d+ měs/.test(z)?' <span class="pill mute" title="'+esc(z)+'">odhad</span>':'';
  let h='<div class="card"><div class="h"><h2>Vyřazení a ocenění vozidel</h2><div class="sp"></div>'
    +'<span class="pill '+(nyni.length?"bad":"ok")+'">'+nyni.length+' k vyřazení nyní</span> <span class="pill warn">'+rok.length+' do roka</span> <span class="pill mute">'+prodej.length+' k prodeji · '+likv.length+' k likvidaci</span> '
    +trhTlacitko()+' '+btnExport("exportVyrazeni()")+'</div><div class="b">'
    +trhStavRadek(vs.map(r=>r.v))
    +'<div class="hint">Termín vyřazení = dřívější z <strong>stáří '+n.prahRoky+' let</strong> a <strong>nájezdu '+cis(n.prahKm)+' km</strong> při současném ročním nájezdu (prahy v Nastavení). '
    +'Ceny: <strong>účetní zůstatková</strong> (rovnoměrně '+n.odpisLet+' let) · <strong>tržní</strong> = medián srovnatelných inzerátů na Sauto.cz (stejná značka, model, rok, podobný nájezd) posunutý na náš nájezd; bez inzerátů odhad z křivky · <strong>prodejní</strong> = tržní − '+n.rezervaProdej+' % nebo ručně. '
    +'Tržní hodnota vozidel s podklady: <strong>'+kc(sumT)+'</strong> ('+sPod+' z '+vs.length+' vozů), účetní zůstatková '+kc(sumZ)+'. Hodnoty „odhad" zpřesníš doplněním data pořízení, tachometru a pořizovací ceny.</div>'
    +(nyni.length?'<div class="hint" style="margin-top:8px;color:var(--red)"><strong>K vyřazení nyní:</strong> '+nyni.map(r=>esc(r.v.spz||r.v.vin)+' ('+esc(r.o.duvod)+')').join(', ')+'</div>':'')
    +'<div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th>Vozidlo</th><th>Středisko</th><th>Pořízeno</th><th class="num">Stáří</th><th class="num">Nájezd</th><th class="num">km/rok</th><th>Dle stáří</th><th>Dle nájezdu</th><th>Vyřazení</th>'
    +'<th class="num" style="min-width:120px">Pořizovací</th><th class="num">Zůstatková</th><th class="num">Tržní</th><th class="num" style="min-width:120px">Prodejní</th><th class="num" title="Tržní cena mínus účetní zůstatková — kladné číslo je účetní zisk z prodeje">Tržní − zůst.</th><th>Plán</th></tr></thead><tbody>'
    +vs.map(r=>{const v=r.v,o=r.o;
      const rozd=o.rozdilZustatkova;
      return '<tr'+(o.terminNyni?' style="background:var(--red-soft,#fdecea)"':'')+'><td style="cursor:pointer" onclick="detail(\''+v.id+'\')"><strong>'+esc(v.spz||v.vin)+'</strong><div class="mut">'+esc([v.znacka,v.model].filter(Boolean).join(' '))+'</div></td>'
        +'<td>'+esc(v.stredisko||'—')+'</td><td>'+fm(o.reg)+odh(o.regZdroj)+'</td><td class="num">'+(o.stariLet!=null?String(o.stariLet).replace('.',',')+' let':'—')+'</td>'
        +'<td class="num">'+(o.najezd!=null?cis(o.najezd):'—')+odh(o.najezdZdroj)+'</td><td class="num">'+(o.kmRok?cis(o.kmRok):'—')+'</td>'
        +'<td>'+fm(o.terminStari)+'</td><td>'+fm(o.terminNajezd)+'</td><td><strong>'+(o.terminNyni?'<span style="color:var(--red)">nyní</span>':fm(o.termin))+'</strong>'+(o.duvod?'<div class="mut">'+esc(o.duvod)+'</div>':'')+'</td>'
        +'<td class="num">'+cenaBunka(v,'poriz',o)+'</td>'
        +'<td class="num">'+(o.zustatkova!=null?cis(o.zustatkova):'—')+'</td>'
        +'<td class="num" style="min-width:150px">'+trzniBunka(v,o)+'</td>'
        +'<td class="num">'+cenaBunka(v,'prodej',o)+(o.rozdilProc!=null&&o.rozdilProc<-10?'<div style="color:var(--red)">'+String(o.rozdilProc).replace('.',',')+' %</div>':'')+'</td>'
        +'<td class="num">'+(rozd==null?'—':'<strong style="color:'+(rozd<0?'var(--red)':'var(--green-d)')+'">'+(rozd>0?'+':'')+cis(rozd)+'</strong>')+'</td>'
        +'<td>'+(v.plan?planPill(v).trim():'')+((o.upozorneni||[]).length?' <span title="'+esc(o.upozorneni.join(' · '))+'">⚠</span>':'')+((v.nabidky||[]).filter(x=>x.stav==="nova").length?' <span class="pill warn">'+(v.nabidky.filter(x=>x.stav==="nova").length)+' nab.</span>':'')+'<div style="margin-top:4px">'+moznostiSelect(v)+'</div></td></tr>';}).join('')
    +'</tbody><tfoot><tr style="font-weight:600;background:var(--bg-2)"><td colspan="9">Celkem '+vs.length+' vozidel '+(odhadu?'<span class="mut" style="font-weight:400">· u '+odhadu+' se počítá z orientační ceny podle typu</span>':'')+'</td>'
    +'<td class="num">'+cis(sumP)+'</td><td class="num">'+cis(sumZ)+'</td><td class="num">'+cis(sumT)+'</td><td class="num">'+cis(sumPr)+'</td>'
    +'<td class="num" style="color:'+((sumT-sumZ)<0?'var(--red)':'var(--green-d)')+'">'+((sumT-sumZ)>0?'+':'')+cis(sumT-sumZ)+'</td><td></td></tr></tfoot></table></div>'
    +'<div class="hint" style="margin-top:8px"><strong>Tržní cena = skutečná inzerce.</strong> Pro každý vůz se na Sauto.cz hledají inzeráty stejné značky a modelu, stejného roku výroby a podobného nájezdu; tržní cena je jejich medián posunutý na náš nájezd, <strong>prodejní</strong> je tržní − rezerva '+n.rezervaProdej+' % (nebo ručně). Porovnání se obnovuje samo jednou za '+(n.trhObnovaDni||7)+' dní, u vozů bez inzerátů platí odhad z křivky („model"). '
    +'<strong>Pořizovací a prodejní cenu přepiš rovnou v tabulce</strong> — uloží se sama; bez pořizovací ceny se zůstatková počítá z orientační ceny podle typu (Nastavení), označeno <span class="pill mute">odhad</span>. Kliknutím na SPZ otevřeš detail se srovnatelnými inzeráty a rozhodneš o plánu.</div></div></div>';
  h+=archivKarta();
  h+='<div class="card"><div class="h"><h2>Nabídky zaměstnanců na odkup</h2><div class="sp"></div><span class="pill '+(nab.some(x=>x.stav==="nova")?"warn":"mute")+'">'+nab.filter(x=>x.stav==="nova").length+' nových</span> '+(nab.length?btnExport("exportNabidky()"):'')+'</div><div class="b">'
    +'<div class="hint" style="margin-bottom:10px">Vozidla s plánem „prodej" vidí každý přihlášený zaměstnanec na <a href="/vozidla/odkup" target="_blank" rel="noopener">/vozidla/odkup</a> (a na nástěnce intranetu) a může podat nabídku. Cena v nabídce je cena obvyklá; nabídky pod ní jsou označené — rozdíl by byl u zaměstnance nepeněžním příjmem.</div>';
  if(!nab.length) h+='<div class="mut">Zatím žádná nabídka.</div>';
  else {
    const poVoz=new Map(); nab.forEach(x=>{const a=poVoz.get(x.v.id)||[];a.push(x);poVoz.set(x.v.id,a);});
    poVoz.forEach((seznam,vid)=>{const v=vuz(vid); h+='<div style="margin-bottom:14px"><div style="font-weight:600;margin-bottom:4px">'+esc(v.spz||v.vin)+' <span class="mut">'+esc([v.znacka,v.model].filter(Boolean).join(' '))+' · cena obvyklá '+kc(v.oceneni.cenaZamestnanec)+'</span></div>'+nabidkyTabulka(v,seznam)+'</div>';});
  }
  h+='</div></div>';
  $("#obsah").innerHTML=h;
}

async function ulozVuz(id,prubezne){
  if(!document.getElementById("eSpz"))return;          // dialog je mezitím zavřený
  const t={id:id||undefined,spz:$("#eSpz").value,znacka:$("#eZnacka").value,model:$("#eModel").value,vin:$("#eVin").value,
    rokVyroby:$("#eRok").value,typ:$("#eTyp").value,stredisko:$("#eStred").value,spravceEmail:$("#eSpravce").value,
    stav:$("#eStav").value,stkDo:$("#eStk").value,porizeno:$("#ePor").value,poznamka:$("#ePozn").value,
    evidCislo:$("#eEvid").value,cisloTp:$("#eTp").value,majitel:$("#eMaj").value};
  if(prubezne)stavUlozeni("vuzStav","ukládám…");
  try{
    const r=await api("/api/vozidla/vuz",t);
    if(prubezne){ stavUlozeni("vuzStav","uloženo ✓","var(--green-d)"); D=await api("/api/vozidla/data"); return; }
    toast("Uloženo."); zavri(); await nacti(); detail(id||r.id);
  }
  catch(e){ if(prubezne)stavUlozeni("vuzStav","neuloženo — "+e.message,"var(--red)"); else alert(e.message); }
}
async function smazVuz(id){
  const v=vuz(id);
  if(!confirm("Opravdu smazat vozidlo "+(v.spz||v.vin)+" včetně fotek a historie?"))return;
  try{ await api("/api/vozidla/vuz/smazat",{id}); toast("Vozidlo smazáno."); zavri(); nacti(); }catch(e){alert(e.message);}
}

/* ---------- exporty detailových tabulek a středisek ---------- */
function exportKm(id){
  const v=vuz(id), rady=(v.km||[]).slice().sort((a,b)=>b.rok-a.rok);
  exportCsv("tachometr-"+(v.spz||v.id).replace(/\s/g,""),["SPZ","Rok","Stav tachometru (km)","Za rok ujeto (km)","Zapsal","Zdroj"],
    rady.map((z,i)=>{const pr=rady[i+1];
      return [v.spz||"",z.rok,expCis(z.km),pr?expCis(z.km-pr.km):"",z.kdo||"",z.zInventury?"inventarizace":"ruční zápis"];}));
}
function exportSkody(id){
  const v=vuz(id), DR={nehoda:"Dopravní nehoda",poskozeni:"Poškození",kradez:"Krádež / vloupání",jine:"Jiná událost"};
  exportCsv("skody-"+(v.spz||v.id).replace(/\s/g,""),["SPZ","Datum","Druh","Popis","Viník","Policie ČR","Odhad škody (Kč)","Nahlásil"],
    (v.skody||[]).slice().reverse().map(z=>[v.spz||"",z.datum||"",DR[z.druh]||z.druh,z.popis||"",z.vinik||"",z.policie?"ano":"ne",expCis(z.odhadKc),z.kdo||""]));
}
function exportInventury(id){
  const v=vuz(id), ST={"v-poradku":"v pořádku","drobne-zavady":"drobné závady","zavazne-zavady":"závažné závady"};
  exportCsv("inventarizace-"+(v.spz||v.id).replace(/\s/g,""),["SPZ","Datum","Stav","Tachometr (km)","Výbava","Poznámka","Provedl"],
    (v.inventury||[]).slice().reverse().map(z=>[v.spz||"",z.datum||"",ST[z.stav]||z.stav,expCis(z.km),z.vybava||"",z.poznamka||"",z.kdo||""]));
}
function exportStrediska(){
  exportCsv("strediska-odpovednost",["Středisko","Zodpovědná osoba","E-mail","Telefon","Role","Vozidel"],
    D.strediska.map(st=>{
      const z=D.zodpovedne.find(x=>x.stredisko===st), k=(z&&z.kontakt)||{};
      return [st,z?(k.jmeno||z.jmeno||z.email):"",z?z.email:"",k.telefon||"",z?(D.role[z.role]||z.role):"",
        D.vozidla.filter(v=>v.stredisko===st).length];}));
}

async function ulozZod(i){
  const s=D.strediska[i];

    await api("/api/vozidla/zodpovedny",{stredisko:s,email,role});

    D=await api("/api/vozidla/data");   // data si obnovíme potichu, tabulku nepřekreslujeme pod rukama
  }catch(e){ stavUlozeni("zodstav_"+i,"neuloženo","var(--red)"); alert(e.message); }
}

// Kdo modul uvidí — počítá se ze svěřených vozidel a zodpovědností, nikde se to zvlášť nenastavuje.
function pristupHtml(){
  const spravci=new Map();
  D.vozidla.forEach(v=>{ if(v.spravceEmail) {
    const r=spravci.get(v.spravceEmail)||{k:v.spravceKontakt||{jmeno:v.spravceJmeno,email:v.spravceEmail},vozy:[]};
    r.vozy.push(v.spz||v.vin); spravci.set(v.spravceEmail,r);
  }});
  const zod=(D.zodpovedne||[]).filter(z=>z.email);
  let h='<div class="card" style="margin-top:18px"><div class="h"><h2>Kdo má modul zpřístupněný</h2><div class="sp"></div>'
    +'<span class="pill ok">'+(new Set([...spravci.keys(),...zod.map(z=>z.email)]).size)+' lidí</span></div><div class="b">'
    +'<div class="hint" style="margin-bottom:10px">Přístup se nepřiděluje ručně: modul vidí každý, komu je svěřené vozidlo, '
    +'a každá zodpovědná osoba za středisko. Přiřadíš auto → člověk modul uvidí; odebereš → přestane. '
    +'Správci vozu vidí jen svoje vozidla, zodpovědná osoba celé své středisko.</div>';
  if(spravci.size){
    h+='<table><thead><tr><th>Správce vozu</th><th>Kontakt</th><th>Vozidla</th></tr></thead><tbody>'
      +[...spravci.values()].sort((a,b)=>String(a.k.jmeno||"").localeCompare(String(b.k.jmeno||""),"cs"))
        .map(r=>'<tr><td><strong>'+esc(r.k.jmeno||r.k.email)+'</strong>'+(r.k.pozice?'<div class="mut">'+esc(r.k.pozice)+'</div>':'')+'</td>'
          +'<td class="mut">'+esc(r.k.email)+(r.k.telefon?'<br>'+esc(r.k.telefon):'')+'</td>'
          +'<td class="num">'+r.vozy.map(esc).join(", ")+'</td></tr>').join("")
      +'</tbody></table>';
  } else h+='<div class="mut">Zatím nemá svěřené vozidlo nikdo.</div>';
  const bez=D.vozidla.filter(v=>!v.spravceEmail).length;
  if(bez)h+='<div class="hint" style="margin-top:10px;color:var(--amber)">U '+bez+' vozidel není přidělen správce — ti lidé modul neuvidí, dokud jim auto nepřiřadíš.</div>';
  return h+'</div></div>';
}
async function ulozNastaveni(){
  stavUlozeni("nastStav","ukládám…");
  try{
    await api("/api/vozidla/nastaveni",{prahKm:$("#nKm").value,prahRoky:$("#nRok").value,inventuraMesice:$("#nInv").value,
      rocniKm:$("#nRocniKm").value,rezervaProdej:$("#nRez").value,odpisLet:$("#nOdpis").value,odkupEmail:$("#nOdkup").value,
      reditelEmail:$("#nReditel").value,
      cenyTypu:Object.keys(D.typy).reduce((a,k)=>{const el=document.getElementById("nCena_"+k); if(el)a[k]=el.value; return a;},{}),
      trhZapnuto:$("#nTrh")?$("#nTrh").value==="1":undefined, trhObnovaDni:$("#nTrhDni")?$("#nTrhDni").value:undefined,
      kopieNa:$("#nKopie").value.split(/[;,]/).map(s=>s.trim()).filter(Boolean)});
    stavUlozeni("nastStav","uloženo ✓","var(--green-d)");
    D=await api("/api/vozidla/data");
  }catch(e){ stavUlozeni("nastStav","neuloženo — "+e.message,"var(--red)"); }
}

function vykresli(){
  $("#podtitul").textContent=D.me.name+" · "+role();
  vykresliZalozky();

  vykresliPrehled();
}
