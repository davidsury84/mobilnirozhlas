<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Výroba Popelnice · Intranet ELKOPLAST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0e8a43; --green-2:#12a350; --green-d:#0a6b34; --green-soft:#e6f6ec;
  --ink:#0f1512; --ink-soft:#5b635c; --faint:#8b938c;
  --bg:#eef1ec; --bg-2:#f7f9f5; --paper:#fff; --line:#e3e7e0; --line-strong:#cdd3ca;
  --yellow-soft:#fff6d2; --amber:#7a5c0e; --red:#c23636; --red-soft:#fbe9e7; --blue:#1f5f8b; --blue-soft:#e4eff7; --violet-soft:#efe6f7; --violet:#5b3a86;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --shadow:0 1px 2px rgba(15,21,18,.04),0 10px 30px rgba(15,21,18,.07);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-2);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.wrap{max-width:1360px;margin:0 auto;padding:18px 20px 60px}
.mono{font-family:var(--mono)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.top .ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#15ab57,#0a6b34);display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 6px 16px rgba(10,107,52,.28)}
.top h1{font-family:var(--cond);font-weight:700;font-size:22px;margin:0}
.top .sub{font-size:12.5px;color:var(--ink-soft)}
.top .sp{flex:1}
.btn{border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--green);color:var(--green-d)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-d);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.xs{padding:3px 8px;font-size:11.5px;border-radius:6px}
.btn.danger{color:var(--red);border-color:#e7c3c0}
.btn.danger:hover{background:var(--red-soft);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:5px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 15px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-soft)}
.tabs button.on{background:var(--green-soft);color:var(--green-d)}
.tabs button b{font-family:var(--mono);font-weight:500;font-size:11.5px;margin-left:4px;color:var(--faint)}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat .s{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 16px;min-width:130px;cursor:pointer}
.stat .s .n{font-family:var(--cond);font-weight:700;font-size:22px;line-height:1}
.stat .s .l{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.stat .s.warn{border-color:#e8d9a8;background:var(--yellow-soft)}
.stat .s.warn .n{color:var(--amber)}
.stat .s.bad{border-color:#e7c3c0;background:var(--red-soft)}
.stat .s.bad .n{color:var(--red)}
.stat .s.ok .n{color:var(--green-d)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card .h{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#fbfdfb,#f6faf6);flex-wrap:wrap}
.card .h h2{font-family:var(--cond);font-weight:700;font-size:16px;margin:0}
.card .h .sp{flex:1}
.card .b{padding:14px 16px}
.card .empty{padding:26px;text-align:center;color:var(--ink-soft)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:600;padding:7px 9px;border-bottom:1px solid var(--line-strong);white-space:nowrap;background:var(--paper);position:sticky;top:0}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fafcf9}
tr.klik{cursor:pointer}
td.num,th.num{font-family:var(--mono);white-space:nowrap;font-size:12.5px}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green-d)}
.pill.warn{background:var(--yellow-soft);color:var(--amber)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.mute{background:#eef1ec;color:var(--ink-soft)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.viol{background:var(--violet-soft);color:var(--violet)}
.cvz{font-family:var(--mono);font-weight:500;font-size:12.5px;white-space:nowrap}
.mut{color:var(--ink-soft);font-size:12.5px}
.f{display:block;margin-bottom:9px}
.f span{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:3px;font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:7px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--paper)}
.f textarea{min-height:60px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}
@media(max-width:820px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.modal{position:fixed;inset:0;background:rgba(15,21,18,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:22px 12px}
.modal.on{display:flex}
.modal .box{background:var(--paper);border-radius:16px;max-width:1180px;width:100%;box-shadow:0 20px 60px rgba(15,21,18,.3)}
.modal .box.uzky{max-width:640px}
.modal .box .h{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modal .box .h h2{font-family:var(--cond);font-size:18px;margin:0;flex:1}
.modal .box .b{padding:16px 18px}
.modal .box .f2{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.pol td input,.pol td select{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:var(--paper)}
.pol td input:focus,.pol td select:focus{outline:none;border-color:var(--green)}
.pol td{padding:4px 5px}
.ac{position:relative}
.acbox{position:absolute;left:0;right:0;top:100%;z-index:60;background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 12px 30px rgba(15,21,18,.16);max-height:240px;overflow:auto;display:none;margin-top:3px;min-width:320px}
.acbox.on{display:block}
.acbox .it{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line);font-size:12.5px}
.acbox .it:last-child{border-bottom:0}
.acbox .it:hover,.acbox .it.sel{background:var(--green-soft)}
.acbox .it .m{color:var(--ink-soft);font-size:11px}
.filtry{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filtry input,.filtry select{padding:6px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--paper);font-size:13px}
.ral{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.15);vertical-align:-1px;margin-right:4px}
.fronta{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.fronta .col{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:120px}
.fronta .col .ch{padding:9px 12px;border-bottom:1px solid var(--line);font-family:var(--cond);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;background:#f6faf6}
.fronta .col .ch b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--faint)}
.fronta .col .ch .sp{flex:1}
.fronta .col.k-zadano .ch{background:var(--blue-soft)}
.fronta .col.k-lakovna .ch,.fronta .col.k-zinkovna .ch{background:var(--yellow-soft)}
.fronta .col.k-hotovo .ch{background:var(--green-soft)}
.kart{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.kart:last-child{border-bottom:0}
.kart input[type=checkbox]{margin-top:3px}
.kart .t{flex:1;min-width:0}
.kart .t .k{font-weight:600;font-size:13.5px}
.kart .t .d{font-size:12px;color:var(--ink-soft);margin-top:2px}
.kart .t .d b{color:var(--ink);font-weight:500}
.kart.skluz{border-left:3px solid var(--red)}
.kart .akce{display:flex;flex-direction:column;gap:4px}
.tl{list-style:none;margin:0;padding:0;font-size:12.5px}
.tl li{padding:4px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
.tl li .ts{font-family:var(--mono);color:var(--faint);white-space:nowrap;font-size:11.5px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
.hl{background:var(--yellow-soft)}
details summary{cursor:pointer;color:var(--ink-soft);font-size:12.5px}
.upoz{background:var(--yellow-soft);border:1px solid #e8d9a8;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="ic">📦</div>
    <div><h1>Výroba Popelnice</h1><div class="sub" id="sub">Zakázky boxů a muld závodu Bruntál — zadání, výroba, ložné plány</div></div>
    <div class="sp"></div>
    <div id="topAkce"></div>
  </div>
  <div class="tabs" id="zalozky"></div>
  <div id="obsah" style="margin-top:14px"><div class="card"><div class="empty">Načítám…</div></div></div>
</div>

<div class="modal" id="modal"><div class="box" id="mBox">
  <div class="h"><h2 id="mTitul">—</h2><button class="btn sm" onclick="zavri()">Zavřít</button></div>
  <div class="b" id="mObsah"></div>
  <div class="f2" id="mPaticka"></div>
</div></div>
<div class="modal" id="modal2"><div class="box uzky">
  <div class="h"><h2 id="m2Titul">—</h2><button class="btn sm" onclick="zavri2()">Zavřít</button></div>
  <div class="b" id="m2Obsah"></div>
  <div class="f2" id="m2Paticka"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cis=n=>(n==null||n==="")?"—":Number(n).toLocaleString("cs-CZ");
const dat=s=>s?new Date(String(s).slice(0,10)+"T00:00:00").toLocaleDateString("cs-CZ"):"—";
const kw=(o)=>o.kwDodani?("KW "+o.kwDodani+(o.kwRok?"/"+String(o.kwRok).slice(2):"")):(o.terminDodani?dat(o.terminDodani):"—");
let D=null, ZALOZKA="prehled", FILTR={q:"",stav:"",zak:"",jen:""}, VYBER=new Set();

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2800);}
function zavri(){$("#modal").classList.remove("on");}
function zavri2(){$("#modal2").classList.remove("on");}
function modal(titul,obsah,paticka,uzky){$("#mBox").classList.toggle("uzky",!!uzky);$("#mTitul").textContent=titul;$("#mObsah").innerHTML=obsah;$("#mPaticka").innerHTML=paticka||'<button class="btn" onclick="zavri()">Zavřít</button>';$("#modal").classList.add("on");}
function modal2(titul,obsah,paticka){$("#m2Titul").textContent=titul;$("#m2Obsah").innerHTML=obsah;$("#m2Paticka").innerHTML=paticka||'<button class="btn" onclick="zavri2()">Zavřít</button>';$("#modal2").classList.add("on");}
async function api(cesta,telo){
  const o=telo?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(telo)}:{cache:"no-store"};
  const r=await fetch(cesta,o); const j=await r.json().catch(()=>({}));
  if(!r.ok||j.chyba)throw new Error(j.chyba||("Chyba "+r.status));
  return j;
}
async function nacti(){
  try{ D=await api("/api/vyroba/data"); vykresli(); }
  catch(e){ $("#obsah").innerHTML='<div class="card"><div class="empty">'+esc(e.message)+'</div></div>'; }
}
const S=k=>{const s=(D.stavy||[]).find(x=>x[0]===k);return s?s[1]:k;};
const STAV_IDX=k=>(D.stavy||[]).findIndex(x=>x[0]===k);
function stavPill(p){
  const k=p.stav, i=STAV_IDX(k);
  let cls="mute";
  if(k==="prijata")cls="mute"; else if(k==="zadano")cls="blue"; else if(k==="svarovna")cls="blue"; else if(k==="lakovna"||k==="zinkovna")cls="warn";
  else if(k==="hotovo")cls="ok"; else if(k==="naplanovano")cls="viol"; else if(k==="expedovano"||k==="doruceno")cls="ok"; else if(k==="pozastaveno")cls="warn"; else if(k==="storno")cls="bad";
  let t=S(k); if(k==="hotovo"&&p.hotovoKs&&p.hotovoKs<p.ks)t+=" "+p.hotovoKs+"/"+p.ks; if(p.kamion&&(k==="naplanovano"||k==="expedovano"))t+=" · "+p.kamion;
  return '<span class="pill '+cls+'">'+esc(t)+'</span>'+(p.skluzDni>0?' <span class="pill bad">skluz '+p.skluzDni+' d</span>':'');
}
function ralHtml(p){
  if(p.povrch==="zinek")return '<span class="pill mute">zinek</span>';
  const m=String(p.ral||"").match(/(\d{4})/); const hex=m&&D.ralHex[m[1]];
  return (hex?'<span class="ral" style="background:'+hex+'"></span>':'')+esc(p.ral||(p.povrch==="zaklad"?"základ":"—"))+(p.lem?' <span class="mut">lem '+esc(p.lem)+'</span>':'');
}
function vsechnyPolozky(){ const out=[]; (D.objednavky||[]).forEach(o=>o.polozky.forEach(p=>out.push(Object.assign({_o:o},p)))); return out; }
function obj(id){return (D.objednavky||[]).find(o=>o.id===id);}

/* ---------- záhlaví ---------- */
function vykresliZalozky(){
  const pol=vsechnyPolozky(); const n=k=>pol.filter(p=>p.stav===k).length;
  const veVyrobe=pol.filter(p=>["zadano","svarovna","lakovna","zinkovna"].includes(p.stav)).length;
  const z=[["prehled","Přehled"],["objednavky","Objednávky","<b>"+(D.objednavky||[]).length+"</b>"],["vyroba","Výroba","<b>"+veVyrobe+"</b>"],["expedice","Ložné plány a expedice","<b>"+(n("hotovo")+n("naplanovano"))+"</b>"],["katalog","Katalog"],["zakaznici","Zákazníci"]];
  if(D.me.obchod)z.push(["nastaveni","Nastavení a import"]);
  $("#zalozky").innerHTML=z.map(([k,t,b])=>'<button class="'+(ZALOZKA===k?"on":"")+'" onclick="prepni(\''+k+'\')">'+t+(b||"")+'</button>').join("");
  $("#sub").textContent=(D.me.obchod?"obchod · ":"dílna · ")+(D.me.name||D.me.email)+" · dnes "+dat(D.dnes);
  $("#topAkce").innerHTML=(D.me.obchod?'<button class="btn pri" onclick="formObjednavka()">＋ Nová objednávka</button> ':'')+'<a class="btn" href="/api/vyroba/export">⬇ CSV</a>';
}
function prepni(k){ZALOZKA=k;VYBER.clear();vykresli();}
function vykresli(){
  vykresliZalozky();
  const b=$("#obsah");
  if(ZALOZKA==="prehled")b.innerHTML=htmlPrehled();
  else if(ZALOZKA==="objednavky")b.innerHTML=htmlObjednavky();
  else if(ZALOZKA==="vyroba")b.innerHTML=htmlVyroba();
  else if(ZALOZKA==="expedice")b.innerHTML=htmlExpedice();
  else if(ZALOZKA==="katalog")b.innerHTML=htmlKatalog();
  else if(ZALOZKA==="zakaznici")b.innerHTML=htmlZakaznici();
  else if(ZALOZKA==="nastaveni")b.innerHTML=htmlNastaveni();
}

/* ---------- přehled (živý report) ---------- */
function htmlPrehled(){
  const pol=vsechnyPolozky();
  const skl=pol.filter(p=>p.skluzDni>0), kZad=pol.filter(p=>p.stav==="prijata"), veV=pol.filter(p=>["zadano","svarovna"].includes(p.stav)), koop=pol.filter(p=>["lakovna","zinkovna"].includes(p.stav));
  const hot=pol.filter(p=>p.stav==="hotovo"), bezK=pol.filter(p=>p.cekaBezKamionu), vyk=pol.filter(p=>p.vykres&&p.vykres.stav==="poslan");
  const mes=D.dnes.slice(0,7); const exp=pol.filter(p=>p.stav==="expedovano"&&String(p.expedovanoDne||"").slice(0,7)===mes);
  let h='<div class="stat">'
    +st(skl.length,"ve skluzu proti termínu",skl.length?"bad":"ok","skluz")
    +st(kZad.length,"čeká na zadání",kZad.length?"warn":"","prijata")
    +st(veV.length,"zadáno / svařovna","","vyroba")
    +st(koop.length,"lakovna / zinkovna",koop.length?"warn":"","koop")
    +st(hot.length,"hotovo na skladě","ok","hotovo")
    +st(bezK.length,"hotovo bez kamionu > "+D.nastaveni.upozorneniDny+" d",bezK.length?"warn":"","bezkamionu")
    +st(vyk.length,"výkres čeká na schválení",vyk.length?"warn":"","vykres")
    +st(exp.length,"expedováno tento měsíc","ok","expedovano")
    +'</div>';
  const zak=[...new Set((D.objednavky||[]).map(o=>o.zakaznik).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"cs"));
  h+='<div class="card"><div class="h"><h2>Položky zakázek</h2><div class="sp"></div><div class="filtry">'
    +'<input placeholder="🔍 ČVZ, produkt, zákazník, objednávka…" value="'+esc(FILTR.q)+'" oninput="FILTR.q=this.value;refTab()">'
    +'<select onchange="FILTR.stav=this.value;refTab()"><option value="">všechny stavy</option>'+D.stavy.map(s=>'<option value="'+s[0]+'"'+(FILTR.stav===s[0]?" selected":"")+'>'+esc(s[1])+'</option>').join("")+'</select>'
    +'<select onchange="FILTR.zak=this.value;refTab()"><option value="">všichni zákazníci</option>'+zak.map(z=>'<option'+(FILTR.zak===z?" selected":"")+'>'+esc(z)+'</option>').join("")+'</select>'
    +'<select onchange="FILTR.jen=this.value;refTab()"><option value="">vše</option><option value="skluz"'+(FILTR.jen==="skluz"?" selected":"")+'>jen ve skluzu</option><option value="zive"'+(FILTR.jen==="zive"?" selected":"")+'>jen živé (bez expedovaných a storno)</option><option value="bezkamionu"'+(FILTR.jen==="bezkamionu"?" selected":"")+'>hotovo bez kamionu</option><option value="vykres"'+(FILTR.jen==="vykres"?" selected":"")+'>čeká na výkres</option><option value="koop"'+(FILTR.jen==="koop"?" selected":"")+'>lakovna / zinkovna</option></select>'
    +'</div></div><div class="tw" id="tabPol">'+tabPolozky()+'</div></div>';
  return h;
  function st(n,l,cls,jen){return '<div class="s '+cls+'" onclick="FILTR={q:\'\',stav:\''+(["prijata","hotovo","expedovano"].includes(jen)?jen:"")+'\',zak:\'\',jen:\''+(["skluz","bezkamionu","vykres","koop","vyroba"].includes(jen)?jen:"")+'\'};refTab()"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
}
function refTab(){const t=$("#tabPol");if(t)t.innerHTML=tabPolozky();}
function filtrPol(){
  const q=FILTR.q.trim().toLowerCase();
  return vsechnyPolozky().filter(p=>{
    if(FILTR.stav&&p.stav!==FILTR.stav)return false;
    if(FILTR.zak&&p._o.zakaznik!==FILTR.zak)return false;
    if(FILTR.jen==="skluz"&&!(p.skluzDni>0))return false;
    if(FILTR.jen==="zive"&&["expedovano","doruceno","storno"].includes(p.stav))return false;
    if(FILTR.jen==="bezkamionu"&&!p.cekaBezKamionu)return false;
    if(FILTR.jen==="vykres"&&!(p.vykres&&p.vykres.stav==="poslan"))return false;
    if(FILTR.jen==="koop"&&!["lakovna","zinkovna"].includes(p.stav))return false;
    if(FILTR.jen==="vyroba"&&!["zadano","svarovna"].includes(p.stav))return false;
    if(q){const s=[p.cvz,p.kod,p.razeni,p.ral,p._o.cislo,p._o.helios,p._o.zakaznik,p._o.prijemce,p.kamion].join(" ").toLowerCase(); if(!s.includes(q))return false;}
    return true;
  }).sort((a,b)=>String(a.terminVyroby||"9").localeCompare(String(b.terminVyroby||"9"))||String(a.cvz||"").localeCompare(String(b.cvz||"")));
}

    +'<div class="grid2"><label class="f"><span>ID tabulky</span><input id="nSheet" value="'+esc(n.sheetId)+'"></label><label class="f"><span>List s boxy Contract</span><input id="nList" value="'+esc(n.sheetList)+'"></label>'
    +'<label class="f"><span>List ostatní výrobky</span><input id="nList2" value="'+esc(n.sheetListOstatni)+'"></label><label class="f"><span>Složka Contract na Disku (ID)</span><input id="nDrive" value="'+esc(n.driveRoot)+'"></label></div>'
    +'<p class="mut">Import je bezpečný opakovat: řádky se párují podle ČVZ (26B‑nnn). Položky, které už někdo v intranetu ručně měnil, se nepřepisují. Objednávky se sdružují podle čísla zakázky Helios; číslo Bestellung (BE…) doplní obchod dodatečně.</p>'
    +(D.sheetDostupny?'<button class="btn pri" onclick="importSheet(\'boxy\')">⬇ Importovat list boxů</button> <button class="btn" onclick="importSheet(\'ostatni\')">⬇ Importovat ostatní výrobky</button>':'<div class="upoz">Google service account není na tomto serveru nastaven — použijte vložení řádků níže.</div>')
    +(imp.sheet?'<div class="mut" style="margin-top:8px">Poslední import ze Sheetu: '+new Date(imp.sheet.at).toLocaleString("cs-CZ")+' · '+esc(JSON.stringify(imp.sheet.stat))+'</div>':'')
    +'<details style="margin-top:14px"><summary>Vložit řádky zkopírované z tabulky (Ctrl+C v Sheetu → Ctrl+V sem)</summary><textarea id="nRows" style="width:100%;min-height:120px;margin-top:8px;font-family:var(--mono);font-size:12px" placeholder="26B	724	18.09.2026	CPR 08.00 LacNam	1200x800x800/920	2	20	lakování RAL 5003	0.8	2	ražení názvu: HS MÜHLE	…"></textarea><div style="margin-top:6px"><button class="btn sm" onclick="importRows()">Importovat vložené řádky</button></div></details>'
    +(imp.rows?'<div class="mut" style="margin-top:8px">Poslední vložení: '+new Date(imp.rows.at).toLocaleString("cs-CZ")+' · '+esc(JSON.stringify(imp.rows.stat))+'</div>':'')
    +'</div></div>'
    +'<div class="card"><div class="h"><h2>Číselná řada ČVZ</h2></div><div class="b mut">'+Object.keys(D.seq.cvz||{}).map(r=>r+': poslední pořadí <b>'+D.seq.cvz[r]+'</b>').join(" · ")+(Object.keys(D.seq.cvz||{}).length?"":"zatím žádné číslo nepřiděleno")+'</div></div>';
}
async function ulozNastaveni(){
  try{ await api("/api/vyroba/nastaveni",{reditelVyroby:$("#nRed").value,obchod:$("#nObch").value,prubeznaDobaDny:$("#nDoba").value,upozorneniDny:$("#nUpoz").value,sheetId:$("#nSheet").value,sheetList:$("#nList").value,sheetListOstatni:$("#nList2").value,driveRoot:$("#nDrive").value}); toast("Nastavení uloženo."); nacti(); }catch(e){alert(e.message);}
}
async function importSheet(list){
  if(!confirm("Načíst řádky ze Sheetu a založit chybějící objednávky a položky?"))return;
  try{ const r=await api("/api/vyroba/import/sheet",{list}); alert("Import hotov.\nObjednávek nově: "+r.objednavek+"\nPoložek nově: "+r.polozek+"\nAktualizováno: "+r.aktualizovano+"\nPřeskočeno: "+r.preskoceno); nacti(); }catch(e){alert(e.message);}
}
async function importRows(){
  const t=$("#nRows").value; if(!t.trim())return;
  const rows=t.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split("\t"));
  try{ const r=await api("/api/vyroba/import/rows",{rows}); alert("Import hotov.\nObjednávek nově: "+r.objednavek+"\nPoložek nově: "+r.polozek+"\nAktualizováno: "+r.aktualizovano+"\nPřeskočeno: "+r.preskoceno); nacti(); }catch(e){alert(e.message);}
}

document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#modal2").classList.contains("on"))zavri2(); else zavri(); } });
nacti();
</script>
