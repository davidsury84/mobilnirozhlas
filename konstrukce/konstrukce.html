function actionsFor(z){
  var me=ME, h='', canObch=me.isAdmin||(me.role==='obchodnik'&&z.obchodnikEmail===me.email);
  var canSef=me.isAdmin||me.role==='sef';
  var canKon=me.isAdmin||(me.role==='konstrukter'&&z.assignedTo===me.email);
  var canVyr=me.isAdmin||me.role==='vyrobni-reditel';
  var canVykonny=me.isAdmin||me.role==='vykonny-reditel';
  var blocks=[];

  if(z.stav==='zavod'&&(canVykonny||canSef)){blocks.push(rozdelZavodBlock(z))}
  if(z.stav==='prideleni'&&canSef){blocks.push(assignBlock(z))}

  if((z.stav==='prace'||z.stav==='revize')&&canKon){blocks.push(konstrukterBlock(z))}
  if((z.stav==='prace'||z.stav==='revize')&&canSef&&!canKon){blocks.push('<div class="actions">'+assignReassign(z)+'</div>')}

  if(z.stav==='kontrola'&&canSef){blocks.push(
    '<div class="card" style="background:#faf7fc"><b>Interní kontrola</b>'+
    '<textarea id="kontrolaNote" rows="2" placeholder="Komentář (u vrácení povinný)…" style="margin-top:6px"></textarea>'+
    '<div class="actions"><button class="btn sm" onclick="doAction(\''+z.id+'\',\'kontrola-ok\',\'kontrolaNote\')">✓ V pořádku → obchodník</button>'+
    '<button class="btn warn sm" onclick="doAction(\''+z.id+'\',\'kontrola-vrat\',\'kontrolaNote\')">↩ Vrátit konstruktérovi</button></div></div>')}

  if(z.stav==='obchodnik'&&canObch){blocks.push(obchodnikBlock(z))}

  if(z.stav==='klient'&&canObch){var jeObj=(z.rezim==='objednavka');blocks.push(
    '<div class="card" style="background:#eef7f0"><b>'+(jeObj?'U klienta — schválení výkresu':'U klienta — potvrzení nabídky')+'</b><p class="muted" style="margin:6px 0">Odkaz odeslán klientovi'+(z.link?(', platí do '+fdate(z.link.expiresAt)+', '+z.link.accesses+'× otevřen'):'')+'. '+(jeObj?'Klient schválí výkres přes odkaz, nebo schválení potvrdíte ručně (např. po e-mailu/telefonu) — pak konstrukce vypracuje výrobní dokumentaci.':'Klient potvrdí nabídku přes odkaz, nebo ji potvrdíte ručně (např. po e-mailu/telefonu).')+'</p>'+
    '<div class="actions"><button class="btn sm" onclick="potvrditRucne(\''+z.id+'\')">'+(jeObj?'✓ Potvrdit schválení ručně':'✓ Potvrdit ručně → objednávka')+'</button>'+
    '<button class="btn ghost sm" onclick="copyLink(\''+(z.link?z.link.url:'')+'\')">Kopírovat odkaz</button>'+
    '<button class="btn warn sm" onclick="askStorno(\''+z.id+'\')">Storno</button></div></div>')}

  if(z.stav==='schvaleno'&&(canKon||canSef)){blocks.push(vyrobniDokBlock(z))}

  // pozastavení / obnovení
  if(!isTerminal(z.stav)&&z.stav!=='schvaleno'){
    if(z.stav==='podklady'&&(canObch||canSef))blocks.push('<div class="actions"><button class="btn sm" onclick="doAction(\''+z.id+'\',\'unhold\')">▶ Podklady doplněny — pokračovat</button></div>');
    else if(z.stav!=='podklady'&&(canObch||canSef))blocks.push('<div class="actions" style="margin-top:4px"><button class="btn ghost sm" onclick="askHold(\''+z.id+'\')">⏸ Čeká na podklady</button>'+((canObch||canSef)?'<button class="btn ghost sm" onclick="askTermin(\''+z.id+'\')">Změnit termín</button>':'')+((me.role==='obchodnik'||me.role==='reditel'||me.isAdmin)?'<button class="btn warn sm" onclick="askStorno(\''+z.id+'\')">Storno</button>':'')+'</div>');
  }
  h=blocks.join('');
  return h;
}

function doAction(id,action,noteId){
  var note=noteId?(document.getElementById(noteId)||{}).value||'':'';
  api('/stav','POST',{id:id,action:action,note:note}).then(function(o){
    if(!o.ok){alert(o.j.chyba||'Chyba.');return}
    reloadData();
  });
}
function assign(id,selId){
  var k=(document.getElementById(selId)||{}).value;
  if(!k){alert('Vyberte konstruktéra.');return}
  api('/prideli','POST',{id:id,konstrukter:k}).then(function(o){if(!o.ok){alert(o.j.chyba||'Chyba.');return}reloadData()});
}
function addComment(id){
  var t=(document.getElementById('cmtx')||{}).value||'';if(!t.trim())return;
  api('/komentar','POST',{id:id,text:t}).then(function(o){if(!o.ok){alert(o.j.chyba||'Chyba.');return}reloadData()});
}
function timer(id,action){api('/timer','POST',{id:id,action:action}).then(function(o){if(!o.ok){alert(o.j.chyba);return}reloadData()})}
function manualTime(id){var m=prompt('Kolik minut připsat?');if(!m)return;api('/timer','POST',{id:id,action:'manual',minutes:parseInt(m,10)}).then(function(){reloadData()})}
function uploadFile(id,kind,inp){
  var f=inp.files[0];if(!f)return;
  var errEl=document.getElementById('upErr_'+id);if(errEl)errEl.textContent='Nahrávám '+f.name+'…';
  var rd=new FileReader();
  rd.onload=function(){
    api('/upload','POST',{id:id,kind:kind,name:f.name,dataUrl:rd.result}).then(function(o){
      if(!o.ok){if(errEl)errEl.textContent=o.j.chyba||'Chyba nahrání.';return}
      if(errEl)errEl.textContent='';reloadData();
    });
  };
  rd.readAsDataURL(f);
}
function sendClient(id){
  var mail=(document.getElementById('clMail_'+id)||{}).value||'';
  var pin=(document.getElementById('clPin_'+id)||{}).value||'';
  var text=(document.getElementById('clText_'+id)||{}).value||'';
  var errEl=document.getElementById('sendErr_'+id);errEl.textContent='';
  // pokud změnil e-mail, uložíme přes komentář? — jednoduše pošleme rovnou, backend má kontaktEmail; upravený mail nepřepisujeme, ale respektujeme
  api('/stav','POST',{id:id,action:'odeslat-klientovi',text:text,pin:pin}).then(function(o){
    if(!o.ok){errEl.textContent=o.j.chyba||'Nepodařilo se odeslat.';return}
    reloadData();alert('Náhled odeslán klientovi.');
  });
}

/* ---- přílohy k zadání (PDF/obrázky od zákazníka) ---- */
function dqPrilAdd(inp){
  var files=[].slice.call(inp.files||[]);
  files.forEach(function(f){
    if(DQ_PRIL.length>=5){alert(tr('Maximálně 5 příloh.'));return}
    if(f.size>15e6){alert(f.name+': '+tr('soubor je příliš velký (max 15 MB).'));return}
    var r=new FileReader();
    r.onload=function(){DQ_PRIL.push({name:f.name,dataUrl:r.result});dqPrilRender();};
    r.readAsDataURL(f);
  });
  inp.value='';
}
function dqPrilDel(i){DQ_PRIL.splice(i,1);dqPrilRender();}
function dqPrilRender(){
  var el=document.getElementById('dqPrilList');if(!el)return;
  el.innerHTML=DQ_PRIL.map(function(p,i){
    var kb=Math.round((p.dataUrl.length*0.75)/1024);
    return '<div class="row" style="gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)"><span>📎 <b>'+esc(p.name)+'</b> <span class="muted" style="font-size:11.5px">'+(kb>1024?((kb/1024).toFixed(1)+' MB'):(kb+' kB'))+'</span></span><button type="button" class="btn ghost sm" onclick="dqPrilDel('+i+')">×</button></div>';
  }).join('');
}
function ensureKat(cb){ if(KAT){cb&&cb();return;} fetch('/api/konstrukce/katalog',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){KAT=j.polozky||[];cb&&cb();}).catch(function(){KAT=[];cb&&cb();}); }
function artReset(){DQ_ART='';var i=document.getElementById('artInput');if(i)i.value='';var f=document.getElementById('artInfo');if(f)f.innerHTML='';artClose();}
function artLookup(inp){
  var dd=inp.parentNode.querySelector('.art-dd'); if(!dd)return;
  if(!KAT){ensureKat(function(){artLookup(inp);});return;}
  var tk=((document.getElementById('nTyp')||{}).value||'').toUpperCase();
  var rada=tk?('ABR-'+tk):'';
  var q=inp.value.trim().toLowerCase();
  var res=(KAT||[]).filter(function(x){ if(rada&&x.rada!==rada)return false; if(!q)return true; return (x.art+' '+(x.rozmery||'')+' '+x.provedeni+' '+(x.objem||'')+'m3').toLowerCase().indexOf(q)>=0; }).slice(0,14);
  if(!res.length){dd.style.display='none';return;}
  dd.innerHTML=res.map(function(x){return '<div class="art-i" onmousedown="artPick('+KAT.indexOf(x)+')"><b>'+esc(x.art)+'</b> <span class="art-prov">'+esc(x.provedeni)+'</span> <span class="muted">'+esc(x.rozmery||'')+' · '+(x.objem||'?')+' m³ · '+(x.hmotnost||'?')+' kg'+(x.pcCzk?' · '+x.pcCzk.toLocaleString('cs-CZ')+' Kč':'')+'</span></div>';}).join('');
  dd.style.display='block';
}
function artClose(){document.querySelectorAll('.art-dd').forEach(function(d){d.style.display='none'});}
function artPick(i){
  var x=KAT&&KAT[i]; if(!x)return;
  DQ_ART=x.art+(x.art.indexOf(x.provedeni)<0?' — '+x.provedeni:'');
  var inp=document.getElementById('artInput'); if(inp)inp.value=DQ_ART; artClose();
  var rz=document.getElementById('dq_rozmery'); if(rz&&x.rozmery)rz.value=x.rozmery;
  var seg=document.querySelector('.dq2[data-k="provedeni"]');
  if(seg&&x.provedeni){
    var std=seg.querySelector('.seg[data-v=standard]');
    var opceMatch=null;seg.querySelectorAll('.seg[data-v=opce]').forEach(function(o){if(!opceMatch&&((o.getAttribute('data-optval')||'')+' '+o.textContent).indexOf(x.provedeni)>=0)opceMatch=o;});
    if(std&&std.textContent.indexOf(x.provedeni)>=0)segClick(std);
    else if(opceMatch)segClick(opceMatch);
    else{var poz=seg.querySelector('.seg[data-v=pozadavek]');if(poz){segClick(poz);var rq=document.getElementById('dqr_provedeni');if(rq)rq.value=x.provedeni;}}
  }
  var info=document.getElementById('artInfo');
  if(info)info.innerHTML='<span class="art-tag">'+esc(x.rada)+'</span> '+esc(x.rozmery||'')+' · '+(x.objem||'?')+' m³ · '+(x.hmotnost||'?')+' kg · '+esc(x.provedeni)+(x.pcCzk?' · orient. '+x.pcCzk.toLocaleString('cs-CZ')+' Kč / '+(x.pcEur||'?')+' €':'');
}

function collectDot(){
  var t=curType(),dot={};
  (t.dotaznik||[]).forEach(function(sec){(sec.fields||[]).forEach(function(f){
    if(f.std!==undefined){var volba=selVolba(f.k);if(volba==='pozadavek'){var rv=val('dqr_'+f.k);if(rv.trim())dot[f.k]={volba:'pozadavek',hodnota:rv.trim()};}else if(volba==='opce'){var d={volba:'opce'};var ov=selOptVal(f.k);if(ov)d.hodnota=ov;var od=val('dqo_'+f.k);if(od&&od.trim())d.detail=od.trim();dot[f.k]=d;}else dot[f.k]={volba:volba};}
    else{var v=val('dq_'+f.k);if(v.trim())dot[f.k]=v.trim();}
  })});
  return dot;
}

function buildTselPanel(selKey){

function hexRgb(h){h=String(h||'').replace('#','');if(h.length<6)return[128,128,128];return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function ralByCode(m){if(!m)return null;return RAL.find(function(r){return r.c.replace(/\D/g,'')===m})||null;}
function nearestRAL(hex){var t=hexRgb(hex),best=RAL[0],bd=1e18;RAL.forEach(function(r){var c=hexRgb(r.hex),d=(c[0]-t[0])*(c[0]-t[0])+(c[1]-t[1])*(c[1]-t[1])+(c[2]-t[2])*(c[2]-t[2]);if(d<bd){bd=d;best=r;}});return best;}
function ralApply(k,r){if(!r)return;var inp=document.getElementById('dq_'+k);var rest=inp.value.replace(/^\s*RAL\s*\d{4}\s*/i,'').trim();inp.value=(r.c+(rest?' '+rest:'')).trim();ralMark(k);}
function ralPick(k,code){var r=RAL.find(function(x){return x.c===code});if(r){ralApply(k,r);var inp=document.getElementById('dq_'+k);if(inp)inp.focus();}}
function ralColorInput(k,el){ralApply(k,nearestRAL(el.value));}
function ralMark(k){
  var inp=document.getElementById('dq_'+k);var m=(inp.value.match(/RAL\s*(\d{4})/i)||[])[1]||'';var r=ralByCode(m);
  document.querySelectorAll('.ral-sw[data-k="'+k+'"]').forEach(function(s){s.classList.toggle('sel',s.getAttribute('data-code')===m)});
  var pick=document.getElementById('ralPick_'+k);if(pick&&r)pick.value=r.hex;
  var cur=document.getElementById('ralCur_'+k);if(cur)cur.innerHTML=r?('<b style="color:'+r.hex+';filter:brightness(.75)">'+esc(r.c)+'</b> · '+esc(r.n)):'<span class="muted">'+esc(tr('vyberte odstín'))+'</span>';
}
function selVolba(k){var s=document.querySelector('.dq2[data-k="'+k+'"] .seg.sel');return s?s.getAttribute('data-v'):'standard';}
function seg(k,v,tag,label,cur){return '<button type="button" class="seg'+(cur===v?' sel':'')+'" data-v="'+v+'" onclick="segClick(this)"><span class="st">'+tag+'</span>'+esc(label||'—')+'</button>';}
// jedna z více samostatných opcí (data-optval = zdrojová CZ hodnota, label = přeložený text)
function segOpt(k,val,label,sel){return '<button type="button" class="seg'+(sel?' sel':'')+'" data-v="opce" data-optval="'+esc(val)+'" onclick="segClick(this)"><span class="st">opce</span>'+esc(label||'—')+'</button>';}
function selOptVal(k){
  var row=document.querySelector('.dq2[data-k="'+k+'"]'); if(!row)return '';
  var s=row.querySelector('.seg.sel[data-v="opce"]');
  if(s&&s.getAttribute('data-optval'))return s.getAttribute('data-optval')||'';
  var sel=row.querySelector('select.dq2-opt');   // dlouhé číselníky = rozbalovací select
  return sel?(sel.value||''):'';
}
// rozdělí opce na samostatné volby: přeloží celý řetězec, pak dělí dle „ / " (kousky zůstanou zarovnané); při nejednoznačnosti = jedna volba.
function splitOpts(opceRaw){
  if(!opceRaw)return [];
  var valP=String(opceRaw).split(' / '), labP=String(tr(opceRaw)).split(' / ');
  if(valP.length>=2 && labP.length===valP.length) return valP.map(function(v,i){return {val:v,lab:labP[i]};});
  return [{val:opceRaw,lab:tr(opceRaw)}];
}
function segClick(el){var row=el.closest('.dq2');row.querySelectorAll('.seg').forEach(function(s){s.classList.remove('sel')});el.classList.add('sel');var v=el.getAttribute('data-v');
  var req=row.querySelector('.dq2-req');if(req)req.style.display=(v==='pozadavek'?'':'none');
  // rozbalovací katalog jen pro trigger bez konkrétní hodnoty (řadové opce mají data-optval)
  var ow=row.querySelector('.dq2-optwrap');if(ow)ow.style.display=(v==='opce'&&!el.getAttribute('data-optval')?'':'none');
  if(v==='pozadavek'&&req)req.focus(); else if(v==='opce'&&ow){var oi=ow.querySelector('.dq2-opt');if(oi)oi.focus();}
  dqKodPreview();}
/* ---- Natahování: obrázkové dlaždice (ilustrace z katalogu ABROLL) ---- */
function natGrid(f,opts,vol,curOpt,rq){
  var tile=function(dv,val,lab,selq){
    var kd=String(val).trim().split(/[\s—–]+/)[0]||'';
    var img=(D.natahImg||{})[kd];
    var pop=String(lab).replace(/^[^—]*—\s*/,'');if(pop.length>52)pop=pop.slice(0,50)+'…';
    return '<button type="button" class="seg nat-tile'+(selq?' sel':'')+'" data-v="'+dv+'"'+(dv==='opce'?' data-optval="'+esc(val)+'"':'')+' onclick="segClick(this)" title="'+esc(lab)+'">'+
      (img?'<img loading="lazy" src="/api/konstrukce/natah-img?f='+esc(img)+'" alt="">':'')+
      '<span class="nk">'+esc(kd)+(dv==='standard'?' · STD':'')+'</span><span class="np">'+esc(pop)+'</span></button>';
  };
  var katOpts=splitOpts(f.kat||'');
  var vTile=opts.some(function(o){return o.val===curOpt});
  var katSel=(vol==='opce'&&!vTile&&!!curOpt);
  var katBtn=katOpts.length?('<button type="button" class="seg'+(katSel?' sel':'')+'" data-v="opce" data-kat="1" onclick="segClick(this)"><span class="st">▾</span>'+esc(tr('další z katalogu'))+' ('+katOpts.length+')</button>'):'';
  var katWrap=katOpts.length?('<div class="dq2-optwrap" style="'+(katSel?'':'display:none')+'"><select class="dq2-opt" onchange="segSelect(this,\'opce\')"><option value=""'+(katSel?'':' selected')+' disabled>'+esc(tr('vyberte z katalogu…'))+'</option>'+
    katOpts.map(function(o){return '<option value="'+esc(o.val)+'"'+(curOpt===o.val?' selected':'')+'>'+esc(o.lab)+'</option>'}).join('')+'</select></div>'):'';
  return '<div class="dq2" data-k="'+f.k+'"><div class="dq2-l">'+esc(tr(f.label))+'</div>'+
    '<div class="dq2-seg" style="flex-direction:column;align-items:stretch">'+
      '<div class="nat-grid">'+
        tile('standard',f.std,f.std,vol==='standard')+
        opts.map(function(o){return tile('opce',o.val,o.lab,vol==='opce'&&curOpt===o.val)}).join('')+
      '</div>'+
      '<div class="row" style="gap:6px">'+katBtn+seg(f.k,'pozadavek','✎',tr('vlastní'),vol)+'</div>'+katWrap+
    '</div>'+
    '<input class="dq2-req" id="dqr_'+f.k+'" value="'+esc(rq)+'" placeholder="'+esc(tr('požadavek zákazníka…'))+'" style="'+(vol==='pozadavek'?'':'display:none')+'" oninput="segSelect(this,\'pozadavek\')"></div>';
}
/* ---- Živý náhled celkového kódu ABR (varianta B — standardy se nevypisují) ---- */
/* ABR_RADY_JS deklarováno výše u TYP_FAM (jeden zdroj pravdy pro řady ABR) */
function dqField(k){var t=curType(),r=null;(t.dotaznik||[]).forEach(function(s){(s.fields||[]).forEach(function(f){if(f.k===k)r=f})});return r}
function dqKodPreview(){
  var el=document.getElementById('dqKod'); if(!el)return;
  var t=curType();
  var koded=(t.dotaznik||[]).some(function(s){return (s.fields||[]).some(function(f){return f.kod})});
  if(!koded||ABR_RADY_JS.indexOf(t.key)<0){el.style.display='none';var ex=document.getElementById('dqExtra');if(ex)ex.style.display='none';return}
  var parts=['ABR-'+String(t.key||'').toUpperCase()];
  var roz=((document.getElementById('dq_rozmery')||{}).value||'').replace(/\s+/g,'').replace(/[×X]/g,'x');
  var pf=dqField('provedeni'),pvol=selVolba('provedeni');
  var pleS=pvol==='standard'?(pf?pf.std:''):(pvol==='opce'?selOptVal('provedeni'):((document.getElementById('dqr_provedeni')||{}).value||''));
  var ple=(String(pleS).match(/(\d)\s*\/\s*(\d)/)||[]);
  if(roz)parts.push(roz+(ple[1]?('-'+ple[1]+ple[2]):''));
  var vyska=parseInt(roz.split('x')[2]||'',10)||0;
  var afnor=(t.key==='afs');
  (t.dotaznik||[]).forEach(function(sec){(sec.fields||[]).forEach(function(f){
    if(!f.kod)return;
    var vol=selVolba(f.k); if(vol==='pozadavek')return;
    var hod=(vol==='standard')?f.std:(selOptVal(f.k)||'');
    var kd=String(hod).trim().split(/[\s—–]+/)[0]||'';
    if(!kd||kd==='NE'||kd==='—')return;
    var stdKd=String(f.std).trim().split(/[\s—–]+/)[0]||'';
    if(f.k==='natahovani'){if(!afnor&&kd===stdKd)return;parts.push(kd.replace(/\//g,'_'));return;}
    if(f.k==='zebrik'){if(vyska>=1500)parts.push(kd.replace(/\//g,'_'));return;}
    if(kd===stdKd)return;
    parts.push(kd.replace(/\//g,'_'));
  })});
  el.style.display='';
  el.innerHTML='<b>'+esc(tr('Kód'))+':</b> <span class="k">'+esc(parts.join('-'))+'</span>';
  dqExtraUpdate(parts.join('-'));
}
function segSelect(inp,v){var row=inp.closest('.dq2');row.querySelectorAll('.seg').forEach(function(s){s.classList.remove('sel')});
  // změna z katalogového selectu → označit trigger „další z katalogu", ne první řadovou opci
  var b=null;
  if(v==='opce'&&inp.classList&&inp.classList.contains('dq2-opt'))b=row.querySelector('.seg[data-kat]');
  if(!b)b=row.querySelector('.seg[data-v='+v+']');
  if(b)b.classList.add('sel');dqKodPreview();}
function renderDotaznik(){

      h+='<div class="dqsec2">'+esc(tr(sec.title||''))+'</div>';
      (sec.fields||[]).forEach(function(f){
        var a=pf[f.k];
        if(f.std!==undefined){
          np++;
          var vol=(a&&a.volba)||'standard', rq=(a&&a.volba==='pozadavek')?(a.hodnota||''):'', oc=(a&&a.detail!=null)?a.detail:'';

            var katBtn=katOpts.length?('<button type="button" class="seg'+(katSel?' sel':'')+'" data-v="opce" data-kat="1" onclick="segClick(this)"><span class="st">▾</span>'+esc(tr('další z katalogu'))+' ('+katOpts.length+')</button>'):'';
            var katWrap=katOpts.length?('<div class="dq2-optwrap" style="'+(katSel?'':'display:none')+'"><select class="dq2-opt" onchange="segSelect(this,\'opce\')"><option value=""'+(katSel?'':' selected')+' disabled>'+esc(tr('vyberte z katalogu…'))+'</option>'+
              katOpts.map(function(o){return '<option value="'+esc(o.val)+'"'+(curOpt===o.val?' selected':'')+'>'+esc(o.lab)+'</option>'}).join('')+'</select></div>'):'';
            h+='<div class="dq2" data-k="'+f.k+'"><div class="dq2-l">'+esc(tr(f.label))+'</div><div class="dq2-seg">'+
              seg(f.k,'standard','std',tr(f.std),vol)+
              optSegs+katBtn+
              seg(f.k,'pozadavek','✎',tr('vlastní'),vol)+
              '</div>'+katWrap+
              '<input class="dq2-req" id="dqr_'+f.k+'" value="'+esc(rq)+'" placeholder="'+esc(tr('požadavek zákazníka…'))+'" style="'+(vol==='pozadavek'?'':'display:none')+'" oninput="segSelect(this,\'pozadavek\')"></div>';
          } else if(opts.length>6){
            // dlouhý číselník (klapky, střechy, rolny…) → rozbalovací výběr z katalogu
            var osel='<div class="dq2-optwrap" style="'+(vol==='opce'?'':'display:none')+'"><select class="dq2-opt" onchange="segSelect(this,\'opce\')">'+
              opts.map(function(o){return '<option value="'+esc(o.val)+'"'+(curOpt===o.val?' selected':'')+'>'+esc(o.lab)+'</option>'}).join('')+'</select></div>';
            h+='<div class="dq2" data-k="'+f.k+'"><div class="dq2-l">'+esc(tr(f.label))+'</div><div class="dq2-seg">'+
              seg(f.k,'standard','std',tr(f.std),vol)+
              seg(f.k,'opce','▾',tr('vybrat z katalogu')+' ('+opts.length+')',vol)+
              seg(f.k,'pozadavek','✎',tr('vlastní'),vol)+
              '</div>'+osel+
              '<input class="dq2-req" id="dqr_'+f.k+'" value="'+esc(rq)+'" placeholder="'+esc(tr('požadavek zákazníka…'))+'" style="'+(vol==='pozadavek'?'':'display:none')+'" oninput="segSelect(this,\'pozadavek\')"></div>';
          } else {
          var optSegs=opts.map(function(o){var sel=vol==='opce'&&(single||curOpt===o.val);return segOpt(f.k,o.val,o.lab,sel);}).join('');
          var optInp=(f.opceVstup&&single)?('<div class="dq2-optwrap" id="dqow_'+f.k+'" style="'+(vol==='opce'?'':'display:none')+'"><input class="dq2-opt" id="dqo_'+f.k+'" '+(f.opceVstup.num?'type="number" min="0" inputmode="numeric"':'')+' value="'+esc(oc)+'" placeholder="'+esc(tr(f.opceVstup.placeholder||''))+'" oninput="segSelect(this,\'opce\')">'+(f.opceVstup.unit?'<span class="dq2-unit">'+esc(f.opceVstup.unit)+'</span>':'')+'</div>'):'';
          h+='<div class="dq2" data-k="'+f.k+'"><div class="dq2-l">'+esc(tr(f.label))+'</div><div class="dq2-seg">'+
            seg(f.k,'standard','std',tr(f.std),vol)+
            optSegs+
            seg(f.k,'pozadavek','✎',tr('vlastní'),vol)+
            '</div>'+optInp+
            '<input class="dq2-req" id="dqr_'+f.k+'" value="'+esc(rq)+'" placeholder="'+esc(tr('požadavek zákazníka…'))+'" style="'+(vol==='pozadavek'?'':'display:none')+'" oninput="segSelect(this,\'pozadavek\')"></div>';
          }
        } else if(f.type==='adresa'){
          h+='<div class="dq2" data-k="'+f.k+'"><div class="dq2-l">'+esc(tr(f.label))+'</div><div class="dq2-seg" style="flex-direction:column;align-items:stretch;gap:2px;position:relative">'+
            '<input id="dq_'+f.k+'" class="txt" autocomplete="off" value="'+esc(typeof a==='string'?a:'')+'" placeholder="'+esc(tr('začněte psát adresu…'))+'" oninput="adrLookup(this)" onfocus="adrLookup(this)" onblur="setTimeout(adrClose,180)">'+
            '<div class="adr-dd" style="display:none"></div>'+
            '<div class="dq-hint">'+esc(tr('našeptává z OpenStreetMap'))+' · '+((D.adresy||[]).length)+' '+(DQ_LANG==='en'?'saved':DQ_LANG==='de'?'gespeichert':DQ_LANG==='pl'?'zapisane':DQ_LANG==='ua'?'збережено':DQ_LANG==='ro'?'salvat':'uloženo')+'</div></div></div>';
        } else if(f.ral){
          var m0=(String(typeof a==='string'?a:'').match(/RAL\s*(\d{4})/i)||[])[1]||'';var r0=ralByCode(m0);
          h+='<div class="dq2" data-k="'+f.k+'"><div class="dq2-l">'+esc(tr(f.label))+'</div><div class="dq2-seg" style="flex-direction:column;align-items:stretch;gap:7px">'+
            '<div class="ral-row"><input type="color" class="ral-pick" id="ralPick_'+f.k+'" value="'+(r0?r0.hex:'#8a8a8a')+'" title="'+esc(tr('Vybrat barvu (kukátko / pipeta)'))+'" oninput="ralColorInput(\''+f.k+'\',this)"><span class="ral-cur" id="ralCur_'+f.k+'">'+(r0?('<b style="color:'+r0.hex+';filter:brightness(.75)">'+esc(r0.c)+'</b> · '+esc(r0.n)):'<span class="muted">'+esc(tr('vyberte odstín'))+'</span>')+'</span><span class="muted" style="font-size:11.5px;margin-left:auto">'+esc(tr('nejbližší RAL'))+'</span></div>'+
            ralTB(f.k)+
            '<input id="dq_'+f.k+'" class="txt" value="'+esc(typeof a==='string'?a:'')+'" placeholder="'+esc(tr('RAL a další poznámky…'))+'" oninput="ralMark(\''+f.k+'\')"></div></div>';
        } else if(f.type==='textarea'){
          h+='<div class="dq2" data-k="'+f.k+'"><div class="dq2-l">'+esc(tr(f.label))+'</div><div class="dq2-seg" style="flex-direction:column;align-items:stretch;gap:3px">'+

        } else {
          h+='<div class="dq2" data-k="'+f.k+'"><div class="dq2-l">'+esc(tr(f.label))+'</div><div class="dq2-seg"'+(f.hint?' style="flex-direction:column;align-items:stretch;gap:2px"':'')+'><input id="dq_'+f.k+'" class="txt" '+(f.type==='number'?'type="number" inputmode="decimal"':'')+' value="'+esc(typeof a==='string'?a:'')+'" placeholder="…">'+(f.hint?'<div class="dq-hint">'+esc(tr(f.hint))+'</div>':'')+'</div></div>';
        }
      });
    });
    var cnt=document.getElementById('dqcount');if(cnt)cnt.textContent=(t.name?t.name.split(' ')[0]+' · ':'')+np+' '+tr('parametrů');
  } else {
    h+='<div class="dqsec2">'+esc(tr('Parametry výrobku'))+'</div>';
    (t.params||[]).forEach(function(p,i){h+='<label>'+esc(p.label)+'</label><input id="pp_'+i+'" data-lbl="'+esc(p.label)+'" placeholder="'+esc(p.examples||'')+'">'});
  }
  document.getElementById('paramBox').innerHTML=h;
  (t.dotaznik||[]).forEach(function(sec){(sec.fields||[]).forEach(function(f){if(f.ral)ralMark(f.k)})});
  var pb=document.getElementById('paramBox');
  if(pb&&!pb._kodHook){pb._kodHook=1;pb.addEventListener('input',function(){dqKodPreview()});}

function createZak(){
  var t=curType();
  var params={},dot={};
  if(t.dotaznik&&t.dotaznik.length){
    t.dotaznik.forEach(function(sec){(sec.fields||[]).forEach(function(f){
      if(f.std!==undefined){
        var volba=selVolba(f.k);
        var hodnota=volba==='standard'?f.std:(volba==='opce'?selOptVal(f.k):((document.getElementById('dqr_'+f.k)||{}).value||''));
        if(hodnota&&String(hodnota).trim()){dot[f.k]={volba:volba,hodnota:String(hodnota).trim()};
          if(volba==='opce'&&f.opceVstup){var od=(document.getElementById('dqo_'+f.k)||{}).value||'';if(od.trim())dot[f.k].detail=od.trim();}}
      }else{var v=(document.getElementById('dq_'+f.k)||{}).value||'';if(v.trim())dot[f.k]=v.trim();}
    })});
  }else{
    document.querySelectorAll('#paramBox input[data-lbl]').forEach(function(inp){if(inp.value.trim())params[inp.getAttribute('data-lbl')]=inp.value.trim()});
  }
  var b={typKey:(document.getElementById('nTyp')||{}).value,zakaznik:(document.getElementById('nZak')||{}).value,kontakt:(document.getElementById('nKontakt')||{}).value,kontaktEmail:(document.getElementById('nMail')||{}).value,cisloPoptavky:(document.getElementById('nPopt')||{}).value,pozadovanyTermin:(document.getElementById('nTerm')||{}).value,params:params,dotaznik:dot,artNo:DQ_ART,
    rezim:(MODE==='nabidka'?'nabidka':'objednavka'),stredisko:(document.getElementById('nZavod')||{}).value||'',
    prilohy:DQ_PRIL};
  if(!b.zakaznik.trim()){document.getElementById('nErr').textContent=tr('Vyplňte zákazníka.');return}
  api('/zakazka','POST',b).then(function(o){
    if(!o.ok){document.getElementById('nErr').textContent=o.j.chyba||'Chyba.';return}
    closeModal();reloadData();if(o.j.warn)alert(o.j.warn);
  });
}
var ADR_T=null;
function adrLookup(inp){
  var dd=inp.parentNode.querySelector('.adr-dd'); if(!dd)return;
  var q=inp.value.trim();
  var local=(D.adresy||[]).filter(function(a){return a.toLowerCase().indexOf(q.toLowerCase())>=0}).slice(0,4);
  renderAdrDD(dd,local,[],q.length>=3);
  clearTimeout(ADR_T);
  if(q.length<3)return;
  ADR_T=setTimeout(function(){
    fetch('/api/konstrukce/geocode?q='+encodeURIComponent(q)+'&lang='+(DQ_LANG==='cs'?'default':(DQ_LANG==='ua'?'uk':DQ_LANG)),{cache:'no-store'})
      .then(function(r){return r.json()}).then(function(j){renderAdrDD(dd,local,(j.items||[]),false)}).catch(function(){});
  },350);
}
function renderAdrDD(dd,local,osm,loading){
  var h='';
  local.forEach(function(a){h+=adrRow(a,'saved')});
  osm.forEach(function(a){if(local.indexOf(a)>=0)return;h+=adrRow(a,'osm')});
  if(loading&&!osm.length)h+='<div class="adr-load">'+esc(tr('hledám v OpenStreetMap…'))+'</div>';
  if(!h){dd.style.display='none';return}
  dd.innerHTML=h;dd.style.display='block';
}

/* ---- evidence práce (timesheet) ---- */
function monthStart(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hnum(h){return (Math.round((h||0)*10)/10).toString().replace('.',',')}
function renderTimesheet(m){
  if(!TS.from){TS.from=monthStart();TS.to=todayStr()}
  m.innerHTML='<div class="head"><h2>Evidence práce</h2></div><p class="muted">Načítám…</p>';
  var qs='from='+TS.from+'&to='+TS.to+(TS.user?('&user='+encodeURIComponent(TS.user)):'');
  api('/timesheet?'+qs).then(function(o){
    if(!o.ok){m.innerHTML='<div class="empty">'+esc(o.j.chyba||'Chyba.')+'</div>';return}
    TS.data=o.j; drawTimesheet(m);
  });
}
function drawTimesheet(m){
  var j=TS.data, e=j.entries, all=j.me.canSeeAll;
  // souhrny
  var tot=0,zak=0,rez=0,days={};
  e.forEach(function(x){tot+=x.hours;if(x.kind==='zakazka')zak+=x.hours;else rez+=x.hours;days[x.date]=1});
  var nd=Object.keys(days).length;
  // reporty
  var byAct={},byZak={};
  e.forEach(function(x){byAct[x.activity]=(byAct[x.activity]||0)+x.hours;var k=x.zakCislo||x.zakazka;if(k)byZak[k]=(byZak[k]||0)+x.hours});
  var actRows=Object.keys(byAct).map(function(k){return [k,byAct[k]]}).sort(function(a,b){return b[1]-a[1]});
  var zakRows=Object.keys(byZak).map(function(k){return [k,byZak[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,15);

  var h='<div class="head"><h2>Evidence práce</h2><div class="row">'+
    '<input type="date" value="'+TS.from+'" onchange="TS.from=this.value;renderMain()" style="width:150px">'+
    '<span class="muted">–</span><input type="date" value="'+TS.to+'" onchange="TS.to=this.value;renderMain()" style="width:150px">'+
    (all?userFilter(j):'')+'</div></div>';

  // formulář zápisu
  h+=tsForm(j);

  // KPI karty
  h+='<div class="kpi">'+kc(hnum(tot)+' h','Celkem hodin')+kc(hnum(zak)+' h','Na zakázky')+kc(hnum(rez)+' h','Režie')+kc(nd,'Dní se zápisem')+kc(e.length,'Záznamů')+'</div>';

  // reporty
  h+='<div class="two"><div><div class="sec">Hodiny podle činnosti</div><div class="card">'+
    (actRows.length?actRows.map(function(r){return repRow(r[0],r[1],tot)}).join(''):'<p class="muted" style="margin:0">Žádná data.</p>')+'</div></div>'+
    '<div><div class="sec">Top zakázky podle hodin</div><div class="card">'+
    (zakRows.length?zakRows.map(function(r){return repRow(r[0],r[1],tot)}).join(''):'<p class="muted" style="margin:0">Žádná data.</p>')+'</div></div></div>';

  // seznam záznamů podle dní
  h+='<div class="sec">Záznamy ('+e.length+')</div>';
  if(!e.length)h+='<div class="empty">V tomto období nejsou žádné záznamy.</div>';
  else{
    var curd='';
    e.forEach(function(x){
      if(x.date!==curd){curd=x.date;h+='<div class="muted" style="font-weight:700;margin:12px 0 4px">'+fdate(new Date(x.date+'T00:00:00Z').getTime())+(all?'':'')+'</div>'}
      h+='<div class="card" style="padding:9px 12px;margin-bottom:6px"><div class="row" style="justify-content:space-between">'+
        '<div style="min-width:0"><b>'+esc(x.activity)+'</b> <span class="tag">'+(x.kind==='zakazka'?'zakázka':'režie')+'</span>'+
        (x.zakCislo||x.zakazka?'<div class="sub">'+esc(x.zakCislo||x.zakazka)+(x.percent!=null?(' · '+x.percent+' %'):'')+(x.note?(' · '+esc(x.note)):'')+'</div>':(x.note?'<div class="sub">'+esc(x.note)+'</div>':''))+
        (all?'<div class="sub" style="opacity:.7">'+esc(x.userName||x.user)+'</div>':'')+'</div>'+
        '<div class="row" style="gap:6px"><b style="white-space:nowrap">'+hnum(x.hours)+' h</b>'+
        ((all||x.user===ME.email)?'<button class="btn ghost sm" onclick="tsEdit(\''+x.id+'\')">Upravit</button><button class="btn warn sm" onclick="tsDelete(\''+x.id+'\')">×</button>':'')+'</div>'+
      '</div></div>';
    });
  }
  m.innerHTML=h;
}
function userFilter(j){
  var opts='<option value="">Všichni</option>';
  (j.users||[]).forEach(function(u){opts+='<option value="'+esc(u.email)+'"'+(TS.user===u.email?' selected':'')+'>'+esc(u.name)+' ('+hnum(u.hours)+' h)</option>'});
  return '<select onchange="TS.user=this.value;renderMain()" style="width:auto">'+opts+'</select>';
}
function repRow(label,hours,tot){
  var pct=tot>0?Math.round(hours/tot*100):0;

    '<div class="capbar" style="margin-top:3px"><i style="width:'+pct+'%;background:var(--g3)"></i></div></div>';
}
function tsForm(j){
  var ed=TS.editing;

  var zakOpts='<option value="">— bez zakázky (režie) / vlastní kód —</option>'+(j.zakazky||[]).map(function(z){return '<option value="'+esc(z.id)+'"'+(ed&&ed.zakId===z.id?' selected':'')+'>'+esc(z.cislo)+' · '+esc(z.zakaznik)+'</option>'}).join('');
  var userSel='';
  if(j.me.canSeeAll){var uo=(j.users||[]).map(function(u){return '<option value="'+esc(u.email)+'"'+(ed&&ed.user===u.email?' selected':'')+'>'+esc(u.name)+'</option>'}).join('');
    userSel='<div><label>Konstruktér</label><input id="tsUser" list="tsUsers" value="'+esc(ed?ed.user:(TS.user||''))+'" placeholder="e-mail"><datalist id="tsUsers">'+uo+'</datalist></div>';}
  return '<div class="card" style="background:#f3faf5"><b>'+(ed?'Upravit záznam':'Přidat záznam')+'</b>'+
    '<div class="two" style="margin-top:8px"><div><label>Datum</label><input type="date" id="tsDate" value="'+(ed?ed.date:todayStr())+'"></div>'+
    '<div><label>Druh práce</label><select id="tsAct">'+actOpts+'</select></div></div>'+
    '<div class="two"><div><label>Zakázka (workflow)</label><select id="tsZak" onchange="if(this.value)document.getElementById(\'tsZakFree\').value=\'\'">'+zakOpts+'</select></div>'+
    '<div><label>…nebo vlastní kód zakázky</label><input id="tsZakFree" value="'+esc(ed?ed.zakazka:'')+'" placeholder="např. 25B876 nebo ABR-…"></div></div>'+
    '<div class="two">'+userSel+'<div class="two" style="gap:12px"><div><label>Hodiny</label><input id="tsHours" inputmode="decimal" value="'+(ed?hnum(ed.hours):'')+'" placeholder="2,5"></div><div><label>% dokončení</label><input id="tsPct" inputmode="numeric" value="'+(ed&&ed.percent!=null?ed.percent:'')+'" placeholder="volitelné"></div></div></div>'+
    '<label>Poznámka</label><input id="tsNote" value="'+esc(ed?ed.note:'')+'" placeholder="volitelné">'+
    '<div class="err" id="tsErr"></div>'+
    '<div class="actions" style="margin-top:10px"><button class="btn sm" onclick="tsSave()">'+(ed?'Uložit změny':'Přidat záznam')+'</button>'+(ed?'<button class="btn ghost sm" onclick="TS.editing=null;renderMain()">Zrušit úpravu</button>':'')+'</div></div>';
}
function tsSave(){
  function v(id){return (document.getElementById(id)||{}).value}
  var b={id:TS.editing?TS.editing.id:'',date:v('tsDate'),activityKey:v('tsAct'),zakId:v('tsZak'),zakazka:v('tsZakFree'),hours:v('tsHours'),percent:v('tsPct'),note:v('tsNote')};
  if(TS.data.me.canSeeAll){var uu=v('tsUser');if(uu)b.user=uu}

function tsEdit(id){var x=(TS.data.entries||[]).find(function(e){return e.id===id});if(!x)return;TS.editing=x;renderMain();window.scrollTo(0,0)}
function tsDelete(id){if(!confirm('Smazat záznam?'))return;api('/timesheet/delete','POST',{id:id}).then(function(o){if(!o.ok){alert(o.j.chyba);return}renderMain()})}

function addActivity(){

  api('/admin/activity','POST',{key:key,label:label,kind:kind}).then(function(o){if(!o.ok){alert(o.j.chyba);return}reloadData();renderMain()});
}
function delActivity(key){if(!confirm('Smazat činnost z číselníku? (existující záznamy zůstanou)'))return;api('/admin/activity','POST',{key:key,delete:true}).then(function(){reloadData();renderMain()})}

  });
  if(!people||!people.length)h+='<p class="muted" style="margin:6px 0">Zatím nikdo.</p>';
  h+='<div class="row" style="margin-top:8px">'+personPicker('add_'+role,'','addRolePerson(\''+role+'\',this.value)','+ přidat osobu…')+'</div>'+(extra||'')+'</div>';
  return h;
}
// Rozbalovací jmenovitý přehled: kdo všechno může zadávat do konstrukce
// (implicitně z modulu Obchod / Obchod EXP / Rozdělení obchodníků + výjimky z číselníku zde).
function obchodniciTable(){
  var imp=D.obchodniciImplicit||[];
  var vyj=((D.roles||{}).obchodnik)||[];
  var mapa={};
  imp.forEach(function(o){mapa[o.email]={name:o.name,email:o.email,zdroje:(o.zdroje||[]).slice()}});
  vyj.forEach(function(p){var r=mapa[p.email]||(mapa[p.email]={name:p.name,email:p.email,zdroje:[]});r.zdroje.push('výjimka v číselníku');});
  var vsichni=Object.keys(mapa).map(function(k){return mapa[k]}).sort(function(a,b){return (a.name||'').localeCompare(b.name||'','cs')});
  var rows=vsichni.map(function(o){
    var badges=(o.zdroje||[]).map(function(z){var c=z==='výjimka v číselníku'?'background:#fff0d9;color:#9a6400':(z==='Rozdělení obchodníků'?'background:#e8f0fb;color:#2a5fa3':'background:#eaf3e6;color:#2f6a33');return '<span style="display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin:1px 3px 1px 0;'+c+'">'+esc(z)+'</span>'}).join('');
    return '<tr><td style="padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap"><b>'+esc(o.name||o.email)+'</b></td>'+
      '<td style="padding:5px 8px;border-bottom:1px solid var(--line)" class="muted">'+esc(o.email)+'</td>'+
      '<td style="padding:5px 8px;border-bottom:1px solid var(--line)">'+badges+'</td></tr>';
  }).join('');
  return '<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:700;font-size:13px">Kdo má zadávání do konstrukce ('+vsichni.length+' osob) — jmenovitě</summary>'+
    (vsichni.length
      ?('<div style="overflow-x:auto;margin-top:8px"><table style="border-collapse:collapse;width:100%;font-size:12.5px"><thead><tr>'+
        '<th style="text-align:left;padding:5px 8px;border-bottom:2px solid var(--line)">Jméno</th>'+
        '<th style="text-align:left;padding:5px 8px;border-bottom:2px solid var(--line)">E-mail</th>'+
        '<th style="text-align:left;padding:5px 8px;border-bottom:2px solid var(--line)">Odkud má přístup</th></tr></thead><tbody>'+rows+'</tbody></table></div>')
      :'<p class="muted" style="margin:8px 0 0">Zatím nikdo — nikdo nemá modul Obchod ani není v Rozdělení obchodníků.</p>')+
    '</details>';
}
function groupChecks(p){
  var fams=D.families||[]; var g=p.groups||[];
  var boxes=fams.map(function(f){
    var ck=g.indexOf(f.key)>=0?' checked':'';
    return '<label style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#3a4a41"><input type="checkbox" style="width:auto" data-fam="'+esc(f.key)+'"'+ck+' onchange="saveKonstrGroups(\''+esc(p.email)+'\')"> '+esc(f.label)+'</label>';
  }).join('');
  return '<div class="kgrp" data-kemail="'+esc(p.email)+'" style="margin-top:7px"><div class="sub" style="margin-bottom:4px">Skupiny výrobků, které zpracovává <span class="muted">(nic zaškrtnuté = všechny)</span>:</div><div class="row" style="gap:8px 16px;flex-wrap:wrap">'+boxes+'</div></div>';
}
function saveKonstrGroups(email){
  var wrap=document.querySelector('.kgrp[data-kemail="'+email+'"]'); if(!wrap)return;
  var groups=[].slice.call(wrap.querySelectorAll('input[type=checkbox]:checked')).map(function(c){return c.getAttribute('data-fam')});
  api('/admin/konstrukter-groups','POST',{email:email,groups:groups}).then(function(o){if(!o.ok){alert((o.j&&o.j.chyba)||'Chyba');return} toastUlozeno('✓ Skupiny uloženy');reloadData();});
}
function addRolePerson(role,email){if(!email)return;setRole(email,role)}
function setReditel(key,selId){var email=(document.getElementById(selId)||{}).value||'';api('/admin/stredisko','POST',{key:key,reditel:email}).then(function(o){if(!o.ok){alert(o.j.chyba);return}toastUlozeno();reloadData()})}
function editTyp(key){
  var t=(D.types||[]).find(function(x){return x.key===key})||{key:'',name:'',normohodiny:8,revizeNh:2,lhutaZkresleniDays:3,lhutaRevizeDays:2,lhutaPrideleniDays:1,lhutaKontrolaDays:1,lhutaObchodnikDays:1,lhutaKlientDays:5,linkValidDays:30,internalCheck:true,params:[]};
  var m=document.getElementById('modal');
  function num(id,l,v){return '<div><label>'+l+'</label><input id="'+id+'" type="number" value="'+(v==null?'':v)+'"></div>'}
  m.innerHTML='<div class="sheet"><h3>'+(key?'Upravit typ výrobku':'Nový typ výrobku')+'</h3>'+
    '<div class="two"><div><label>Klíč (bez mezer)</label><input id="tKey" value="'+esc(t.key)+'"'+(key?' readonly':'')+'></div><div><label>Název</label><input id="tName" value="'+esc(t.name)+'"></div></div>'+
    '<div class="two">'+num('tNh','Normohodiny zkreslení',t.normohodiny)+num('tRnh','Normohodiny revize',t.revizeNh)+'</div>'+
    '<div class="two">'+num('tZd','Lhůta zkreslení (dny)',t.lhutaZkresleniDays)+num('tRd','Lhůta revize (dny)',t.lhutaRevizeDays)+'</div>'+
    '<div class="two">'+num('tPd','Lhůta přidělení',t.lhutaPrideleniDays)+num('tKd','Lhůta kontroly',t.lhutaKontrolaDays)+'</div>'+
    '<div class="two">'+num('tOd','Lhůta obchodník',t.lhutaObchodnikDays)+num('tCd','Lhůta reakce klienta',t.lhutaKlientDays)+'</div>'+
    '<div class="two">'+num('tLv','Platnost odkazu (dny)',t.linkValidDays)+'<div><label>Interní kontrola</label><select id="tIc"><option value="1"'+(t.internalCheck?' selected':'')+'>ano (povinná)</option><option value="0"'+(!t.internalCheck?' selected':'')+'>ne</option></select></div></div>'+
    '<label>Parametry (jeden na řádek, formát: Název | příklad hodnot)</label><textarea id="tParams" rows="6">'+esc((t.params||[]).map(function(p){return p.label+' | '+(p.examples||'')}).join('\n'))+'</textarea>'+
    '<div class="err" id="tErr"></div>'+
    '<div class="actions" style="margin-top:14px"><button class="btn" onclick="saveTyp()">Uložit</button>'+(key&&t.key!=='abroll'?'<button class="btn warn" onclick="delTyp(\''+esc(key)+'\')">Smazat</button>':'')+'<button class="btn ghost" onclick="closeModal()">Zrušit</button></div></div>';
  m.classList.add('open');
}
function saveTyp(){
  function v(id){return (document.getElementById(id)||{}).value}
  var params=v('tParams').split('\n').map(function(l){var p=l.split('|');return {label:(p[0]||'').trim(),examples:(p[1]||'').trim()}}).filter(function(p){return p.label});
  var b={key:v('tKey'),name:v('tName'),normohodiny:v('tNh'),revizeNh:v('tRnh'),lhutaZkresleniDays:v('tZd'),lhutaRevizeDays:v('tRd'),lhutaPrideleniDays:v('tPd'),lhutaKontrolaDays:v('tKd'),lhutaObchodnikDays:v('tOd'),lhutaKlientDays:v('tCd'),linkValidDays:v('tLv'),internalCheck:v('tIc')==='1',params:params};
  if(!b.key||!b.name){document.getElementById('tErr').textContent='Vyplňte klíč i název.';return}
  api('/admin/typ','POST',b).then(function(o){if(!o.ok){document.getElementById('tErr').textContent=o.j.chyba;return}closeModal();reloadData()});
}
function delTyp(key){if(!confirm('Smazat typ výrobku?'))return;api('/admin/typ','POST',{key:key,delete:true}).then(function(){closeModal();reloadData()})}

document.addEventListener('click',function(e){var pop=document.getElementById('notifpop');if(pop.classList.contains('open')&&!pop.contains(e.target)&&!(e.target.closest('.iconbtn')))pop.classList.remove('open')});
reloadData();
</script>
</body>
