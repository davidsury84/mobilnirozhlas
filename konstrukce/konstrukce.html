<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konstrukce — workflow výkresů</title>
<style>
:root{
  --g:#0e8a43;--g2:#0a6b34;--g3:#12a350;--ink:#0f1512;--mut:#5b635c;--line:#e3e7e0;
  --bg:#eef1ec;--card:#fff;--red:#c23636;--amber:#b06f00;--blue:#1565c0;--purple:#6a1b9a;--gray:#78909c;
  --green-soft:#e6f6ec;
}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
.bar{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.bar h1{font-size:17px;margin:0;font-weight:800;color:var(--g2)}
.bar .rolech{font-size:12px;font-weight:700;color:var(--g2);background:var(--green-soft);border:1px solid #bfe6cd;border-radius:20px;padding:3px 11px}
.bar .sp{flex:1}
.iconbtn{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:600;color:#33513f}
.iconbtn:hover{background:#f0f3ee}
.badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.wrap{display:flex;gap:0;align-items:flex-start}
.side{width:220px;min-width:220px;padding:16px 12px;position:sticky;top:57px;max-height:calc(100vh - 57px);overflow:auto}
.chip{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:9px 11px;cursor:pointer;font-weight:600;color:#3a4a41;margin-bottom:2px}
.chip:hover{background:#e9efe6}
.chip.act{background:var(--g);color:#fff}
.chip .n{font-size:12px;opacity:.85}
.chip.act .n{opacity:1}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 8px 6px;font-weight:700}
.main{flex:1;padding:18px 22px;min-width:0}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--g);color:#fff}
.btn:hover{background:var(--g2)}
.btn.ghost{background:#eef1ec;color:#33513f}.btn.ghost:hover{background:#e2e8dd}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.warn{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.blue{background:var(--blue)}.btn.blue:hover{filter:brightness(.92)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head h2{margin:0;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:12px}
.zk{cursor:pointer;transition:box-shadow .12s}
.zk:hover{box-shadow:0 3px 12px rgba(0,0,0,.07)}
.zk .t{font-weight:700;font-size:15px}
.zk .sub{color:var(--mut);font-size:13px;margin-top:2px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.green{background:var(--g3)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}.dot.none{background:#cfd8d2}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.novy{background:#eceff1;color:#455a64}
.pill.prace{background:#fff3e0;color:#e65100}
.pill.kontrola{background:#f3e5f5;color:#6a1b9a}
.pill.obchodnik{background:#e3f2fd;color:#1565c0}
.pill.klient{background:var(--green-soft);color:#0a6b34}
.pill.revize{background:#fff3e0;color:#e65100}
.pill.podklady{background:#eceff1;color:#607d8b}
.pill.schvaleno{background:var(--green-soft);color:#0a6b34}
.pill.vyroba{background:#e0f7fa;color:#00838f}
.pill.stredisko{background:#e0f7fa;color:#00838f}
.pill.dokonceno{background:#e0f2f1;color:#00695c}
.pill.zamitnuto{background:#fdecea;color:#c62828}
.muted{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
/* detail */
.ov{position:fixed;inset:0;background:rgba(20,28,24,.42);z-index:40;display:none}
.ov.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(680px,96vw);background:var(--bg);z-index:41;box-shadow:-4px 0 22px rgba(0,0,0,.16);transform:translateX(100%);transition:transform .18s;overflow:auto}
.drawer.open{transform:none}
.dhead{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;gap:12px}
.dbody{padding:18px 20px}
.x{margin-left:auto;border:0;background:#eef1ec;border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:18px;color:#33513f;flex:0 0 auto}
.kv{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;font-size:13.5px}
.kv b{color:var(--mut);font-weight:600}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;margin:18px 0 8px}
.tl{border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
.tl .it{position:relative;padding:0 0 12px}
.tl .it:before{content:'';position:absolute;left:-20px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--g3)}
.tl .it .m{font-size:12px;color:var(--mut)}
.cmt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.cmt.client{border-left:3px solid var(--g3)}
input,textarea,select{width:100%;font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 0}
.field{margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(20,28,24,.45);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:14px;width:min(720px,100%);padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sheet h3{margin:0 0 4px}
.err{color:var(--red);font-size:13px;margin-top:8px}
/* dotazník */
.dq{display:grid;grid-template-columns:220px 1fr;gap:8px 14px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.dq-l{font-weight:600;font-size:13.5px;padding-top:6px}
.dq-o{display:flex;flex-direction:column;gap:5px}
.dq-c{display:flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer}
.dq-c input[type=radio]{width:auto;margin:0}
.dq-tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;flex:0 0 auto}
.dq-tag.s{background:var(--green-soft);color:#0a6b34}.dq-tag.o{background:#fff3e0;color:#e65100}.dq-tag.p{background:#e3f2fd;color:#1565c0}
.dq-req{flex:1;min-width:120px;padding:5px 8px}
.dqview{display:grid;grid-template-columns:200px 1fr;gap:4px 12px;font-size:13px}
.dqview b{color:var(--mut);font-weight:600}
.dqview .bd{font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;margin-left:6px}
.dqview .s{background:var(--green-soft);color:#0a6b34}.dqview .o{background:#fff3e0;color:#e65100}.dqview .p{background:#e3f2fd;color:#1565c0}
.dqsec{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--g2);margin:16px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.dqsec:first-of-type{border-top:0;padding-top:0}
.dq:hover{background:#f7faf7}
.dq-c:hover .dq-tag{filter:brightness(.96)}
.dq-c.sel{background:#eef6f0;border-radius:8px;margin:-2px -6px;padding:2px 6px}
.langbar{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.langb{border:0;background:#fff;padding:6px 12px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;color:#33513f;border-right:1px solid var(--line)}
.langb:last-child{border-right:0}
.langb.act{background:var(--g);color:#fff}
.langb:not(.act):hover{background:#eef1ec}
.reqmark{color:var(--red)}
.ssobar{display:flex;align-items:center;gap:8px;margin:10px 0 2px;padding:8px 12px;background:var(--green-soft);border:1px solid #bfe6cd;border-radius:10px;font-size:13.5px;color:#245c39}
.ssobar svg{color:var(--g2);flex:0 0 auto}
.adr-dd{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.14);max-height:270px;overflow:auto;margin-top:3px}
.adr-i{display:flex;gap:8px;align-items:center;padding:8px 11px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line)}
.adr-i:last-child{border-bottom:0}.adr-i:hover{background:#eef6f0}
.adr-b{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:#eef1ec;color:#33513f;flex:0 0 auto}
.adr-b.osm{background:#e3f2fd;color:#1565c0}
.adr-load{padding:9px 11px;font-size:12.5px;color:var(--mut)}
.artpick{margin:10px 0 2px;padding:10px 12px;background:#f3faf5;border:1px solid #bfe6cd;border-radius:10px}
.artpick>label{margin:0 0 4px;font-size:12.5px;font-weight:700;color:var(--g2)}
.art-dd{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.14);max-height:280px;overflow:auto;margin-top:3px}
.art-i{padding:8px 11px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
/* Vlastní výběr typu výrobku s plným podbarvením rodin */
.tsel{position:relative}
.tsel-trigger{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;text-align:left}
.tsel-trigger:hover{border-color:#c3ccc4}
.tsel-cur{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.tsel-cur b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsel-arrow{color:var(--mut);font-size:11px;flex:0 0 auto}
.tsel-dot{width:12px;height:12px;border-radius:3px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.tsel-panel{position:absolute;left:0;right:0;top:100%;z-index:35;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:340px;overflow:auto;padding:5px}
.tsel-glabel{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:9px 8px 4px;color:var(--mut)}
.tsel-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;margin:2px 0;line-height:1.25}
.tsel-row .tsel-nm{flex:1;min-width:0}
.tsel-row:hover{filter:brightness(.95)}
.tsel-row.sel{box-shadow:inset 0 0 0 2px rgba(0,0,0,.22);font-weight:700}
.tsel-check{margin-left:auto;font-weight:800;display:none}
.tsel-row.sel .tsel-check{display:inline}
.art-i:last-child{border-bottom:0}.art-i:hover{background:#eef6f0}
.art-info{font-size:12.5px;color:#245c39;margin-top:6px;min-height:16px}
.art-tag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--g);color:#fff}
.art-prov{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:#e3f2fd;color:#1565c0}
/* moderní kompaktní dialog */
.dqmodal{display:flex;flex-direction:column;max-height:92vh;padding:0;width:min(780px,100%);overflow:hidden}
.dqhead{padding:15px 22px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dqbody{overflow:auto;padding:12px 22px 18px;flex:1 1 auto}
.dqfoot{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:flex-end;flex:0 0 auto;background:#fff}
.dqfoot .cnt{margin-right:auto;font-size:12.5px;color:var(--mut)}
.dqhg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.dqhg label{margin:0 0 2px;font-size:12px;color:var(--mut)}
.dqhg input,.dqhg select{padding:8px 10px;font-size:13.5px}
.dqsec2{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--g2);margin:16px 0 4px}
.dq2{display:grid;grid-template-columns:190px 1fr;gap:5px 14px;align-items:center;padding:5px 0;border-bottom:1px solid #eef1ec}
.dq2:hover{background:#f8faf8}
.dq2-l{font-weight:600;font-size:13px}
.dq2-seg{display:flex;flex-wrap:wrap;gap:6px}
.seg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font:inherit;font-size:12.5px;font-weight:600;color:#3a4a41;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.seg:hover{background:#f0f3ee}
.seg.sel{background:var(--g);border-color:var(--g);color:#fff}
.seg .st{font-size:9px;font-weight:800;letter-spacing:.03em;opacity:.7;text-transform:uppercase}
.seg.sel .st{opacity:.85}
.dq2 input.txt,.dq2-req{grid-column:2;width:100%;padding:7px 10px;font-size:13.5px}
.ral-tb{display:flex;flex-wrap:wrap;gap:5px}
.ral-sw{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;padding:3px 8px 3px 4px;font-size:11px;font-weight:700;cursor:pointer;background:#fff;color:#3a4a41}
.ral-sw i{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.18);flex:0 0 auto;display:inline-block}
.ral-sw:hover{background:#f0f3ee}
.ral-sw.sel{border-color:var(--g);box-shadow:0 0 0 2px rgba(14,138,67,.25)}
.ral-row{display:flex;align-items:center;gap:10px}
.ral-pick{width:38px;height:34px;padding:0;border:1px solid var(--line-strong,#cdd3ca);border-radius:8px;cursor:pointer;background:none;flex:0 0 auto}
.ral-pick::-webkit-color-swatch-wrapper{padding:3px}
.ral-pick::-webkit-color-swatch{border:none;border-radius:5px}
.ral-pick::-moz-color-swatch{border:none;border-radius:5px}
.ral-cur{font-size:13px}
.dq2-req{margin-top:4px}
.dq2-optwrap{grid-column:2;display:flex;align-items:center;gap:7px;margin-top:4px}
.dq2-opt{width:120px;padding:7px 10px;font-size:13.5px;border:1px solid var(--line);border-radius:8px}
select.dq2-opt{width:100%;max-width:560px}
.nat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;grid-column:2;margin-top:2px}
.nat-tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 6px;text-align:center}
.nat-tile img{width:100%;height:84px;object-fit:contain;background:#fff;border-radius:6px}
.nat-tile .nk{font-size:11.5px;font-weight:800;letter-spacing:.2px}
.nat-tile .np{font-size:10px;color:var(--mut);line-height:1.15;font-weight:500}
.seg.nat-tile.sel .np{color:#eaf3e6}
.dqkod{margin-right:auto;font-size:12.5px;background:#f2f7ee;border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:56%;overflow-wrap:anywhere;line-height:1.35}
.dqkod .k{font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.dq2-unit{font-size:12.5px;color:var(--mut);font-weight:600}
@media(max-width:640px){.dqhg{grid-template-columns:1fr}.dq2{grid-template-columns:1fr;gap:3px}.dq2 input.txt,.dq2-req,.dq2-optwrap{grid-column:1}}
.dq-hint{font-size:11.5px;color:var(--mut);margin-top:2px}
@media(max-width:600px){.dq{grid-template-columns:1fr}.dqview{grid-template-columns:1fr}}
.ok{color:var(--g);font-size:13px;margin-top:8px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi .c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:26px;font-weight:800;color:var(--g2)}
.kpi .l{font-size:12px;color:var(--mut);margin-top:2px}
.cap{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.capbar{flex:1;height:9px;background:#eceff1;border-radius:6px;overflow:hidden}
.capbar i{display:block;height:100%;border-radius:6px}
.notifpop{position:absolute;right:16px;top:54px;width:min(380px,92vw);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.16);z-index:30;max-height:70vh;overflow:auto;display:none}
.notifpop.open{display:block}
.notifpop .n{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.notifpop .n.unread{background:#f1f8f2}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#eef1ec;color:#33513f}
/* workflow stepper + schéma */
.flow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:2px 0 10px}
.flow .st{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12.5px;font-weight:600;background:#fff;color:var(--mut)}
.flow .st .rd{width:9px;height:9px;border-radius:50%;background:#cfd8d2}
.flow .st.done{color:#3a4a41}
.flow .st.done .rd{background:var(--g3)}
.flow .st.cur{color:#fff;border-color:transparent}
.flow .st.cur .rd{background:rgba(255,255,255,.9)}
.flow .arw{color:#c3ccc4;font-size:13px}
.flow .dd{font-weight:700;font-size:11px;margin-left:3px;opacity:.6}
.r-sef{background:var(--purple)!important}.r-kon{background:#e65100!important}.r-obch{background:var(--blue)!important}.r-kli{background:var(--g)!important}.r-sys{background:var(--gray)!important}.r-vyr{background:#00838f!important}
.pdfwrap{background:#525659;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.pdfwrap iframe{width:100%;height:58vh;border:0;display:block}
.pdfbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 14px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.wf{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.wf .node{border-radius:12px;padding:12px 14px;color:#fff;min-width:150px;flex:0 0 auto}
.wf .node .t{font-weight:800;font-size:14px}
.wf .node .m{font-size:12px;opacity:.92;margin-top:3px}
.wf .node .m .wfd{width:44px;padding:2px 4px;border:0;border-radius:5px;font:inherit;font-weight:700;text-align:center;background:rgba(255,255,255,.92);color:#22302a}
.wf-explain{background:#eef6f0;border:1px solid #bfe6cd;border-radius:10px;padding:9px 12px;font-size:12.5px;color:#2f5c40;margin:2px 0 12px;line-height:1.45}
.wf .arw{display:flex;align-items:center;color:#b6bfb7;font-size:20px;font-weight:700}
.wf .branch{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:#3a4a41;min-width:150px;font-size:12.5px}
/* Ganttův timeline SET-UP (cílové doby fází) */
.gantt{margin:4px 0 2px}
.gantt-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.gantt-lab{width:108px;min-width:108px;font-size:12px;font-weight:700;color:var(--mut);text-align:right;line-height:1.15}
.gantt-track{position:relative;flex:1;height:30px;min-width:0}
.gantt-axis .gantt-track{height:16px}
.gantt-plot{position:absolute;inset:0;background:#f4f6f2;border-radius:8px;overflow:hidden}
.gantt-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line);z-index:1}
.gantt-tick{position:absolute;top:1px;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}
.gantt-seg{position:absolute;top:3px;bottom:3px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;border-radius:6px;z-index:2;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12)}

'Reakční doba klienta a přesné doby fází se počítají z auditního logu každé zakázky (kap. 8). Rozšířené grafy lze doplnit v další fázi.':['Client response time and exact phase durations are calculated from the audit log of each order (ch. 8). Extended charts can be added later.','Kundenreaktionszeit und exakte Phasendauern werden aus dem Audit-Log jedes Auftrags berechnet (Kap. 8). Erweiterte Diagramme können später ergänzt werden.','Czas reakcji klienta i dokładne czasy faz liczone są z dziennika audytu każdego zlecenia (rozdz. 8). Rozszerzone wykresy można dodać później.','Час реакції клієнта та точні тривалості фаз обчислюються з журналу аудиту кожного замовлення (розд. 8). Розширені графіки можна додати пізніше.','Timpul de reacție al clientului și duratele exacte ale fazelor se calculează din jurnalul de audit al fiecărei comenzi (cap. 8). Graficele extinse pot fi adăugate ulterior.'],

'Cílové doby fází na časové ose (Ganttův graf).':['Target phase durations on a timeline (Gantt chart).','Zielzeiten der Phasen auf der Zeitachse (Gantt-Diagramm).','Docelowe czasy faz na osi czasu (wykres Gantta).','Цільові тривалості фаз на часовій шкалі (діаграма Ганта).','Durate țintă ale fazelor pe axa timpului (diagramă Gantt).'],

'odvozuje z lhůt jednotlivých kroků':['is derived from the deadlines of the individual steps','wird aus den Fristen der einzelnen Schritte abgeleitet','jest wyprowadzany z terminów poszczególnych kroków','виводиться з термінів окремих кроків','este derivat din termenele pașilor individuali'],
'= průměr z historie zakázek. Fáze a kroky jsou tak jeden provázaný celek.':['= average from order history. Phases and steps thus form one connected whole.','= Durchschnitt aus der Auftragshistorie. Phasen und Schritte bilden so ein zusammenhängendes Ganzes.','= średnia z historii zleceń. Fazy i kroki tworzą jedną powiązaną całość.','= середнє з історії замовлень. Фази й кроки утворюють одне ціле.','= media din istoricul comenzilor. Fazele și pașii formează astfel un tot unitar.'],
'Upravit lhůty kroků → Postup (schéma)':['Edit step deadlines → Process (diagram)','Schrittfristen bearbeiten → Ablauf (Schema)','Edytuj terminy kroków → Proces (schemat)','Змінити терміни кроків → Процес (схема)','Editează termenele pașilor → Proces (schemă)'],
'Cílové dny fází zde nejsou samostatně editovatelné — mění se úpravou lhůt kroků.':['Target phase days cannot be edited separately here — they change by editing the step deadlines.','Zieltage der Phasen sind hier nicht separat editierbar — sie ändern sich über die Schrittfristen.','Docelowe dni faz nie są tu edytowalne osobno — zmieniają się przez edycję terminów kroków.','Цільові дні фаз тут окремо не редагуються — змінюються через терміни кроків.','Zilele țintă ale fazelor nu se editează separat aici — se schimbă prin termenele pașilor.'],

'Prahy pro automatická upozornění a e-maily u běžících zakázek.':['Thresholds for automatic alerts and e-mails on running orders.','Schwellenwerte für automatische Hinweise und E-Mails bei laufenden Aufträgen.','Progi automatycznych ostrzeżeń i e-maili dla trwających zleceń.','Пороги для автоматичних попереджень та листів по активних замовленнях.','Praguri pentru alerte automate și e-mailuri la comenzile în curs.'],

'Chybí-li podklady od zákazníka, zakázka se pozastaví a lhůty se zastaví (zpoždění se nepočítá konstrukci).':['If customer documents are missing, the order is put on hold and deadlines stop (the delay is not charged to engineering).','Fehlen Unterlagen des Kunden, wird der Auftrag pausiert und die Fristen stoppen (die Verzögerung geht nicht zulasten der Konstruktion).','Gdy brakuje materiałów od klienta, zlecenie zostaje wstrzymane, a terminy zatrzymane (opóźnienie nie obciąża konstrukcji).','Якщо бракує матеріалів від замовника, замовлення призупиняється і терміни зупиняються (затримка не зараховується конструкції).','Dacă lipsesc documentele de la client, comanda se suspendă și termenele se opresc (întârzierea nu se impută proiectării).'],
'Obchodník nebo ředitel s povinným důvodem; propíše se do statistik.':['Sales rep or director with a mandatory reason; it is reflected in the statistics.','Vertrieb oder Direktor mit Pflichtbegründung; wird in die Statistik übernommen.','Handlowiec lub dyrektor z obowiązkowym powodem; przechodzi do statystyk.','Менеджер або директор з обовʼязковою причиною; відображається у статистиці.','Reprezentant sau director cu motiv obligatoriu; se reflectă în statistici.'],

'Přístup jen pro čtení k reportům a KPI; příjemce eskalací.':['Read-only access to reports and KPIs; recipient of escalations.','Nur-Lese-Zugriff auf Berichte und KPI; Empfänger von Eskalationen.','Dostęp tylko do odczytu raportów i KPI; odbiorca eskalacji.','Доступ лише для читання звітів і KPI; отримувач ескалацій.','Acces doar la citire pentru rapoarte și KPI; destinatar al escaladărilor.'],
'První krok toku — rozděluje nové zakázky do výrobních závodů (Bruntál / Chomutov / Supíkovice). Vidí vše.':['First step of the flow — assigns new orders to production plants (Bruntál / Chomutov / Supíkovice). Sees everything.','Erster Schritt im Ablauf — ordnet neue Aufträge den Werken zu (Bruntál / Chomutov / Supíkovice). Sieht alles.','Pierwszy krok przepływu — przypisuje nowe zlecenia do zakładów (Bruntál / Chomutov / Supíkovice). Widzi wszystko.','Перший крок потоку — розподіляє нові замовлення на заводи (Брунталь / Хомутов / Супіковіце). Бачить усе.','Primul pas al fluxului — repartizează comenzile noi la fabrici (Bruntál / Chomutov / Supíkovice). Vede tot.'],
'Po rozdělení do závodu přiděluje konstruktéra, provádí interní kontrolu. Vidí vše v konstrukci.':['After the plant assignment they assign a designer and perform the internal check. Sees everything in engineering.','Nach der Werkszuordnung weist er den Konstrukteur zu und führt die interne Prüfung durch. Sieht alles in der Konstruktion.','Po przypisaniu do zakładu przydziela konstruktora i wykonuje kontrolę wewnętrzną. Widzi wszystko w konstrukcji.','Після розподілу на завод призначає конструктора і виконує внутрішню перевірку. Бачить усе в конструкції.','După repartizarea la fabrică atribuie proiectantul și face verificarea internă. Vede tot în proiectare.'],
'Každá výrobní oblast má svého ředitele (konkrétní osoba z databáze). Schválená zakázka se předává do vybrané oblasti a je na tahu její výrobní ředitel.':['Each production area has its own director (a specific person from the database). An approved order is handed over to the selected area and its production director takes the turn.','Jeder Produktionsbereich hat seinen Direktor (eine konkrete Person aus der Datenbank). Ein freigegebener Auftrag geht an den gewählten Bereich, dessen Produktionsleiter dann am Zug ist.','Każdy obszar produkcji ma swojego dyrektora (konkretna osoba z bazy). Zatwierdzone zlecenie trafia do wybranego obszaru i kolej jest na jego dyrektora produkcji.','Кожен виробничий напрям має свого директора (конкретна особа з бази). Затверджене замовлення передається у вибраний напрям, і черга за його директором.','Fiecare zonă de producție are directorul său (o persoană concretă din bază). Comanda aprobată se predă zonei alese, iar rândul îi revine directorului de producție.'],
'— odstraní jen zakázky a jejich notifikace/soubory (ať přes ně nechodí žádné e-maily).':['— removes only the orders and their notifications/files (so no e-mails go through them).','— entfernt nur die Aufträge und deren Benachrichtigungen/Dateien (damit keine E-Mails darüber laufen).','— usuwa tylko zlecenia oraz ich powiadomienia/pliki (aby nie szły przez nie e-maile).','— видаляє лише замовлення та їхні сповіщення/файли (щоб через них не йшли листи).','— șterge doar comenzile și notificările/fișierele lor (ca să nu treacă e-mailuri prin ele).'],
'Role, číselník, střediska, nastavení, evidenci práce i pravidla toku ponechá.':['Roles, code lists, centres, settings, work records and flow rules are kept.','Rollen, Stammdaten, Standorte, Einstellungen, Zeiterfassung und Ablaufregeln bleiben erhalten.','Role, słowniki, wydziały, ustawienia, ewidencję pracy i reguły przepływu zachowuje.','Ролі, довідники, центри, налаштування, облік роботи та правила потоку залишає.','Păstrează rolurile, nomenclatoarele, centrele, setările, evidența muncii și regulile de flux.'],
'Toto použij pro úklid testovacích dat.':['Use this to clean up test data.','Nutzen Sie dies zum Aufräumen von Testdaten.','Użyj tego do usunięcia danych testowych.','Використовуйте для прибирання тестових даних.','Folosiți aceasta pentru curățarea datelor de test.'],
'— smaže':['— deletes','— löscht','— usuwa','— видаляє','— șterge'],
'všechno':['everything','alles','wszystko','усе','tot'],
'(zakázky, role, číselník, střediska, nastavení, evidenci práce). Jen při čistém startu, nevratné.':['(orders, roles, code lists, centres, settings, work records). Only for a clean start, irreversible.','(Aufträge, Rollen, Stammdaten, Standorte, Einstellungen, Zeiterfassung). Nur bei Neustart, unwiderruflich.','(zlecenia, role, słowniki, wydziały, ustawienia, ewidencja pracy). Tylko przy czystym starcie, nieodwracalne.','(замовлення, ролі, довідники, центри, налаштування, облік роботи). Лише для чистого старту, незворотно.','(comenzi, roluri, nomenclatoare, centre, setări, evidența muncii). Doar la un start curat, ireversibil.'],

'Klient (veřejný náhled)':['Client (public preview)','Kunde (öffentliche Vorschau)','Klient (podgląd publiczny)','Клієнт (публічний перегляд)','Client (previzualizare publică)'],
'Konec (terminál)':['End (terminal)','Ende (Terminal)','Koniec (terminalny)','Кінець (термінальний)','Sfârșit (terminal)'],
'Vstupní bod — sem zakázka vzniká (zadání). Měl by být právě jeden.':['Entry point — the order is created here (specification). There should be exactly one.','Einstiegspunkt — hier entsteht der Auftrag (Vorgabe). Es sollte genau einen geben.','Punkt wejścia — tu powstaje zlecenie (zadanie). Powinien być dokładnie jeden.','Точка входу — тут виникає замовлення (завдання). Має бути рівно одна.','Punct de intrare — aici se creează comanda (specificația). Ar trebui să fie exact unul.'],
'Běžný pracovní krok workflow.':['A regular workflow step.','Ein regulärer Workflow-Schritt.','Zwykły krok workflow.','Звичайний робочий крок процесу.','Un pas obișnuit al fluxului.'],
'Krok u klienta — veřejný náhled výkresu a jeho rozhodnutí (schválí / připomínky / zamítne).':['Step at the client — public drawing preview and their decision (approve / comments / reject).','Schritt beim Kunden — öffentliche Zeichnungsvorschau und dessen Entscheidung (Freigabe / Anmerkungen / Ablehnung).','Krok u klienta — publiczny podgląd rysunku i jego decyzja (zatwierdza / uwagi / odrzuca).','Крок у клієнта — публічний перегляд креслення та його рішення (затвердить / зауваження / відхилить).','Pas la client — previzualizare publică a desenului și decizia sa (aprobă / observații / respinge).'],
'Pozastavení — lhůty se zastaví (čeká se na podklady), semafor neběží.':['On hold — deadlines stop (waiting for documents), the traffic light is paused.','Pausierung — Fristen stoppen (Warten auf Unterlagen), die Ampel läuft nicht.','Wstrzymanie — terminy się zatrzymują (czeka na materiały), sygnalizacja nie działa.','Призупинення — терміни зупиняються (очікування матеріалів), світлофор не працює.','Suspendare — termenele se opresc (se așteaptă documentele), semaforul nu rulează.'],
'Konec — terminální stav, zakázka je uzavřená (hotovo/zamítnuto). Nevede z něj žádný přechod.':['End — terminal state, the order is closed (done/rejected). No transition leads out of it.','Ende — Terminalzustand, der Auftrag ist abgeschlossen (fertig/abgelehnt). Kein Übergang führt heraus.','Koniec — stan terminalny, zlecenie zamknięte (gotowe/odrzucone). Nie prowadzi z niego żadne przejście.','Кінець — термінальний стан, замовлення закрите (готово/відхилено). З нього немає переходів.','Sfârșit — stare terminală, comanda este închisă (gata/respinsă). Nu duce nicio tranziție mai departe.'],
'Přidělení (od zadání)':['Assignment (from specification)','Zuweisung (ab Vorgabe)','Przydzielenie (od zadania)','Призначення (від завдання)','Atribuire (de la specificație)'],

'Schváleno klientem ✓ — vložte výrobní dokumentaci':['Approved by the client ✓ — upload the production documentation','Vom Kunden freigegeben ✓ — Fertigungsunterlagen hochladen','Zatwierdzone przez klienta ✓ — wgraj dokumentację produkcyjną','Затверджено клієнтом ✓ — завантажте виробничу документацію','Aprobat de client ✓ — încărcați documentația de producție'],
'(žádný konstruktér pro tuto skupinu — přiřaďte v Role a číselník)':['(no designer for this group — assign in Roles & code lists)','(kein Konstrukteur für diese Gruppe — in Rollen & Stammdaten zuweisen)','(brak konstruktora dla tej grupy — przypisz w Role i słowniki)','(немає конструктора для цієї групи — призначте в Ролі та довідники)','(niciun proiectant pentru acest grup — atribuiți în Roluri și nomenclatoare)'],
'Výkres už klient schválil v nabídce — po výběru závodu jde rovnou na výrobní dokumentaci.':['The client already approved the drawing in the quotation — after the plant is selected it goes straight to production documentation.','Der Kunde hat die Zeichnung bereits im Angebot freigegeben — nach der Werksauswahl geht es direkt zu den Fertigungsunterlagen.','Klient zatwierdził już rysunek w ofercie — po wyborze zakładu przechodzi wprost do dokumentacji produkcyjnej.','Клієнт уже затвердив креслення в пропозиції — після вибору заводу йде одразу на виробничу документацію.','Clientul a aprobat deja desenul în ofertă — după alegerea fabricii merge direct la documentația de producție.'],
'Poté šéf konstrukce přidělí konstruktéra a vypracuje se dokumentace ke schválení klientem.':['The head of engineering then assigns a designer and the documentation for client approval is prepared.','Anschließend weist der Konstruktionsleiter einen Konstrukteur zu und die Unterlagen zur Kundenfreigabe werden erstellt.','Następnie kierownik konstrukcji przydziela konstruktora i powstaje dokumentacja do zatwierdzenia przez klienta.','Далі керівник конструкції призначає конструктора і готується документація на затвердження клієнтом.','Apoi șeful de proiectare atribuie un proiectant și se elaborează documentația pentru aprobarea clientului.'],
'Potvrdit schválení výkresu klientem ručně? Zakázka přejde na výrobní dokumentaci.':['Confirm the client drawing approval manually? The order moves to production documentation.','Zeichnungsfreigabe des Kunden manuell bestätigen? Der Auftrag geht zu den Fertigungsunterlagen.','Potwierdzić zatwierdzenie rysunku przez klienta ręcznie? Zlecenie przejdzie do dokumentacji produkcyjnej.','Підтвердити затвердження креслення клієнтом вручну? Замовлення перейде на виробничу документацію.','Confirmați manual aprobarea desenului de către client? Comanda trece la documentația de producție.'],

var K_BUSY=false, K_OBS=null;
var K_ORIG=(typeof WeakMap!=='undefined')?new WeakMap():null;   /* textový uzel → česká předloha */
var K_ATTRS=['placeholder','title','aria-label'];
/* texty, které nesou i data (datum, počet) — přeloží se jen slovní část */
function kPattern(s){
  var m, h;
  if((m=s.match(/^\/ cíl (\d+) d$/))){ h={en:'target',de:'Ziel',pl:'cel',ua:'ціль',ro:'țintă'}[K_LANG]; return h?('/ '+h+' '+m[1]+' d'):null; }
  if((m=s.match(/^(.+?)\s+·$/))){ h=kT(m[1]); return h===m[1]?null:h+' ·'; }
  if((m=s.match(/^Provedení dle listu řady (.+)$/))){ var pr={en:'Design per the ',de:'Ausführung laut Blatt der Reihe ',pl:'Wykonanie wg arkusza serii ',ua:'Виконання за листом серії ',ro:'Execuție conform fișei seriei '}[K_LANG]; return pr?(K_LANG==='en'?('Design per the '+m[1]+' series sheet'):(pr+m[1])):null; }
  if((m=s.match(/^(termín|poptávka|závod|Vloženo:|Doporučeno:|Na tahu|Čeká na)\s+(.+)$/))){ h=kT(m[1]); return h===m[1]?null:h+' '+m[2]; }
  if((m=s.match(/^(.+?)\s+\((\d+)\)$/))){ h=kT(m[1]); return h===m[1]?null:h+' ('+m[2]+')'; }
  if((m=s.match(/^(\d+)\s+(dní|dnů|prac\. dní)$/))){ h=kT(m[2]); return h===m[2]?null:m[1]+' '+h; }
  return null;
}
function kTrText(tn){
  var raw=tn.nodeValue; if(raw==null) return;
  var orig = K_ORIG ? K_ORIG.get(tn) : null;
  var src = (orig!=null) ? orig : raw;          /* překládá se vždy z české předlohy */
  if(K_LANG==='cz'){ if(orig!=null && raw!==orig) tn.nodeValue=orig; return; }
  var s=src.trim(); if(!s||s.length>400||!/[A-Za-zÁ-Žá-ž]/.test(s)) return;
  var t=K_L10N[s], out=null;
  if(t) out=t[K_IDX[K_LANG]]||null; else out=kPattern(s);
  if(out && out!==s){
    if(K_ORIG && orig==null) K_ORIG.set(tn, raw);
    var nv=src.replace(s,out); if(nv!==raw) tn.nodeValue=nv;
  } else if(orig!=null && raw!==orig){ tn.nodeValue=orig; }
}
function kTrEl(el){
  if(!el||el.nodeType!==1||!el.hasAttribute) return;
  for(var i=0;i<K_ATTRS.length;i++){
    var a=K_ATTRS[i], da='data-korig-'+a;
    var orig = el.hasAttribute(da) ? el.getAttribute(da) : null;
    if(!el.hasAttribute(a) && orig==null) continue;
    var src = (orig!=null) ? orig : el.getAttribute(a);
    var s=(src||'').trim(); if(!s) continue;
    if(K_LANG==='cz'){ if(orig!=null){ el.setAttribute(a,orig); el.removeAttribute(da); } continue; }
    var t=K_L10N[s];
    if(t && t[K_IDX[K_LANG]]){ if(orig==null) el.setAttribute(da,src); el.setAttribute(a,t[K_IDX[K_LANG]]); }
    else if(orig!=null) el.setAttribute(a,orig);
  }
}
function kTr(node){
  if(!node) return;
  if(node.nodeType===3){ kTrText(node); return; }
  if(node.nodeType!==1) return;
  kTrEl(node);
  var els=node.querySelectorAll?node.querySelectorAll('*'):[];
  for(var i=0;i<els.length;i++) kTrEl(els[i]);
  if(!document.createTreeWalker) return;
  var w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT,null,false), n, list=[];
  while((n=w.nextNode())) list.push(n);
  for(var j=0;j<list.length;j++) kTrText(list[j]);
}
function kTrAll(){ kTr(document.body); }
function kObserve(){
  if(K_OBS||typeof MutationObserver==='undefined') return;
  K_OBS=new MutationObserver(function(muts){
    if(K_BUSY||K_LANG==='cz') return;
    K_BUSY=true;
    try{
      for(var i=0;i<muts.length;i++){
        var mu=muts[i];
        if(mu.type==='childList'){ for(var j=0;j<mu.addedNodes.length;j++) kTr(mu.addedNodes[j]); }
        else if(mu.type==='characterData') kTrText(mu.target);
      }
    }catch(e){}
    K_BUSY=false;
  });
  K_OBS.observe(document.body,{childList:true,subtree:true,characterData:true});
}

var KDE={prideleni:'u šéfa konstrukce',prace:'u konstrukce',kontrola:'u konstrukce',revize:'u konstrukce',podklady:'u obchodníka',obchodnik:'u obchodníka',klient:'u klienta',zavod:'u výkonného ředitele',schvaleno:'u konstrukce',vyroba:'ve výrobě',stredisko:'ve výrobě'};
function zkTimeline(z){
  var now=Date.now(), DAY=86400000, d=function(ms){return Math.max(0,Math.round(ms/DAY));};
  if(z.deadline && !isTerminal(z.stav) && now>z.deadline){
    var od=Math.round((now-z.deadline)/DAY), w=KDE[z.stav]||'', dw=(od===1?'den':(od>=2&&od<=4?'dny':'dní'));
    return '<div class="tl-late">⚠ Po termínu'+(w?' '+w:'')+' · <b>'+od+'</b> '+dw+'</div>';
  }
  var start=z.createdAt||now;
  var totalDays=d(now-start);
  var stepDays=z.stepStartedAt?d(now-z.stepStartedAt):null;
  var col=(z.semafor==='red')?'var(--red)':(z.semafor==='amber')?'var(--amber)':'var(--g3)';
  var bar, toTxt='';
  if(z.deadline && !isTerminal(z.stav)){
    var span=z.deadline-start, elapsed=now-start, over=now>z.deadline;
    var pct=span>0?Math.max(2,Math.min(100,elapsed/span*100)):(now>=z.deadline?100:2);
    var stepPct=(z.stepStartedAt&&span>0)?Math.max(0,Math.min(100,(z.stepStartedAt-start)/span*100)):null;
    var toDays=Math.round((z.deadline-now)/DAY);
    bar='<div class="tl-bar"><i class="tl-fill" style="width:'+pct.toFixed(1)+'%;background:'+(over?'var(--red)':col)+'"></i>'+
        (stepPct!=null?'<span class="tl-step" style="left:'+stepPct.toFixed(1)+'%"></span>':'')+'</div>'+
        '<div class="tl-ends"><span>poptávka '+fdate(start)+'</span><span>termín '+fdate(z.deadline)+'</span></div>';
    toTxt=over?('<span class="tl-n red"><b>'+Math.abs(toDays)+'</b><span class="lab">dní po termínu</span></span>')
              :('<span class="tl-n '+(z.semafor==='amber'?'amber':'green')+'"><b>'+toDays+'</b><span class="lab">dní do termínu</span></span>');
  } else {
    bar='<div class="tl-bar"><i class="tl-fill" style="width:100%;background:var(--line)"></i></div>';
    if(isTerminal(z.stav)) toTxt='<span class="tl-n"><b>&#8226;</b><span class="lab">'+esc(z.stavLabel)+'</span></span>';
  }
  return '<div class="tl">'+bar+'<div class="tl-nums">'+
    '<span class="tl-n"><b>'+totalDays+'</b><span class="lab">dní od poptávky</span></span>'+
    (stepDays!=null?'<span class="tl-n"><b>'+stepDays+'</b><span class="lab">dní &middot; '+esc(z.stavLabel)+'</span></span>':'')+
    toTxt+'</div></div>';
}

/* ---- Ganttův timeline cílových dob fází ---- */
var PHASES=[{k:'obchod',lab:'Obchod',col:'#2a78d6'},{k:'konstrukce',lab:'Konstrukce',col:'#008300'},{k:'schvaleni',lab:'Schválení',col:'#d55181'},{k:'vyroba',lab:'Zadání do výroby',col:'#c98500'}];
function ganttSetup(pd,pa){
  var tgt=PHASES.map(function(p){return Math.max(0,Number(pd[p.k])||0)});
  var act=PHASES.map(function(p){return (pa[p.k]==null?null:Math.max(0,Number(pa[p.k])||0))});
  var totT=tgt.reduce(function(a,b){return a+b},0);
  var totA=act.reduce(function(a,b){return a+(b||0)},0);
  var maxDay=Math.max(totT,totA,1);
  var step=Math.max(1,Math.ceil(maxDay/6));
  var ticks=[]; for(var v=0;v<=maxDay+0.001;v+=step)ticks.push(Math.round(v*10)/10); if(ticks[ticks.length-1]<maxDay)ticks.push(maxDay);
  var pct=function(x){return (x/maxDay*100)};
  // osa
  var axis='<div class="gantt-row gantt-axis"><div class="gantt-lab"></div><div class="gantt-track">';
  ticks.forEach(function(t){axis+='<div class="gantt-grid" style="left:'+pct(t)+'%"></div><div class="gantt-tick" style="left:'+pct(t)+'%">'+t+'</div>'});
  axis+='</div><div class="gantt-sum"></div></div>';
  // stavba jednoho pruhu (plán / skutečnost)
  var bar=function(vals,lab,total,cls){
    var segs=''; var cum=0;
    for(var i=0;i<PHASES.length;i++){
      var dv=vals[i]; if(dv==null||dv<=0){ if(dv==null&&cls==='act'){} continue; }
      var w=pct(dv), left=pct(cum), gap=(i<PHASES.length-1)?2:0;
      var show=(w>7);
      segs+='<div class="gantt-seg '+cls+'" title="'+esc(PHASES[i].lab)+' — '+dv+' prac. dní" style="left:'+left+'%;width:calc('+w+'% - '+gap+'px);background:'+PHASES[i].col+'">'+(show?dv:'')+'</div>';
      cum+=dv;
    }
    var grid=''; ticks.forEach(function(t){grid+='<div class="gantt-grid" style="left:'+pct(t)+'%"></div>'});
    return '<div class="gantt-row"><div class="gantt-lab">'+lab+'</div><div class="gantt-track"><div class="gantt-plot"></div>'+grid+segs+'</div>'+
      '<div class="gantt-sum">'+(total==null?'—':total)+' d<span class="lab">celkem</span></div></div>';
  };
  var g='<div class="gantt">'+axis+
    bar(tgt,'Plán (cíl)',totT,'plan')+
    bar(act,'Skutečnost&nbsp;(Ø)',(totA?Math.round(totA*10)/10:(pa.total!=null?pa.total:null)),'act')+
    '</div>';
  // legenda s cílovými dny — ODVOZENÉ z lhůt kroků (Postup / Role a číselník), jen pro čtení
  var STEPS={obchod:'Přidělení',konstrukce:'Zkreslení + Interní kontrola',schvaleni:'Potvrzení + U klienta',vyroba:'Předání + Ve středisku'};
  var leg='<div class="ph-legend">';
  PHASES.forEach(function(p){
    var a=pa[p.k];
    leg+='<div class="ph-item"><div class="nm"><span class="dotc" style="background:'+p.col+'"></span>'+esc(p.lab)+'</div>'+
      '<div class="ctl"><b style="font-size:16px">'+(pd[p.k]!=null?pd[p.k]:'—')+'</b> <span class="muted">prac. dní (cíl)</span></div>'+
      '<div class="sub">z kroků: '+esc(STEPS[p.k]||'')+'</div>'+
      '<div class="sub">Ø skutečně: '+(a==null?'—':a+' prac. dní')+'</div></div>';
  });
  leg+='</div>';
  return g+leg;
}

var PL={wf:null,sel:null,dirty:false,conn:null,drag:null,full:false,zoom:1,fam:'',inherited:false};
var PL_GRID=22;                     // krok mřížky (px) pro přichytávání
function plSnap(v){return Math.round(v/PL_GRID)*PL_GRID}
// pořadová čísla kroků: BFS od startu přes hrany vpřed/klient
function plStepNumbers(){
  var order={},n=1;var nodes=PL.wf.nodes||[];
  var start=nodes.find(function(x){return x.kind==='start'})||nodes[0];
  if(!start)return order;
  var visited={},queue=[start.id];visited[start.id]=true;
  while(queue.length){
    var id=queue.shift();order[id]=n++;
    (PL.wf.edges||[]).filter(function(e){return e.from===id&&['forward','klient'].indexOf(e.kind)>=0&&plNode(e.to)&&!visited[e.to]&&e.to!==id;})
      .forEach(function(e){visited[e.to]=true;queue.push(e.to);});
  }
  nodes.forEach(function(nd){if(!(nd.id in order))order[nd.id]=n++;});
  return order;
}
var PL_LHUTY=[['','bez termínu'],['lhutaPrideleniDays','Přidělení (od zadání)'],['lhutaZkresleniDays','Zkreslení (od zadání)'],['lhutaKontrolaDays','Kontrola (od zadání)'],['lhutaObchodnikDays','Obchodník (od zadání)'],['lhutaKlientDays','Klient (od zadání)'],['lhutaVyrobaDays','Výrobní dok. (od zadání)'],['lhutaRevizeDays','Revize (od zahájení)']];

function plNodeColor(n){
  if(n.terminal||n.kind==='end')return '#546e7a';

  var r=n.onTurn;
  if(n.kind==='klient'||r==='klient')return 'var(--g)';

// Automatický textový popis toku (co se bude dít) — generuje se z plátna.
function plDescribe(){
  var steps=plStepNumbers();
  var refT=(D.types&&D.types[0])||{};
  var ordered=(PL.wf.nodes||[]).slice().sort(function(a,b){return (steps[a.id]||99)-(steps[b.id]||99)});
  var rows=ordered.map(function(n){
    var meta=[];
    if(n.kind==='start')meta.push('vstup/zadání');
    if(n.hold)meta.push('pozastavení');
    if(n.terminal)meta.push('konec');
    meta.push('na tahu: '+plRoleLabel(n.onTurn));
    if(!n.terminal&&n.lhutaKey&&refT[n.lhutaKey]!=null)meta.push('do '+refT[n.lhutaKey]+' prac. dní'+(n.lhutaFrom==='step'?' od zahájení':' od zadání'));
    var outs=(PL.wf.edges||[]).filter(function(e){return e.from===n.id&&plNode(e.to)&&e.to!==n.id;});
    var outHtml=n.terminal?''
      :(outs.length?'<div class="d-out">'+outs.map(function(e){return '↳ '+esc(e.label||e.action)+' → <b>'+esc((plNode(e.to)||{}).label||e.to)+'</b>';}).join('')+'</div>'
        :(n.hold?'<div class="d-out">↳ po doplnění podkladů pokračuje zpět (viz „Kdykoli")</div>'
          :'<div class="d-out d-warn">⚠ odsud nevede žádný přechod dál</div>'));
    return '<li><span class="d-num">'+(steps[n.id]||'')+'</span> <b>'+esc(n.label||n.id)+'</b> <span class="d-meta">('+esc(meta.join(' · '))+')</span>'+outHtml+'</li>';
  }).join('');
  var glob=(PL.wf.edges||[]).filter(function(e){return e.from==='*'||String(e.to).charAt(0)==='@';}).map(function(e){return esc((e.label||e.action)+(e.from==='*'?' (odkudkoli)':''));});
  var globTxt=glob.length?'<div class="d-glob"><b>Kdykoli během toku:</b> '+glob.join(' · ')+'</div>':'';
  return '<ol class="d-list">'+rows+'</ol>'+globTxt;
}
function plRenderDesc(){var el=document.getElementById('plDesc');if(!el)return;el.innerHTML='<div class="d-head">📝 Co se bude dít (automaticky z plátna'+(PL.fam?' — skupina: '+esc((D.families||[]).reduce(function(a,f){return f.key===PL.fam?f.label:a},PL.fam)):'')+')</div>'+plDescribe();}

function plNodeAnchor(id,side){
  var el=document.getElementById('pln_'+id);if(!el)return null;
  var x=el.offsetLeft,y=el.offsetTop,w=el.offsetWidth,h=el.offsetHeight;
  if(side==='r')return {x:x+w,y:y+h/2};
  if(side==='l')return {x:x,y:y+h/2};
  if(side==='t')return {x:x+w/2,y:y};
  if(side==='b')return {x:x+w/2,y:y+h};
  return {x:x+w/2,y:y+h/2};
}
function plDrawEdges(){
  var svg=document.getElementById('plSvg');if(!svg)return;
  // vyčisti staré cesty i dekorace vybrané vazby (nech defs), ať se nenavršují
  Array.prototype.slice.call(svg.querySelectorAll('.pl-edge,.pl-edge-hit,.pl-elabel,.pl-edel,.pl-endh,.pl-ecap')).forEach(function(e){e.remove()});
  (PL.wf.edges||[]).forEach(function(e,i){
    if(!plDrawable(e))return;
    var a,b,path;
    if(e.to===e.from){ // self-smyčka nahoře
      var t=plNodeAnchor(e.from,'t');if(!t)return;
      path='M'+(t.x-16)+','+t.y+' C'+(t.x-30)+','+(t.y-46)+' '+(t.x+30)+','+(t.y-46)+' '+(t.x+16)+','+t.y;
      a={x:t.x-16,y:t.y}; b={x:t.x+16,y:t.y}; var lx=t.x,ly=t.y-40;
    }else{
      var s=plNode(e.from),d=plNode(e.to);
      var down=(d.y||0)>=(s.y||0)-30;
      a=plNodeAnchor(e.from, ((d.x||0)>=(s.x||0))?'r':'l');
      b=plNodeAnchor(e.to, ((d.x||0)>=(s.x||0))?'l':'r');
      if(!a||!b)return;
      var dx=Math.max(40,Math.abs(b.x-a.x)/2);
      path='M'+a.x+','+a.y+' C'+(a.x+dx)+','+a.y+' '+(b.x-dx)+','+b.y+' '+b.x+','+b.y;
      var lx=(a.x+b.x)/2,ly=(a.y+b.y)/2-6;
    }
    var col=plEdgeColor(e.kind);
    var selEdge=function(){PL.sel={t:'edge',i:i};plRefresh();};
    var delEdge=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();}PL.sel={t:'edge',i:i};plDelEdge();};
    var hit=document.createElementNS('http://www.w3.org/2000/svg','path');
    hit.setAttribute('class','pl-edge-hit');hit.setAttribute('d',path);hit.setAttribute('data-ei',i);
    hit.addEventListener('click',selEdge);
    hit.addEventListener('contextmenu',delEdge);   // pravé tlačítko = smazat vazbu
    svg.appendChild(hit);
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','pl-edge');p.setAttribute('d',path);p.setAttribute('stroke',col);
    p.setAttribute('marker-end','url(#plArrow)');
    if(e.kind==='reject'||e.kind==='revize')p.setAttribute('stroke-dasharray','6 4');
    var isSel=PL.sel&&PL.sel.t==='edge'&&PL.sel.i===i;
    if(isSel){p.setAttribute('stroke-width','3.6');}
    p.addEventListener('click',selEdge);p.addEventListener('contextmenu',delEdge);
    svg.appendChild(p);
    var lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('class','pl-elabel');lbl.setAttribute('x',lx);lbl.setAttribute('y',ly);lbl.setAttribute('text-anchor','middle');
    lbl.textContent=e.label||e.action;
    lbl.addEventListener('click',selEdge);lbl.addEventListener('contextmenu',delEdge);
    svg.appendChild(lbl);
    // u vybrané vazby: červené × (smazat) + koncové úchyty (přesunout přípoj) + nápověda
    if(isSel){
      var g=document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class','pl-edel');g.setAttribute('transform','translate('+lx+','+(ly-20)+')');
      g.addEventListener('click',delEdge);g.addEventListener('contextmenu',delEdge);
      var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('r','11');
      var xx=document.createElementNS('http://www.w3.org/2000/svg','text');
      xx.setAttribute('text-anchor','middle');xx.setAttribute('dy','5.5');xx.textContent='×';
      g.appendChild(c);g.appendChild(xx);svg.appendChild(g);
      // koncové úchyty — táhni na jiný uzel = přepojit (přesunout) začátek/konec
      if(e.to!==e.from){
        var hFrom=document.createElementNS('http://www.w3.org/2000/svg','circle');
        hFrom.setAttribute('class','pl-endh');hFrom.setAttribute('cx',a.x);hFrom.setAttribute('cy',a.y);hFrom.setAttribute('r','8');hFrom.setAttribute('stroke',col);
        hFrom.addEventListener('mousedown',function(ev2){plStartReroute(i,'from',{x:b.x,y:b.y},ev2);});
        var tF=document.createElementNS('http://www.w3.org/2000/svg','title');tF.textContent='Táhni = přepojit začátek na jiný uzel';hFrom.appendChild(tF);
        svg.appendChild(hFrom);
        var hTo=document.createElementNS('http://www.w3.org/2000/svg','circle');
        hTo.setAttribute('class','pl-endh');hTo.setAttribute('cx',b.x);hTo.setAttribute('cy',b.y);hTo.setAttribute('r','8');hTo.setAttribute('stroke',col);
        hTo.addEventListener('mousedown',function(ev2){plStartReroute(i,'to',{x:a.x,y:a.y},ev2);});
        var tT=document.createElementNS('http://www.w3.org/2000/svg','title');tT.textContent='Táhni = přepojit konec na jiný uzel';hTo.appendChild(tT);
        svg.appendChild(hTo);
      }
      var cap=document.createElementNS('http://www.w3.org/2000/svg','text');
      cap.setAttribute('class','pl-ecap');cap.setAttribute('x',lx);cap.setAttribute('y',ly+16);cap.setAttribute('text-anchor','middle');
      cap.textContent='× smazat · táhni ● konec = přesunout';
      svg.appendChild(cap);
    }
  });
}
// Přepojení konce vazby (přesunout) — táhni koncový úchyt na jiný uzel.
function plStartReroute(i,which,fixedPt,ev){
  ev.preventDefault();ev.stopPropagation();
  var canvas=document.getElementById('plCanvas'),svg=document.getElementById('plSvg');var z=PL.zoom||1;
  var tmp=document.createElementNS('http://www.w3.org/2000/svg','path');
  tmp.setAttribute('class','pl-edge');tmp.setAttribute('stroke','var(--g3)');tmp.setAttribute('stroke-dasharray','5 4');tmp.setAttribute('marker-end','url(#plArrow)');
  svg.appendChild(tmp);
  var rect=canvas.getBoundingClientRect();var sx=ev.clientX,sy=ev.clientY,moved=false;
  function mm(e){if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>5)moved=true;var mx=(e.clientX-rect.left)/z,my=(e.clientY-rect.top)/z;tmp.setAttribute('d','M'+fixedPt.x+','+fixedPt.y+' L'+mx+','+my);}
  function mu(e){
    document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);tmp.remove();
    if(!moved)return;
    var tgt=e.target.closest?e.target.closest('.pl-node'):null;
    if(tgt){var id=tgt.getAttribute('data-id');var ed=PL.wf.edges[i];if(ed){if(which==='to')ed.to=id;else ed.from=id;PL.dirty=true;plAutosave();PL.sel={t:'edge',i:i};renderMain();}}
  }
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}
function plRefresh(){ // překreslí uzly (výběr/barvy), hrany i inspektor bez ztráty PL.wf
  var canvas=document.getElementById('plCanvas');if(!canvas){renderMain();return}
  // aktualizuj třídy výběru na uzlech
  (PL.wf.nodes||[]).forEach(function(n){var el=document.getElementById('pln_'+n.id);if(el)el.className='pl-node'+((PL.sel&&PL.sel.t==='node'&&PL.sel.id===n.id)?' sel':'');});
  plDrawEdges();plRenderInsp();plRenderDesc();
  var dd=document.querySelector('.pl-dirty');
  if(PL.dirty&&!dd){var tb=document.querySelector('.pl-tb');if(tb){var stat=document.getElementById('plSaveStat');tb.insertBefore(Object.assign(document.createElement('span'),{className:'pl-dirty',textContent:'● nepublikováno'}),stat||null);}}
}
function plWireCanvas(){
  var canvas=document.getElementById('plCanvas'),stage=document.getElementById('plStage');if(!canvas)return;
  canvas.addEventListener('mousedown',function(ev){
    var dotEl=ev.target.closest?ev.target.closest('[data-dot]'):null;
    if(dotEl){ev.preventDefault();plStartConn(dotEl.getAttribute('data-dot'),ev);return;}
    var dragEl=ev.target.closest?ev.target.closest('[data-drag]'):null;
    if(dragEl){ev.preventDefault();plStartDrag(dragEl.getAttribute('data-drag'),ev);return;}
    // pan spustíme JEN při tažení prázdné plochy (samotné plátno) — ať klik na
    // šipku/uzel není přebit panem (jinak by se šipka při překreslení ztratila).
    if(ev.target&&ev.target.id==='plCanvas'){plStartPan(ev);}
  });
  // kolečko = zoom (na pozici kurzoru)
  stage.addEventListener('wheel',function(e){e.preventDefault();var r=stage.getBoundingClientRect();plZoomAt(e.deltaY<0?1.1:0.9,e.clientX-r.left,e.clientY-r.top);},{passive:false});
  // klávesa Delete/Backspace = smazat vybraný uzel / vazbu (jednou navěšeno)
  if(!PL._keyWired){PL._keyWired=true;document.addEventListener('keydown',function(e){
    if(FILTER!=='platno'||!PL.sel)return;
    var t=e.target,tag=(t&&t.tagName||'').toLowerCase();
    if(tag==='input'||tag==='select'||tag==='textarea')return;
    if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();if(PL.sel.t==='node')plDelNode();else plDelEdge();}
    if(e.key==='Escape'){PL.sel=null;plRefresh();}
  });}
}
function plStartPan(ev){
  var stage=document.getElementById('plStage');if(!stage)return;
  var sx=ev.clientX,sy=ev.clientY,sl=stage.scrollLeft,st=stage.scrollTop,moved=false;
  stage.classList.add('panning');ev.preventDefault();
  function mm(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;stage.scrollLeft=sl-dx;stage.scrollTop=st-dy;}
  function mu(){document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);stage.classList.remove('panning');if(!moved){PL.sel=null;plRefresh();}}
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}
function plStartDrag(id,ev){
  var n=plNode(id);if(!n)return;
  var z=PL.zoom||1;
  var sx=ev.clientX,sy=ev.clientY,ox=n.x||0,oy=n.y||0,moved=false;
  var el=document.getElementById('pln_'+id);
  document.body.style.cursor='grabbing';
  function mm(e){var dx=(e.clientX-sx)/z,dy=(e.clientY-sy)/z;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;n.x=Math.max(0,plSnap(ox+dx));n.y=Math.max(0,plSnap(oy+dy));el.style.left=n.x+'px';el.style.top=n.y+'px';plDrawEdges();}
  function mu(){document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);document.body.style.cursor='';if(moved){PL.dirty=true;plAutosave();}PL.sel={t:'node',id:id};plRefresh();}
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}
function plFull(){PL.full=!PL.full;document.body.style.overflow=PL.full?'hidden':'';renderMain();}
function plApplyZoom(){var c=document.getElementById('plCanvas'),w=document.getElementById('plZoomWrap');if(!c)return;var z=PL.zoom||1;c.style.transformOrigin='0 0';c.style.transform='scale('+z+')';if(w){w.style.width=(2000*z)+'px';w.style.height=(900*z)+'px';}var l=document.getElementById('plZoomLbl');if(l)l.textContent=Math.round(z*100)+' %';}
function plZoomAt(f,cx,cy){var s=document.getElementById('plStage');if(!s)return;var old=PL.zoom||1;var nz=Math.min(1.8,Math.max(0.4,old*f));if(Math.abs(nz-old)<0.001)return;var canvasX=(s.scrollLeft+cx)/old,canvasY=(s.scrollTop+cy)/old;PL.zoom=nz;plApplyZoom();s.scrollLeft=canvasX*nz-cx;s.scrollTop=canvasY*nz-cy;}
function plZoomBy(f){var s=document.getElementById('plStage');if(!s)return;var r=s.getBoundingClientRect();plZoomAt(f,r.width/2,r.height/2);}
function plZoomReset(){var s=document.getElementById('plStage');if(!s)return;PL.zoom=1;plApplyZoom();}
function plStartConn(id,ev){
  var canvas=document.getElementById('plCanvas'),svg=document.getElementById('plSvg');

  var start=plNodeAnchor(id,'r');
  var tmp=document.createElementNS('http://www.w3.org/2000/svg','path');

  svg.appendChild(tmp);
  var rect=canvas.getBoundingClientRect();var sx=ev.clientX,sy=ev.clientY,moved=false;
  function mm(e){if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>5)moved=true;var mx=(e.clientX-rect.left)/z,my=(e.clientY-rect.top)/z;tmp.setAttribute('d','M'+start.x+','+start.y+' L'+mx+','+my);}
  function mu(e){
    document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);tmp.remove();

function plField(label,html){return '<label>'+esc(label)+'</label>'+html}

function plInspEdge(box){
  var e=PL.wf.edges[PL.sel.i];if(!e){PL.sel=null;return plRenderInsp();}
  var nodeOpts=[['','—']].concat((PL.wf.nodes||[]).map(function(n){return [n.id,n.label||n.id]}));
  var h='<button class="pl-close" onclick="plCloseInsp()" title="Zavřít">×</button><h3>Přechod</h3>';

  var roles=e.roles||[];

    Object.keys(plRoles()).filter(function(r){return r!==''}).map(function(r){return '<label><input type="checkbox" '+(roles.indexOf(r)>=0?'checked':'')+' onchange="plSetEdgeRole(\''+r+'\',this.checked)">'+esc(plRoleLabel(r))+'</label>'}).join('')+'</div>';
  var notify=e.notify||[];
  h+='<label>Oznámit (e-mail + notifikace) — lze víc rolí naráz</label><div class="pl-chks">'+
    Object.keys(plRoles()).filter(function(r){return r!==''&&r!=='klient'}).map(function(r){return '<label><input type="checkbox" '+(notify.indexOf(r)>=0?'checked':'')+' onchange="plSetEdgeNotify(\''+r+'\',this.checked)">'+esc(plRoleLabel(r))+'</label>'}).join('')+'</div>';
  h+='<label>Podmínky</label><div class="pl-chks">'+
    '<label><input type="checkbox" '+(e.needNote?'checked':'')+' onchange="plSetEdge(\'needNote\',this.checked)">poznámka povinná</label>'+
    '<label><input type="checkbox" '+(e.needPlant?'checked':'')+' onchange="plSetEdge(\'needPlant\',this.checked)">vybrat závod</label>'+
    '<label><input type="checkbox" '+(e.needPdf?'checked':'')+' onchange="plSetEdge(\'needPdf\',this.checked)">vyžadovat PDF</label>'+
    '<label><input type="checkbox" '+(e.needVyrobni?'checked':'')+' onchange="plSetEdge(\'needVyrobni\',this.checked)">vyžadovat výrobní dok.</label>'+
    '</div>';
  h+='<div class="pl-hint" style="margin-top:10px">„Oznámit" pošle při tomto přechodu e-mail i notifikaci všem zaškrtnutým rolím naráz (např. dvě role současně) — nad rámec pevných e-mailů akce. Mechanika akce (tokeny, zámek verze) je vázaná na klíč akce.</div>';
  h+='<button class="btn sm ghost" style="width:100%;margin-top:10px" onclick="plAddEdgeFrom(\''+esc(e.from)+'\')">+ Rozvětvit — další přechod ze stavu „'+esc(plNodeLbl(e.from))+'"</button>';
  h+='<button class="pl-del" onclick="plDelEdge()">Smazat přechod</button>';
  box.innerHTML=h;
}
function plNodeLbl(id){if(id===null)return '(zadání)';if(id==='*')return '(odkudkoli)';if(String(id).charAt(0)==='@')return id;var n=plNode(id);return n?(n.label||n.id):id;}

function plSetNode(k,v){var n=plNode(PL.sel.id);if(!n)return;if(v===null)delete n[k];else n[k]=v;PL.dirty=true;plAutosave();if(k==='label'){var el=document.getElementById('pln_'+n.id);if(el){el.querySelector('.hd span').textContent=v||n.id;}else plUpdateNode(n.id);}else{plUpdateNode(n.id);plRenderInsp();}}
function plSetEdge(k,v){var e=PL.wf.edges[PL.sel.i];if(!e)return;e[k]=v;PL.dirty=true;plAutosave();if(k==='label'||k==='action'){plDrawEdges();}else{plRefresh();}}
function plSetEdgeRole(r,on){var e=PL.wf.edges[PL.sel.i];if(!e)return;e.roles=e.roles||[];var i=e.roles.indexOf(r);if(on&&i<0)e.roles.push(r);if(!on&&i>=0)e.roles.splice(i,1);PL.dirty=true;plAutosave();}
function plSetEdgeNotify(r,on){var e=PL.wf.edges[PL.sel.i];if(!e)return;e.notify=e.notify||[];var i=e.notify.indexOf(r);if(on&&i<0)e.notify.push(r);if(!on&&i>=0)e.notify.splice(i,1);PL.dirty=true;plAutosave();}
function plDelNode(){var n=plNode(PL.sel.id);if(!n)return;if(!confirm('Smazat stav "'+(n.label||n.id)+'" a jeho přechody?'))return;var id=n.id;PL.wf.nodes=PL.wf.nodes.filter(function(x){return x.id!==id});PL.wf.edges=PL.wf.edges.filter(function(x){return x.from!==id&&x.to!==id});PL.dirty=true;PL.sel=null;plAutosave();renderMain();}
function plDelEdge(){if(!confirm('Smazat tento přechod (vazbu)?'))return;PL.wf.edges.splice(PL.sel.i,1);PL.dirty=true;PL.sel=null;plAutosave();renderMain();}
function plReset(){if(PL.dirty&&!confirm('Zahodit rozpracovaný koncept a načíst naposledy uložené pravidlo?'))return;plSwitchFam(PL.fam);}
function plSeed(){api('/admin/workflow','GET').then(function(o){if(!o.ok){alert('Nelze načíst seed.');return}if(!confirm('Nahradit plátno výchozím (seed) pravidlem? Uloží se jako koncept, naostro až tlačítkem Uložit.'))return;PL.wf=plClone(o.j.seed);PL.sel=null;PL.dirty=true;plAutosave();renderMain();});}
function plSave(){
  var msg=PL.fam
    ? 'Uložit pravidlo pro tuto skupinu? Uloží se jako pravidlo skupiny (ostrý per-skupinový provoz se zapne až na tvůj pokyn).'
    : 'Uložit pravidlo NAOSTRO? Projeví se v reálném workflow konstrukce u nově zakládaných i běžících zakázek.';
  if(!confirm(msg))return;
  api('/admin/workflow','POST',{workflow:PL.wf,mode:'publish',fam:PL.fam}).then(function(o){
    if(!o.ok){alert('Uložení selhalo: '+((o.j&&o.j.chyba)||'chyba'));return}
    PL.dirty=false;PL.fromDraft=false;PL.inherited=false;
    if(!PL.fam){reloadData();setTimeout(function(){PL.wf=plClone(D.workflow);PL.sel=null;renderMain();},60);}
    else{PL.sel=null;renderMain();}
    alert(PL.fam?'Pravidlo skupiny uloženo (návrh).':'Pravidlo toku uloženo naostro. Projeví se v reálném workflow.');
  });
}

    '<textarea id="plJson" spellcheck="false"></textarea>'+

  document.body.appendChild(wrap);

  document.getElementById('plCopy').onclick=function(){ta.select();try{navigator.clipboard.writeText(ta.value);}catch(_){document.execCommand('copy');}this.textContent='Zkopírováno ✓';};
  document.getElementById('plCloseM').onclick=function(){wrap.remove();};
  document.getElementById('plLoad').onclick=function(){

/* ==================== ARCHIV VÝKRESŮ (Disk Bruntál) + VIZUALIZACE ==================== */
/* Server indexuje sdílený Disk výroby; klient hledá dle kódu ABR nebo fulltextu.
   svgAbr() kreslí schematický bokorys + zadní čelo kontejneru z dotazníku. */
function abrTok(v){
  if(v==null)return '';
  var s=(typeof v==='string')?v:((v.volba==='pozadavek')?'':String(v.hodnota||''));
  var kd=s.trim().split(/[\s—–]+/)[0]||'';
  return (kd==='NE'||kd==='—')?'':kd;
}
function abrSpecFromDot(z){
  if(ABR_RADY_JS.indexOf(z.typKey)<0)return null;
  var dot=z.dotaznik||{};
  return {typ:String(z.typKey||'').toUpperCase(),
    roz:(typeof dot.rozmery==='string'?dot.rozmery:''),
    plechy:(String(abrTok(dot.provedeni)).match(/\d\s*\/\s*\d/)||[])[0]||'',
    natah:abrTok(dot.natahovani),vrata:abrTok(dot.vrata),klapka:abrTok(dot.klapka),
    vlajka:abrTok(dot.vlajka),zebrik:abrTok(dot.zebrik),rolny:abrTok(dot.rolny),
    strecha:abrTok(dot.strecha),sklopna:abrTok(dot.sklopnaBocnice)};
}
function abrSpecFromForm(){
  var t=curType(); if(ABR_RADY_JS.indexOf(t.key)<0)return null;
  function fk(k){var f=dqField(k);if(!f||f.std===undefined)return '';var vol=selVolba(k);if(vol==='pozadavek')return '';
    var hod=(vol==='standard')?f.std:(selOptVal(k)||'');var kd=String(hod).trim().split(/[\s—–]+/)[0]||'';return (kd==='NE'||kd==='—')?'':kd;}
  return {typ:String(t.key||'').toUpperCase(),
    roz:((document.getElementById('dq_rozmery')||{}).value||''),

    natah:fk('natahovani'),vrata:fk('vrata'),klapka:fk('klapka'),vlajka:fk('vlajka'),
    zebrik:fk('zebrik'),rolny:fk('rolny'),strecha:fk('strecha'),sklopna:fk('sklopnaBocnice')};
}
/* Schematický výkres: bokorys (hák vlevo, vrata vpravo) + zadní čelo. Jen orientační proporce. */
function svgAbr(spec){
  if(!spec)return '';
  var roz=String(spec.roz||'').replace(/\s+/g,'').replace(/[×X]/g,'x');
  var m=roz.match(/^(\d{3,4})x(\d{3,4})x(\d{3,4})/);
  if(!m)return '';
  var L=+m[1],W=+m[2],H=+m[3];
  if(L<2500||L>9000||W<1200||W>3200||H<500||H>3200)return '';
  var C='#33413b',A='#0f7a3d',RIB='#c3d1c8',DIM='#7c8a80';
  var sc=Math.min(328/L,148/H);
  var x0=42,gy=212,sk=7,fl=4;
  var Lpx=L*sc,Hpx=H*sc,x1=x0+Lpx,bb=gy-sk,bt=bb-Hpx;
  var s='';
  function ln(a,b,c,d,col,wd,dash){s+='<line x1="'+a.toFixed(1)+'" y1="'+b.toFixed(1)+'" x2="'+c.toFixed(1)+'" y2="'+d.toFixed(1)+'" stroke="'+(col||C)+'" stroke-width="'+(wd||1.3)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+' stroke-linecap="round"/>'}
  function tx(x,y,t,size,col,anchor,bold){s+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-size="'+(size||10)+'" fill="'+(col||DIM)+'"'+(anchor?' text-anchor="'+anchor+'"':'')+(bold?' font-weight="700"':'')+' font-family="system-ui,sans-serif">'+esc(t)+'</text>'}
  // země
  ln(14,gy+1,546,gy+1,'#dce4de',1.5);
  // lyžina + korba (bokorys)
  s+='<rect x="'+(x0+8).toFixed(1)+'" y="'+bb.toFixed(1)+'" width="'+(Lpx-16).toFixed(1)+'" height="'+sk+'" fill="#e7eee9" stroke="'+C+'" stroke-width="1.1"/>';
  s+='<rect x="'+x0.toFixed(1)+'" y="'+bt.toFixed(1)+'" width="'+Lpx.toFixed(1)+'" height="'+Hpx.toFixed(1)+'" fill="#f7fbf8" stroke="'+C+'" stroke-width="1.7"/>';
  ln(x0+1,bb-fl,x1-1,bb-fl,C,0.8);                                  // podlaha
  var nR=Math.max(2,Math.round(L/1000));                            // výztuhy bočnice
  for(var i=1;i<=nR;i++){var rx=x0+Lpx*i/(nR+1);ln(rx,bt+3,rx,bb-2,RIB,1);}
  // natahování — hák na čele (výška dle kódu, standard 1570)
  var hookH=parseInt((String(spec.natah).match(/(\d{3,4})/)||[])[1]||'1570',10);
  if(!(hookH>=700&&hookH<=2200))hookH=1570;
  var hy=gy-hookH*sc;
  ln(x0+2,hy+2,x0+2,bb-1,C,1.5);                                    // sloupek háku
  ln(x0+2,hy+12,x0+30,bb-4,C,1.1);                                  // vzpěra
  ln(x0,hy,x0-10,hy,C,1.6);                                         // rameno
  s+='<path d="M '+(x0-10).toFixed(1)+' '+(hy-7).toFixed(1)+' A 7.5 7.5 0 1 0 '+(x0-10).toFixed(1)+' '+(hy+8).toFixed(1)+'" fill="none" stroke="'+C+'" stroke-width="1.9"/>';
  if(spec.natah)tx(6,hy-12,spec.natah,8.5,A,null,true);
  // žebřík (od výšky 1500, Z0 = bez)
  if(spec.zebrik&&spec.zebrik!=='Z0'&&H>=1500){
    var xz1=x1-42,xz2=x1-30;
    ln(xz1,bt+7,xz1,bb-1,C,1.1);ln(xz2,bt+7,xz2,bb-1,C,1.1);
    for(var y=bt+12;y<bb-3;y+=9)ln(xz1,y,xz2,y,C,1);
  }
  // sklopná bočnice — pant v horní části
  if(spec.sklopna){
    var yy=bt+Hpx*0.42;
    ln(x0+6,yy,x1-6,yy,A,1.1,'5 4');
    [0.25,0.5,0.75].forEach(function(p){s+='<circle cx="'+(x0+Lpx*p).toFixed(1)+'" cy="'+yy.toFixed(1)+'" r="2.1" fill="#fff" stroke="'+A+'" stroke-width="1.1"/>'});
  }
  // rolny vzadu
  if(spec.rolny)s+='<circle cx="'+(x1-15).toFixed(1)+'" cy="'+(gy-5).toFixed(1)+'" r="5.5" fill="#fff" stroke="'+C+'" stroke-width="1.4"/>';
  // zadní hrana: vrata / klapka / vlajka
  if(spec.vrata){
    ln(x1+3.5,bt+1,x1+3.5,bb-1,A,2);
    s+='<circle cx="'+(x1+3.5).toFixed(1)+'" cy="'+(bt+10).toFixed(1)+'" r="1.8" fill="'+A+'"/><circle cx="'+(x1+3.5).toFixed(1)+'" cy="'+(bb-12).toFixed(1)+'" r="1.8" fill="'+A+'"/>';
    ln(x1+3.5,(bt+bb)/2,x1+9,(bt+bb)/2,A,1.6);
  }
  if(spec.klapka){
    ln(x1,bt+1,x1+22,bt+Hpx*0.4,A,1.4,'6 4');
    s+='<circle cx="'+x1.toFixed(1)+'" cy="'+(bt+1.5).toFixed(1)+'" r="2.2" fill="'+A+'"/>';
  }
  if(spec.vlajka){
    ln(x1-9,bt,x1-9,bt-17,C,1.3);
    s+='<polygon points="'+(x1-9).toFixed(1)+','+(bt-17).toFixed(1)+' '+(x1+5).toFixed(1)+','+(bt-13).toFixed(1)+' '+(x1-9).toFixed(1)+','+(bt-9).toFixed(1)+'" fill="'+A+'" opacity="0.85"/>';
  }
  // střecha dle prefixu kódu
  var st=String(spec.strecha||''),mid=(x0+x1)/2;
  if(/^(SM|SH|AS|SP)/.test(st)){
    var stp=Lpx/4;
    for(var a2=0;a2<4;a2++)s+='<path d="M '+(x0+stp*a2).toFixed(1)+' '+bt.toFixed(1)+' A '+(stp/2).toFixed(1)+' 13 0 0 1 '+(x0+stp*(a2+1)).toFixed(1)+' '+bt.toFixed(1)+'" fill="none" stroke="'+C+'" stroke-width="1.2"/>';
  }else if(/^SFX/.test(st)){
    s+='<polyline points="'+x0.toFixed(1)+','+bt.toFixed(1)+' '+mid.toFixed(1)+','+(bt-17).toFixed(1)+' '+x1.toFixed(1)+','+bt.toFixed(1)+'" fill="none" stroke="'+C+'" stroke-width="1.4"/>';
  }else if(/^(PR|PD|PP)/.test(st)){
    s+='<path d="M '+x0.toFixed(1)+' '+bt.toFixed(1)+' Q '+mid.toFixed(1)+' '+(bt-15).toFixed(1)+' '+x1.toFixed(1)+' '+bt.toFixed(1)+'" fill="none" stroke="'+C+'" stroke-width="1.2" stroke-dasharray="6 4"/>';
  }else if(/^(RS|DV|SD)/.test(st)){
    ln(x0+2,bt-5,x1-2,bt-5,C,1.4);
  }
  if(st)tx(mid,bt-21,st,8.5,A,'middle',true);
  // kóty bokorysu
  ln(x0,gy+16,x1,gy+16,DIM,1);ln(x0,gy+12,x0,gy+20,DIM,1);ln(x1,gy+12,x1,gy+20,DIM,1);
  tx((x0+x1)/2,gy+29,String(L),10,DIM,'middle',true);
  ln(x1+30,bt,x1+30,bb,DIM,1);ln(x1+26,bt,x1+34,bt,DIM,1);ln(x1+26,bb,x1+34,bb,DIM,1);
  s+='<text transform="rotate(-90 '+(x1+42).toFixed(1)+' '+((bt+bb)/2).toFixed(1)+')" x="'+(x1+42).toFixed(1)+'" y="'+((bt+bb)/2).toFixed(1)+'" font-size="10" font-weight="700" fill="'+DIM+'" text-anchor="middle" font-family="system-ui,sans-serif">'+H+'</text>';
  // zadní čelo (pohled zezadu)
  var cx=492,scR=Math.min(104/W,148/H),WR=W*scR,HR=H*scR,xr=cx-WR/2,btR=bb-HR;
  s+='<rect x="'+xr.toFixed(1)+'" y="'+btR.toFixed(1)+'" width="'+WR.toFixed(1)+'" height="'+HR.toFixed(1)+'" fill="#f7fbf8" stroke="'+C+'" stroke-width="1.5"/>';
  var lz=Math.min(530,(W-260)/2)*scR;
  s+='<rect x="'+(cx-lz-4).toFixed(1)+'" y="'+bb.toFixed(1)+'" width="8" height="'+sk+'" fill="#e7eee9" stroke="'+C+'" stroke-width="1"/>';
  s+='<rect x="'+(cx+lz-4).toFixed(1)+'" y="'+bb.toFixed(1)+'" width="8" height="'+sk+'" fill="#e7eee9" stroke="'+C+'" stroke-width="1"/>';
  if(spec.rolny){s+='<circle cx="'+(cx-lz).toFixed(1)+'" cy="'+(gy-3.5).toFixed(1)+'" r="3.8" fill="#fff" stroke="'+C+'" stroke-width="1.1"/><circle cx="'+(cx+lz).toFixed(1)+'" cy="'+(gy-3.5).toFixed(1)+'" r="3.8" fill="#fff" stroke="'+C+'" stroke-width="1.1"/>'}
  if(spec.vrata){
    ln(cx,btR+3,cx,bb-3,C,1.1);
    ln(cx-7,(btR+bb)/2,cx-3,(btR+bb)/2,A,1.6);ln(cx+3,(btR+bb)/2,cx+7,(btR+bb)/2,A,1.6);
  }
  if(spec.klapka){
    var ky=btR+HR*(spec.vrata?0.45:0.42);
    ln(xr+3,ky,xr+WR-3,ky,A,1.2,'5 4');
    s+='<circle cx="'+(xr+4).toFixed(1)+'" cy="'+(btR+4).toFixed(1)+'" r="1.8" fill="'+A+'"/><circle cx="'+(xr+WR-4).toFixed(1)+'" cy="'+(btR+4).toFixed(1)+'" r="1.8" fill="'+A+'"/>';
  }
  ln(xr,gy+16,xr+WR,gy+16,DIM,1);ln(xr,gy+12,xr,gy+20,DIM,1);ln(xr+WR,gy+12,xr+WR,gy+20,DIM,1);
  tx(cx,gy+29,String(W),10,DIM,'middle',true);
  // popisky
  tx(12,20,'ABR-'+(spec.typ||''),13,C,null,true);
  tx(12,36,L+' × '+W+' × '+H+' mm'+(spec.plechy?' · plechy '+spec.plechy:''),10.5,'#55645c');
  var leg=[spec.vrata,spec.klapka,spec.vlajka,spec.zebrik&&H>=1500?spec.zebrik:'',spec.sklopna,spec.rolny].filter(Boolean).join(' · ');
  if(leg)tx(548,20,leg,8.5,A,'end');
  tx((x0+x1)/2,250,'bokorys',8.5,DIM,'middle');
  tx(cx,250,'zadní čelo',8.5,DIM,'middle');
  return '<svg viewBox="0 0 560 258" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schéma kontejneru">'+s+'</svg>';
}
/* ---- dotazy na archiv ---- */
function archFetch(qq,cb){
  var ps=[];
  if(qq.kod)ps.push('kod='+encodeURIComponent(qq.kod));
  if(qq.q)ps.push('q='+encodeURIComponent(qq.q));
  api('/vykresy?'+ps.join('&')).then(function(o){
    cb(o.ok?o.j:{status:{},vysledky:[],chyba:(o.j||{}).chyba||'Chyba spojení.'});
  }).catch(function(){cb({status:{},vysledky:[],chyba:'Chyba spojení.'})});
}
function archRow(r,compact){

function stepDays(z){
  var order=['prideleni','prace','kontrola','obchodnik','klient','zavod','schvaleno','dokonceno'];
  var starts={prideleni:z.createdAt};
  var map=[['Přidělení','prace'],['Zkreslení hotovo','kontrola'],['Interní kontrola OK','obchodnik'],['Odesláno klientovi','klient'],['objednávka','zavod'],['závod','schvaleno']];
  (z.audit||[]).forEach(function(a){
    var ac=a.action||'';
    map.forEach(function(m){if(ac.indexOf(m[0])>=0)starts[m[1]]=a.at});
    if(ac.indexOf('výrobní dokumentace')>=0||ac.indexOf('Vyrobeno')>=0||ac.indexOf('Dokončeno')>=0)starts.dokonceno=a.at;
  });
  var days={};
  order.forEach(function(k,i){
    if(starts[k]==null||k==='dokonceno')return;
    var end=null;
    for(var j=i+1;j<order.length;j++){if(starts[order[j]]!=null){end=starts[order[j]];break}}
    if(end==null)end=Date.now();
    days[k]=Math.max(0,Math.round((end-starts[k])/86400000));
  });
  return days;
}
function czDays(n){n=Math.abs(n);return n===1?'den':(n>=2&&n<=4?'dny':'dní');}
function problemInfo(z){
  var now=(D&&D.now)||Date.now();
  if(z.stav==='podklady')return {cls:'amber',text:'⏸ Pozastaveno — čeká na podklady'+(z.holdReason?': '+esc(z.holdReason):'')};
  if(z.semafor==='red'&&z.deadline){var dd=Math.max(1,Math.round((now-z.deadline)/86400000));return {cls:'red',text:'🔴 Po termínu o '+dd+' '+czDays(dd)+' — krok „'+esc(z.stavLabel)+'", na tahu '+esc(z.responsibleName||'—')+(z.stav==='klient'?' (klient nereaguje)':'')};}
  if(z.semafor==='amber'&&z.deadline){var rd=Math.max(0,Math.round((z.deadline-now)/86400000));return {cls:'amber',text:'🟠 Blíží se termín — zbývá '+rd+' '+czDays(rd)+' — krok „'+esc(z.stavLabel)+'", na tahu '+esc(z.responsibleName||'—')};}
  return null;
}
function orderTrack(z){
  // Přímá objednávka (bez nabídkové fáze): výběr závodu je NA ZAČÁTKU, pak
  // konstrukce → schválení klientem → výrobní dokumentace.
  // Zakázka z nabídky: nabídkové kroky → předání (výběr závodu) → výrobní dok.
  var stages;
  if(z.rezim==='objednavka'&&!z.zNabidky){
    stages=[{k:'zavod',l:'Výběr závodu',f:'objednavka'},{k:'prideleni',l:'Přidělení',f:'objednavka'},{k:'prace',l:'Výkres',f:'objednavka'},{k:'kontrola',l:'Kontrola',f:'objednavka'},{k:'obchodnik',l:'U obchodníka',f:'objednavka'},{k:'klient',l:'U klienta',f:'objednavka'},{k:'schvaleno',l:'Výrobní dok.',f:'objednavka'},{k:'dokonceno',l:'Ve výrobě / Hotovo',f:'objednavka'}];
  }else{
    stages=[{k:'prideleni',l:'Přidělení',f:'nabidka'},{k:'prace',l:'Obchodní výkres',f:'nabidka'},{k:'kontrola',l:'Kontrola',f:'nabidka'},{k:'obchodnik',l:'U obchodníka',f:'nabidka'},{k:'klient',l:'U klienta',f:'nabidka'},{k:'zavod',l:'Výběr závodu',f:'objednavka'},{k:'schvaleno',l:'Výrobní dok.',f:'objednavka'},{k:'dokonceno',l:'Ve výrobě / Hotovo',f:'objednavka'}];
  }
  var order=stages.map(function(s){return s.k});
  var cur=z.stav, eff=cur;
  if(cur==='revize')eff='prace';
  if(cur==='podklady')eff=z.prevStav||'prace';
  var zam=(cur==='zamitnuto');
  var ci=zam?-1:order.indexOf(eff);
  var loc=(z.strediskoName?(' · závod '+esc(z.strediskoName)):'')+(z.cvzHelios?(' · ČVZ '+esc(z.cvzHelios)):'');
  var fazeLbl=(z.rezim==='objednavka')?'<span class="ot-faze obj">OBJEDNÁVKA '+esc(z.cisloObj||z.cislo)+'</span>':'<span class="ot-faze nab">NABÍDKA '+esc(z.cislo)+'</span>';
  var cap= zam?'<span style="color:var(--red);font-weight:700">✕ Zamítnuto / storno</span>'
    : cur==='podklady'?'<span style="color:var(--amber);font-weight:700">⏸ Pozastaveno — čeká na podklady'+(z.holdReason?': '+esc(z.holdReason):'')+'</span>'
    : '<b>'+esc(z.stavLabel)+'</b>'+loc+(z.deadline?(' · termín '+fdate(z.deadline)):'');
  var parts=[];
  stages.forEach(function(s,i){
    if(i>0)parts.push('<div class="ot-conn'+((!zam&&i<=ci)?' on':'')+(s.f==='objednavka'&&stages[i-1].f==='nabidka'?' ot-split':'')+'"></div>');
    var cls=(!zam&&i<ci)?'done':((!zam&&i===ci)?'cur':'fut');
    if(cls==='cur'&&(z.semafor==='red'||z.semafor==='amber'))cls+=' '+z.semafor;
    var lab=s.l;
    if(s.k==='zavod'&&z.strediskoName)lab='Závod: '+z.strediskoName;
    if(i===ci&&cur==='revize')lab='Revize v'+(z.versionCount||'');
    parts.push('<div class="ot-step"><div class="ot-dot '+cls+'">'+(cls==='done'?'✓':'')+'</div><div class="ot-lab'+(i===ci&&!zam?' cur':'')+'">'+esc(lab)+'</div></div>');
  });
  return '<div class="ot-cap">'+fazeLbl+' · Aktuální krok: '+cap+'</div><div class="ot-track">'+parts.join('')+'</div>';
}
function stepFlow(z){
  var stages=[{k:'prideleni',l:'Přidělení',r:'sef'},{k:'prace',l:'Obchodní výkres',r:'kon'},{k:'kontrola',l:'Kontrola',r:'sef'},{k:'obchodnik',l:'Obchodník',r:'obch'},{k:'klient',l:'U klienta',r:'kli'},{k:'zavod',l:'Výběr závodu',r:'vyr'},{k:'schvaleno',l:'Výrobní dok.',r:'kon'},{k:'dokonceno',l:'Ve výrobě',r:'sys'}];
  var order=stages.map(function(s){return s.k});
  var cur=z.stav, eff=cur;
  if(cur==='revize')eff='prace';
  if(cur==='podklady')eff=z.prevStav||'prace';
  if(cur==='zamitnuto')eff='';
  var ci=order.indexOf(eff);
  var days=stepDays(z);
  var h='<div class="flow">';
  stages.forEach(function(s,i){
    var cls='st';
    if(ci>=0&&i<ci)cls+=' done';
    else if(i===ci)cls+=' cur r-'+s.r;
    var label=s.l;
    if(i===ci&&cur==='revize')label='Revize v'+z.versionCount;
    if(s.k==='zavod'&&z.strediskoName)label='Závod: '+z.strediskoName;
    var dtxt=(days[s.k]!=null)?(' <span class="dd">'+days[s.k]+' d</span>'):'';
    h+=(i?'<span class="arw">→</span>':'')+'<span class="'+cls+'"><span class="rd"></span>'+esc(label)+dtxt+'</span>';
  });
  h+='</div>';
  if(cur==='podklady')h+='<div style="margin:-4px 0 8px;color:var(--amber);font-size:13px;font-weight:600">⏸ Pozastaveno — čeká na podklady'+(z.holdReason?': '+esc(z.holdReason):'')+'</div>';
  if(cur==='zamitnuto')h+='<div style="margin:-4px 0 8px;color:var(--red);font-size:13px;font-weight:600">✕ Zamítnuto / storno</div>';
  return h;
}
