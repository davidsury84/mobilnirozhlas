<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konstrukce — workflow výkresů</title>
<style>
:root{
  --g:#0e8a43;--g2:#0a6b34;--g3:#12a350;--ink:#0f1512;--mut:#5b635c;--line:#e3e7e0;
  --bg:#eef1ec;--card:#fff;--red:#c23636;--amber:#b06f00;--blue:#1565c0;--purple:#6a1b9a;--gray:#78909c;
  --green-soft:#e6f6ec;
}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
.bar{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.bar h1{font-size:17px;margin:0;font-weight:800;color:var(--g2)}
.bar .rolech{font-size:12px;font-weight:700;color:var(--g2);background:var(--green-soft);border:1px solid #bfe6cd;border-radius:20px;padding:3px 11px}
.bar .sp{flex:1}
.iconbtn{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:600;color:#33513f}
.iconbtn:hover{background:#f0f3ee}
.badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.wrap{display:flex;gap:0;align-items:flex-start}
.side{width:220px;min-width:220px;padding:16px 12px;position:sticky;top:57px;max-height:calc(100vh - 57px);overflow:auto}
.chip{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:9px 11px;cursor:pointer;font-weight:600;color:#3a4a41;margin-bottom:2px}
.chip:hover{background:#e9efe6}
.chip.act{background:var(--g);color:#fff}
.chip .n{font-size:12px;opacity:.85}
.chip.act .n{opacity:1}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 8px 6px;font-weight:700}
.main{flex:1;padding:18px 22px;min-width:0}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--g);color:#fff}
.btn:hover{background:var(--g2)}
.btn.ghost{background:#eef1ec;color:#33513f}.btn.ghost:hover{background:#e2e8dd}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.warn{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.blue{background:var(--blue)}.btn.blue:hover{filter:brightness(.92)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head h2{margin:0;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:12px}
.zk{cursor:pointer;transition:box-shadow .12s}
.zk:hover{box-shadow:0 3px 12px rgba(0,0,0,.07)}
.zk .t{font-weight:700;font-size:15px}
.zk .sub{color:var(--mut);font-size:13px;margin-top:2px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.green{background:var(--g3)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}.dot.none{background:#cfd8d2}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.novy{background:#eceff1;color:#455a64}
.pill.prace{background:#fff3e0;color:#e65100}
.pill.kontrola{background:#f3e5f5;color:#6a1b9a}
.pill.obchodnik{background:#e3f2fd;color:#1565c0}
.pill.klient{background:var(--green-soft);color:#0a6b34}
.pill.revize{background:#fff3e0;color:#e65100}
.pill.podklady{background:#eceff1;color:#607d8b}
.pill.schvaleno{background:var(--green-soft);color:#0a6b34}
.pill.vyroba{background:#e0f7fa;color:#00838f}
.pill.stredisko{background:#e0f7fa;color:#00838f}
.pill.dokonceno{background:#e0f2f1;color:#00695c}
.pill.zamitnuto{background:#fdecea;color:#c62828}
.muted{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
/* detail */
.ov{position:fixed;inset:0;background:rgba(20,28,24,.42);z-index:40;display:none}
.ov.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(680px,96vw);background:var(--bg);z-index:41;box-shadow:-4px 0 22px rgba(0,0,0,.16);transform:translateX(100%);transition:transform .18s;overflow:auto}
.drawer.open{transform:none}
.dhead{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;gap:12px}
.dbody{padding:18px 20px}
.x{margin-left:auto;border:0;background:#eef1ec;border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:18px;color:#33513f;flex:0 0 auto}
.kv{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;font-size:13.5px}
.kv b{color:var(--mut);font-weight:600}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;margin:18px 0 8px}
.tl{border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
.tl .it{position:relative;padding:0 0 12px}
.tl .it:before{content:'';position:absolute;left:-20px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--g3)}
.tl .it .m{font-size:12px;color:var(--mut)}
.cmt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.cmt.client{border-left:3px solid var(--g3)}
input,textarea,select{width:100%;font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 0}
.field{margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(20,28,24,.45);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:14px;width:min(720px,100%);padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sheet h3{margin:0 0 4px}
.err{color:var(--red);font-size:13px;margin-top:8px}
/* dotazník */
.dq{display:grid;grid-template-columns:220px 1fr;gap:8px 14px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.dq-l{font-weight:600;font-size:13.5px;padding-top:6px}
.dq-o{display:flex;flex-direction:column;gap:5px}
.dq-c{display:flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer}
.dq-c input[type=radio]{width:auto;margin:0}
.dq-tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;flex:0 0 auto}
.dq-tag.s{background:var(--green-soft);color:#0a6b34}.dq-tag.o{background:#fff3e0;color:#e65100}.dq-tag.p{background:#e3f2fd;color:#1565c0}
.dq-req{flex:1;min-width:120px;padding:5px 8px}
.dqview{display:grid;grid-template-columns:200px 1fr;gap:4px 12px;font-size:13px}
.dqview b{color:var(--mut);font-weight:600}
.dqview .bd{font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;margin-left:6px}
.dqview .s{background:var(--green-soft);color:#0a6b34}.dqview .o{background:#fff3e0;color:#e65100}.dqview .p{background:#e3f2fd;color:#1565c0}
.dqsec{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--g2);margin:16px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.dqsec:first-of-type{border-top:0;padding-top:0}
.dq:hover{background:#f7faf7}
.dq-c:hover .dq-tag{filter:brightness(.96)}
.dq-c.sel{background:#eef6f0;border-radius:8px;margin:-2px -6px;padding:2px 6px}
.langbar{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.langb{border:0;background:#fff;padding:6px 12px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;color:#33513f;border-right:1px solid var(--line)}
.langb:last-child{border-right:0}
.langb.act{background:var(--g);color:#fff}
.langb:not(.act):hover{background:#eef1ec}
.reqmark{color:var(--red)}
.ssobar{display:flex;align-items:center;gap:8px;margin:10px 0 2px;padding:8px 12px;background:var(--green-soft);border:1px solid #bfe6cd;border-radius:10px;font-size:13.5px;color:#245c39}
.ssobar svg{color:var(--g2);flex:0 0 auto}
.adr-dd{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.14);max-height:270px;overflow:auto;margin-top:3px}
.adr-i{display:flex;gap:8px;align-items:center;padding:8px 11px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line)}
.adr-i:last-child{border-bottom:0}.adr-i:hover{background:#eef6f0}
.adr-b{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:#eef1ec;color:#33513f;flex:0 0 auto}
.adr-b.osm{background:#e3f2fd;color:#1565c0}
.adr-load{padding:9px 11px;font-size:12.5px;color:var(--mut)}
.artpick{margin:10px 0 2px;padding:10px 12px;background:#f3faf5;border:1px solid #bfe6cd;border-radius:10px}
.artpick>label{margin:0 0 4px;font-size:12.5px;font-weight:700;color:var(--g2)}
.art-dd{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.14);max-height:280px;overflow:auto;margin-top:3px}
.art-i{padding:8px 11px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
/* Vlastní výběr typu výrobku s plným podbarvením rodin */
.tsel{position:relative}
.tsel-trigger{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;text-align:left}
.tsel-trigger:hover{border-color:#c3ccc4}
.tsel-cur{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.tsel-cur b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsel-arrow{color:var(--mut);font-size:11px;flex:0 0 auto}
.tsel-dot{width:12px;height:12px;border-radius:3px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.tsel-panel{position:absolute;left:0;right:0;top:100%;z-index:35;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:340px;overflow:auto;padding:5px}
.tsel-glabel{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:9px 8px 4px;color:var(--mut)}
.tsel-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;margin:2px 0;line-height:1.25}
.tsel-row .tsel-nm{flex:1;min-width:0}
.tsel-row:hover{filter:brightness(.95)}
.tsel-row.sel{box-shadow:inset 0 0 0 2px rgba(0,0,0,.22);font-weight:700}
.tsel-check{margin-left:auto;font-weight:800;display:none}
.tsel-row.sel .tsel-check{display:inline}
.art-i:last-child{border-bottom:0}.art-i:hover{background:#eef6f0}
.art-info{font-size:12.5px;color:#245c39;margin-top:6px;min-height:16px}
.art-tag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--g);color:#fff}
.art-prov{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:#e3f2fd;color:#1565c0}
/* moderní kompaktní dialog */
.dqmodal{display:flex;flex-direction:column;max-height:92vh;padding:0;width:min(780px,100%);overflow:hidden}
.dqhead{padding:15px 22px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dqbody{overflow:auto;padding:12px 22px 18px;flex:1 1 auto}
.dqfoot{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:flex-end;flex:0 0 auto;background:#fff}
.dqfoot .cnt{margin-right:auto;font-size:12.5px;color:var(--mut)}
.dqhg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.dqhg label{margin:0 0 2px;font-size:12px;color:var(--mut)}
.dqhg input,.dqhg select{padding:8px 10px;font-size:13.5px}
.dqsec2{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--g2);margin:16px 0 4px}
.dq2{display:grid;grid-template-columns:190px 1fr;gap:5px 14px;align-items:center;padding:5px 0;border-bottom:1px solid #eef1ec}
.dq2:hover{background:#f8faf8}
.dq2-l{font-weight:600;font-size:13px}
.dq2-seg{display:flex;flex-wrap:wrap;gap:6px}
.seg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font:inherit;font-size:12.5px;font-weight:600;color:#3a4a41;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.seg:hover{background:#f0f3ee}
.seg.sel{background:var(--g);border-color:var(--g);color:#fff}
.seg .st{font-size:9px;font-weight:800;letter-spacing:.03em;opacity:.7;text-transform:uppercase}
.seg.sel .st{opacity:.85}
.dq2 input.txt,.dq2-req{grid-column:2;width:100%;padding:7px 10px;font-size:13.5px}
.ral-tb{display:flex;flex-wrap:wrap;gap:5px}
.ral-sw{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;padding:3px 8px 3px 4px;font-size:11px;font-weight:700;cursor:pointer;background:#fff;color:#3a4a41}
.ral-sw i{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.18);flex:0 0 auto;display:inline-block}
.ral-sw:hover{background:#f0f3ee}
.ral-sw.sel{border-color:var(--g);box-shadow:0 0 0 2px rgba(14,138,67,.25)}
.ral-row{display:flex;align-items:center;gap:10px}
.ral-pick{width:38px;height:34px;padding:0;border:1px solid var(--line-strong,#cdd3ca);border-radius:8px;cursor:pointer;background:none;flex:0 0 auto}
.ral-pick::-webkit-color-swatch-wrapper{padding:3px}
.ral-pick::-webkit-color-swatch{border:none;border-radius:5px}
.ral-pick::-moz-color-swatch{border:none;border-radius:5px}
.ral-cur{font-size:13px}
.dq2-req{margin-top:4px}
.dq2-optwrap{grid-column:2;display:flex;align-items:center;gap:7px;margin-top:4px}
.dq2-opt{width:120px;padding:7px 10px;font-size:13.5px;border:1px solid var(--line);border-radius:8px}
.dq2-unit{font-size:12.5px;color:var(--mut);font-weight:600}
@media(max-width:640px){.dqhg{grid-template-columns:1fr}.dq2{grid-template-columns:1fr;gap:3px}.dq2 input.txt,.dq2-req,.dq2-optwrap{grid-column:1}}
.dq-hint{font-size:11.5px;color:var(--mut);margin-top:2px}
@media(max-width:600px){.dq{grid-template-columns:1fr}.dqview{grid-template-columns:1fr}}
.ok{color:var(--g);font-size:13px;margin-top:8px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi .c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:26px;font-weight:800;color:var(--g2)}
.kpi .l{font-size:12px;color:var(--mut);margin-top:2px}
.cap{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.capbar{flex:1;height:9px;background:#eceff1;border-radius:6px;overflow:hidden}
.capbar i{display:block;height:100%;border-radius:6px}
.notifpop{position:absolute;right:16px;top:54px;width:min(380px,92vw);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.16);z-index:30;max-height:70vh;overflow:auto;display:none}
.notifpop.open{display:block}
.notifpop .n{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.notifpop .n.unread{background:#f1f8f2}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#eef1ec;color:#33513f}
/* workflow stepper + schéma */
.flow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:2px 0 10px}
.flow .st{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12.5px;font-weight:600;background:#fff;color:var(--mut)}
.flow .st .rd{width:9px;height:9px;border-radius:50%;background:#cfd8d2}
.flow .st.done{color:#3a4a41}
.flow .st.done .rd{background:var(--g3)}
.flow .st.cur{color:#fff;border-color:transparent}
.flow .st.cur .rd{background:rgba(255,255,255,.9)}
.flow .arw{color:#c3ccc4;font-size:13px}
.flow .dd{font-weight:700;font-size:11px;margin-left:3px;opacity:.6}
.r-sef{background:var(--purple)!important}.r-kon{background:#e65100!important}.r-obch{background:var(--blue)!important}.r-kli{background:var(--g)!important}.r-sys{background:var(--gray)!important}.r-vyr{background:#00838f!important}
.pdfwrap{background:#525659;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.pdfwrap iframe{width:100%;height:58vh;border:0;display:block}
.pdfbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 14px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.wf{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.wf .node{border-radius:12px;padding:12px 14px;color:#fff;min-width:150px;flex:0 0 auto}
.wf .node .t{font-weight:800;font-size:14px}
.wf .node .m{font-size:12px;opacity:.92;margin-top:3px}
.wf .node .m .wfd{width:44px;padding:2px 4px;border:0;border-radius:5px;font:inherit;font-weight:700;text-align:center;background:rgba(255,255,255,.92);color:#22302a}
.wf-explain{background:#eef6f0;border:1px solid #bfe6cd;border-radius:10px;padding:9px 12px;font-size:12.5px;color:#2f5c40;margin:2px 0 12px;line-height:1.45}
.wf .arw{display:flex;align-items:center;color:#b6bfb7;font-size:20px;font-weight:700}
.wf .branch{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:#3a4a41;min-width:150px;font-size:12.5px}
/* Ganttův timeline SET-UP (cílové doby fází) */
.gantt{margin:4px 0 2px}
.gantt-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.gantt-lab{width:108px;min-width:108px;font-size:12px;font-weight:700;color:var(--mut);text-align:right;line-height:1.15}
.gantt-track{position:relative;flex:1;height:30px;min-width:0}
.gantt-axis .gantt-track{height:16px}
.gantt-plot{position:absolute;inset:0;background:#f4f6f2;border-radius:8px;overflow:hidden}
.gantt-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line);z-index:1}
.gantt-tick{position:absolute;top:1px;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}
.gantt-seg{position:absolute;top:3px;bottom:3px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;border-radius:6px;z-index:2;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.gantt-seg.act{background-image:linear-gradient(135deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%);background-size:10px 10px}
.gantt-sum{min-width:52px;font-size:12px;font-weight:800;color:var(--ink);text-align:left}
.gantt-sum .lab{display:block;font-size:10px;font-weight:600;color:var(--mut)}
.ph-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:10px;margin-top:16px}
.ph-item{border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.ph-item .nm{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.ph-item .dotc{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.ph-item .ctl{display:flex;align-items:center;gap:6px;margin-top:8px}
.ph-item .ctl input{width:66px}
.ph-item .sub{color:var(--mut);font-size:12px;margin-top:6px}
@media(max-width:820px){
  .wrap{flex-direction:column}
  .side{width:auto;min-width:0;position:static;max-height:none;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}
  .side .grp{display:none}
  .chip{width:auto;white-space:nowrap;flex:0 0 auto;margin-bottom:0;border:1px solid var(--line);padding:8px 12px}
  .chip.act{border-color:var(--g)}
  .chip .n{margin-left:6px}
  .main{padding:16px}
  .two{grid-template-columns:1fr}.kv{grid-template-columns:110px 1fr}
  .drawer{width:100vw}
}

/* Timeline zakázky: pruh poptávka→termín + čísla */
.tl{margin-top:12px}
.tl-bar{position:relative;height:8px;border-radius:20px;background:var(--line);overflow:hidden}
.tl-fill{position:absolute;left:0;top:0;height:100%;border-radius:20px;min-width:3px}
.tl-step{position:absolute;top:-2px;width:2px;height:12px;background:var(--mut);opacity:.55}
.tl-ends{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--mut)}
.tl-nums{display:flex;gap:20px;flex-wrap:wrap;margin-top:8px}
.tl-n{display:flex;align-items:baseline;gap:5px}
.tl-n b{font-size:16px;font-weight:800;line-height:1}
.tl-n .lab{font-size:11.5px;color:var(--mut)}
.tl-n.red b{color:var(--red)}.tl-n.amber b{color:var(--amber)}.tl-n.green b{color:var(--g3)}
.tl-late{margin-top:10px;display:inline-flex;align-items:center;gap:7px;background:var(--red);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;line-height:1}
.tl-late b{font-weight:800}
/* ---- plátno pravidla toku (workflow editor) ---- */
.pl-tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pl-tb .btn{white-space:nowrap}
.pl-dirty{color:var(--amber);font-weight:700;font-size:12.5px}
.pl-root.full{position:fixed;inset:0;z-index:3000;background:var(--bg);margin:0;padding:12px 18px 16px;overflow:auto}
.pl-wrap{position:relative}
.pl-stage{width:100%;position:relative;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;height:640px;cursor:grab}
.pl-stage.panning{cursor:grabbing}
.pl-root.full .pl-stage{height:calc(100vh - 150px)}
.pl-canvas{position:relative;width:2000px;height:900px;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.pl-svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pl-edge{fill:none;stroke-width:2.2;cursor:pointer;pointer-events:stroke}
.pl-edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:stroke}
.pl-elabel{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;cursor:pointer;pointer-events:auto}
.pl-node{position:absolute;width:168px;border-radius:11px;background:#fff;border:2px solid var(--gray);box-shadow:0 2px 7px rgba(0,0,0,.08);user-select:none}
.pl-node.sel{box-shadow:0 0 0 3px rgba(14,138,67,.35),0 3px 10px rgba(0,0,0,.14)}
.pl-node .hd{padding:8px 10px;border-radius:9px 9px 0 0;color:#fff;font-weight:800;font-size:12.5px;cursor:grab;display:flex;justify-content:space-between;align-items:center;gap:6px}
.pl-node .bd{padding:7px 10px 9px;font-size:11.5px;color:var(--mut);line-height:1.35}
.pl-node .bd b{color:var(--ink)}
.pl-badge{display:inline-block;font-size:10px;font-weight:700;background:rgba(255,255,255,.25);border-radius:6px;padding:1px 5px}
.pl-dot{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:var(--g);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:crosshair}
.pl-dot:hover{background:var(--g3);transform:translateY(-50%) scale(1.15)}
.pl-insp{position:absolute;top:12px;right:12px;width:300px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:calc(100% - 24px);overflow:auto;box-shadow:0 6px 24px rgba(0,0,0,.16);z-index:6}
.pl-insp.hidden{display:none}
.pl-insp h3{margin:0 30px 10px 0;font-size:15px}
.pl-insp .pl-close{position:absolute;top:8px;right:10px;border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--mut);font-weight:700}
.pl-insp .pl-close:hover{color:var(--ink)}
.pl-insp label{display:block;font-size:11.5px;color:var(--mut);font-weight:700;margin:9px 0 3px}
.pl-insp input[type=text],.pl-insp input[type=number],.pl-insp select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
.pl-insp .rowck{display:flex;align-items:center;gap:7px;margin:6px 0;font-size:12.5px;color:var(--ink);font-weight:600}
.pl-insp .rowck input{width:auto}
.pl-chks{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pl-chks label{display:inline-flex;align-items:center;gap:5px;background:#f2f5f0;border:1px solid var(--line);border-radius:7px;padding:4px 8px;margin:0;font-size:12px;color:var(--ink);cursor:pointer}
.pl-chks label input{width:auto}
.pl-hint{font-size:11.5px;color:var(--mut);background:#f7faf6;border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.4}
.pl-del{background:#fdecec;color:var(--red);border:1px solid #f3caca;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;margin-top:12px;width:100%}
.pl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin:2px 0 10px}
.pl-legend i{display:inline-block;width:22px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
</style>

<body>
<div class="bar">
  <h1>Konstrukce</h1>
  <button class="btn ghost sm" id="backBtn" style="display:none" onclick="goBack()">← Zpět</button>
  <span class="rolech" id="rolech">…</span>
  <span class="sp"></span>
  <button class="btn sm" id="newBtn" style="display:none" onclick="openNew()">+ Nová zakázka</button>
  <button class="iconbtn" onclick="toggleNotif()">🔔<span class="badge" id="nbadge" style="display:none">0</span></button>
  <button class="iconbtn" onclick="reloadData()" title="Obnovit">⟳</button>
</div>
<div class="notifpop" id="notifpop"></div>

<div class="wrap">
  <div class="side" id="side"></div>
  <div class="main" id="main"><p class="muted">Načítám…</p></div>
</div>

<div class="ov" id="ov" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

<div class="modal" id="modal"></div>

<script>
var D=null, ME=null, FILTER='dash', SEL=null;
var TS={from:null,to:null,user:'',data:null,editing:null};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fdate(ts){if(!ts)return'—';var d=new Date(ts);function p(n){return(n<10?'0':'')+n}return p(d.getUTCDate())+'.'+p(d.getUTCMonth()+1)+'.'+d.getUTCFullYear()}
function fdt(ts){if(!ts)return'—';var d=new Date(ts);function p(n){return(n<10?'0':'')+n}return fdate(ts)+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())}
function hhmm(sec){sec=sec||0;var h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);return h+'h '+(m<10?'0':'')+m+'m'}
function roleLabel(r){return{obchodnik:'Obchodník',sef:'Šéf konstrukce',konstrukter:'Konstruktér',reditel:'Ředitel','vykonny-reditel':'Výkonný ředitel výroby','vyrobni-reditel':'Výrobní ředitel',admin:'Správce'}[r]||r||'—'}
function api(path,method,body){return fetch('/api/konstrukce'+path,{method:method||'GET',headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,cache:'no-store'}).then(function(r){return r.json().then(function(j){return{ok:r.ok,status:r.status,j:j}})})}

function isPriv(){return ME.isAdmin||ME.role==='sef'||ME.role==='reditel'}
function canCreate(){return ME.isAdmin||ME.role==='obchodnik'}

function reloadData(){
  api('/data').then(function(o){
    if(!o.ok){document.getElementById('main').innerHTML='<div class="empty">'+esc(o.j.chyba||'Chyba načtení.')+'</div>';return}
    D=o.j; ME=o.j.me;
    document.getElementById('rolech').textContent=roleLabel(ME.role);
    document.getElementById('newBtn').style.display=canCreate()?'':'none';
    var nb=document.getElementById('nbadge');
    if(D.notifUnread){nb.style.display='';nb.textContent=D.notifUnread}else nb.style.display='none';
    renderSide(); renderMain();
    if(SEL){var z=D.zakazky.find(function(x){return x.id===SEL});if(z)renderDrawer(z);}
    // vstup z Obchodu: /konstrukce#zadani otevře rovnou nové zadání (jeden tok)
    if(!ZADANI_OPENED && /(^|[#&])zadani/.test(location.hash) && canCreate()){ZADANI_OPENED=true;openNew();}
  });
}
var ZADANI_OPENED=false;

/* ---- levý filtr ---- */
function counts(){
  var z=D.zakazky, me=ME.email;
  return {
    mine:z.filter(function(x){return x.responsible===me&&!isTerminal(x.stav)}).length,
    novy:z.filter(function(x){return x.stav==='novy'}).length,
    prideleni:z.filter(function(x){return x.stav==='prideleni'}).length,
    prace:z.filter(function(x){return x.stav==='prace'||x.stav==='revize'}).length,
    kontrola:z.filter(function(x){return x.stav==='kontrola'}).length,
    obchodnik:z.filter(function(x){return x.stav==='obchodnik'}).length,
    klient:z.filter(function(x){return x.stav==='klient'}).length,
    schvaleno:z.filter(function(x){return x.stav==='schvaleno'}).length,
    vyr:z.filter(function(x){return x.stav==='dokonceno'}).length,
    red:z.filter(function(x){return x.semafor==='red'}).length,
    open:z.filter(function(x){return !isTerminal(x.stav)}).length,
    all:z.length
  };
}
function isTerminal(s){return s==='dokonceno'||s==='zamitnuto'}
function renderSide(){
  var c=counts(), h='';
  function chip(key,label,n,cls){return '<button class="chip'+(FILTER===key?' act':'')+'" onclick="setFilter(\''+key+'\')"><span>'+label+'</span><span class="n">'+(n||0)+'</span></button>'}
  h+='<button class="chip'+(FILTER==='dash'?' act':'')+'" onclick="setFilter(\'dash\')"><span>Přehled</span></button>';
  h+='<div class="grp">Práce</div>';
  h+=chip('mine','Na tahu u mě',c.mine);
  if(ME.isAdmin||ME.role==='vykonny-reditel'||ME.role==='sef'){h+=chip('novy','Nové — rozdělit závod',c.novy);}
  if(ME.isAdmin||ME.role==='sef'){h+=chip('prideleni','K přidělení konstruktéra',c.prideleni);h+=chip('kontrola','Interní kontrola',c.kontrola);}
  if(ME.isAdmin||ME.role==='konstrukter'||ME.role==='sef'){h+=chip('prace','Ve zkreslení',c.prace);h+=chip('schvaleno','K výrobní dokumentaci',c.schvaleno);}
  if(ME.isAdmin||ME.role==='obchodnik'||ME.role==='sef'){h+=chip('obchodnik','U obchodníka',c.obchodnik);h+=chip('klient','U klienta',c.klient);}
  if(ME.isAdmin||ME.role==='vyrobni-reditel'||ME.role==='vykonny-reditel'||ME.role==='sef'||ME.role==='reditel'){h+=chip('vyroba','Ve výrobě',c.vyr);}
  h+='<div class="grp">Přehled</div>';
  h+=chip('red','Po termínu',c.red);
  h+=chip('open','Otevřené',c.open);
  h+=chip('all','Vše',c.all);
  h+='<button class="chip'+(FILTER==='workflow'?' act':'')+'" onclick="setFilter(\'workflow\')"><span>Postup (schéma)</span></button>';
  if(ME.isAdmin||ME.role==='sef'){h+='<div class="grp">Konstrukce</div>';h+='<button class="chip'+(FILTER==='kapacity'?' act':'')+'" onclick="setFilter(\'kapacity\')"><span>Kapacity</span></button>';}
  if(ME.isAdmin||ME.role==='reditel'){h+='<button class="chip'+(FILTER==='kpi'?' act':'')+'" onclick="setFilter(\'kpi\')"><span>KPI ředitele</span></button>';}
  if(ME.isAdmin||ME.role==='konstrukter'||ME.role==='sef'||ME.role==='reditel'){h+='<div class="grp">Evidence</div>';h+='<button class="chip'+(FILTER==='evidence'?' act':'')+'" onclick="setFilter(\'evidence\')"><span>Evidence práce</span></button>';}
  if(ME.isAdmin){h+='<div class="grp">Správa</div>';h+='<button class="chip'+(FILTER==='nastaveni'?' act':'')+'" onclick="setFilter(\'nastaveni\')"><span>Role a číselník</span></button>';h+='<button class="chip'+(FILTER==='platno'?' act':'')+'" onclick="setFilter(\'platno\')"><span>🧩 Pravidlo toku (plátno)</span></button>';}
  document.getElementById('side').innerHTML=h;
}
var NAVHIST=[];
function setFilter(f,isBack){ if(!isBack && f!==FILTER) NAVHIST.push(FILTER); FILTER=f; updateBack(); renderSide(); renderMain(); window.scrollTo(0,0); }
function goBack(){ if(NAVHIST.length){ setFilter(NAVHIST.pop(),true); } else setFilter('dash',true); }
function updateBack(){ var b=document.getElementById('backBtn'); if(b) b.style.display=(FILTER!=='dash')?'':'none'; }

/* ---- hlavní obsah ---- */
function filtered(){
  var z=D.zakazky.slice(), me=ME.email;
  if(FILTER==='mine')return z.filter(function(x){return x.responsible===me&&!isTerminal(x.stav)});
  if(FILTER==='novy')return z.filter(function(x){return x.stav==='novy'});
  if(FILTER==='prideleni')return z.filter(function(x){return x.stav==='prideleni'});
  if(FILTER==='prace')return z.filter(function(x){return x.stav==='prace'||x.stav==='revize'});
  if(FILTER==='kontrola')return z.filter(function(x){return x.stav==='kontrola'});
  if(FILTER==='obchodnik')return z.filter(function(x){return x.stav==='obchodnik'});
  if(FILTER==='klient')return z.filter(function(x){return x.stav==='klient'});
  if(FILTER==='schvaleno')return z.filter(function(x){return x.stav==='schvaleno'});
  if(FILTER==='vyroba')return z.filter(function(x){return x.stav==='dokonceno'});
  if(FILTER==='red')return z.filter(function(x){return x.semafor==='red'});
  if(FILTER==='open')return z.filter(function(x){return !isTerminal(x.stav)});
  return z;
}
function renderMain(){
  var m=document.getElementById('main');
  if(FILTER==='dash')return renderDash(m);
  if(FILTER==='kapacity')return renderKapacity(m);
  if(FILTER==='kpi')return renderKpi(m);
  if(FILTER==='workflow')return renderWorkflow(m);
  if(FILTER==='platno')return renderPlatno(m);
  if(FILTER==='evidence')return renderTimesheet(m);
  if(FILTER==='nastaveni')return renderNastaveni(m);
  var titleMap={mine:'Na tahu u mě',novy:'Nové — rozdělit do závodu',prideleni:'K přidělení konstruktéra',prace:'Ve zkreslení',kontrola:'Interní kontrola',obchodnik:'U obchodníka',klient:'U klienta',schvaleno:'K výrobní dokumentaci',vyroba:'Ve výrobě',red:'Po termínu',open:'Otevřené zakázky',all:'Všechny zakázky'};
  var list=filtered();
  var h='<div class="head"><h2>'+esc(titleMap[FILTER]||'Zakázky')+' <span class="muted" style="font-weight:400;font-size:15px">('+list.length+')</span></h2></div>';
  if(!list.length){h+='<div class="empty">Žádné zakázky v této složce.</div>';m.innerHTML=h;return}
  list.forEach(function(z){h+=zkCard(z)});
  m.innerHTML=h;
}
var KDE={novy:'u konstrukce',prace:'u konstrukce',kontrola:'u konstrukce',revize:'u konstrukce',podklady:'u obchodníka',obchodnik:'u obchodníka',klient:'u klienta',schvaleno:'u obchodníka',vyroba:'ve výrobě',stredisko:'ve výrobě'};
function zkTimeline(z){
  var now=Date.now(), DAY=86400000, d=function(ms){return Math.max(0,Math.round(ms/DAY));};
  if(z.deadline && !isTerminal(z.stav) && now>z.deadline){
    var od=Math.round((now-z.deadline)/DAY), w=KDE[z.stav]||'', dw=(od===1?'den':(od>=2&&od<=4?'dny':'dní'));
    return '<div class="tl-late">⚠ Po termínu'+(w?' '+w:'')+' · <b>'+od+'</b> '+dw+'</div>';
  }
  var start=z.createdAt||now;
  var totalDays=d(now-start);
  var stepDays=z.stepStartedAt?d(now-z.stepStartedAt):null;
  var col=(z.semafor==='red')?'var(--red)':(z.semafor==='amber')?'var(--amber)':'var(--g3)';
  var bar, toTxt='';
  if(z.deadline && !isTerminal(z.stav)){
    var span=z.deadline-start, elapsed=now-start, over=now>z.deadline;
    var pct=span>0?Math.max(2,Math.min(100,elapsed/span*100)):(now>=z.deadline?100:2);
    var stepPct=(z.stepStartedAt&&span>0)?Math.max(0,Math.min(100,(z.stepStartedAt-start)/span*100)):null;
    var toDays=Math.round((z.deadline-now)/DAY);
    bar='<div class="tl-bar"><i class="tl-fill" style="width:'+pct.toFixed(1)+'%;background:'+(over?'var(--red)':col)+'"></i>'+
        (stepPct!=null?'<span class="tl-step" style="left:'+stepPct.toFixed(1)+'%"></span>':'')+'</div>'+
        '<div class="tl-ends"><span>poptávka '+fdate(start)+'</span><span>termín '+fdate(z.deadline)+'</span></div>';
    toTxt=over?('<span class="tl-n red"><b>'+Math.abs(toDays)+'</b><span class="lab">dní po termínu</span></span>')
              :('<span class="tl-n '+(z.semafor==='amber'?'amber':'green')+'"><b>'+toDays+'</b><span class="lab">dní do termínu</span></span>');
  } else {
    bar='<div class="tl-bar"><i class="tl-fill" style="width:100%;background:var(--line)"></i></div>';
    if(isTerminal(z.stav)) toTxt='<span class="tl-n"><b>&#8226;</b><span class="lab">'+esc(z.stavLabel)+'</span></span>';
  }
  return '<div class="tl">'+bar+'<div class="tl-nums">'+
    '<span class="tl-n"><b>'+totalDays+'</b><span class="lab">dní od poptávky</span></span>'+
    (stepDays!=null?'<span class="tl-n"><b>'+stepDays+'</b><span class="lab">dní &middot; '+esc(z.stavLabel)+'</span></span>':'')+
    toTxt+'</div></div>';
}
function zkCard(z){
  var right=(z.deadline&&!isTerminal(z.stav)&&z.stav!=='schvaleno')?('<span class="muted" style="font-size:12.5px">termín '+fdate(z.deadline)+'</span>'):'';
  return '<div class="card zk" onclick="openDrawer(\''+z.id+'\')">'+
    '<div class="row" style="justify-content:space-between">'+
      '<div class="row"><span class="dot '+z.semafor+'"></span><div><div class="t">'+esc(z.cislo)+' · '+esc(z.zakaznik)+'</div>'+
      '<div class="sub">'+esc(z.typName)+' · v'+(z.versionCount||0)+(z.assignedName?(' · '+esc(z.assignedName)):'')+'</div></div></div>'+
      '<div style="text-align:right"><span class="pill '+z.stav+'">'+esc(z.stavLabel)+'</span><div class="sub" style="margin-top:4px">'+esc(z.responsibleName||'—')+' '+right+'</div></div>'+
    '</div>'+zkTimeline(z)+'</div>';
}

/* ---- kapacity ---- */
function renderKapacity(m){
  var h='<div class="head"><h2>Kapacity konstruktérů</h2></div>';
  var k=D.kapacita||[];
  if(!k.length){h+='<div class="empty">Zatím nejsou přiřazeni žádní konstruktéři. Přiřaďte role v sekci <b>Role a číselník</b>.</div>';m.innerHTML=h;return}
  h+='<div class="card">';
  k.forEach(function(r){
    var col=r.vytizeni>=100?'var(--red)':(r.vytizeni>=70?'var(--amber)':'var(--g3)');
    h+='<div class="cap"><div style="width:170px"><b>'+esc(r.name)+'</b><div class="sub">'+r.tasks+' úkolů · '+r.nh+' Nh · fond '+r.fondTyden+' h/týd</div></div>'+
       '<div class="capbar"><i style="width:'+Math.min(100,r.vytizeni)+'%;background:'+col+'"></i></div><div style="width:52px;text-align:right;font-weight:700;color:'+col+'">'+r.vytizeni+'%</div></div>';
  });
  h+='</div><p class="muted">Vytížení = zbývající normohodiny přidělených úkolů vůči dostupnému fondu. Nejméně vytížený je nahoře — jeho systém doporučuje při přidělování.</p>';
  m.innerHTML=h;
}

/* ---- KPI ---- */
function renderKpi(m){
  var z=D.zakazky;
  var done=z.filter(function(x){return x.stav==='dokonceno'||x.stav==='schvaleno'});
  var leads=[];
  z.forEach(function(x){
    var appr=(x.audit||[]).find(function(a){return a.action==='Klient schválil'});
    if(appr)leads.push((appr.at-x.createdAt)/86400000);
  });
  var avgLead=leads.length?(leads.reduce(function(a,b){return a+b},0)/leads.length):0;
  var revs=z.map(function(x){return x.revisionCount||0});
  var avgRev=revs.length?(revs.reduce(function(a,b){return a+b},0)/revs.length):0;
  var overdue=z.filter(function(x){return x.semafor==='red'}).length;

/* ---- Ganttův timeline cílových dob fází ---- */
var PHASES=[{k:'obchod',lab:'Obchod',col:'#2a78d6'},{k:'konstrukce',lab:'Konstrukce',col:'#008300'},{k:'schvaleni',lab:'Schválení',col:'#d55181'},{k:'vyroba',lab:'Zadání do výroby',col:'#c98500'}];
function ganttSetup(pd,pa){
  var tgt=PHASES.map(function(p){return Math.max(0,Number(pd[p.k])||0)});
  var act=PHASES.map(function(p){return (pa[p.k]==null?null:Math.max(0,Number(pa[p.k])||0))});
  var totT=tgt.reduce(function(a,b){return a+b},0);
  var totA=act.reduce(function(a,b){return a+(b||0)},0);
  var maxDay=Math.max(totT,totA,1);
  var step=Math.max(1,Math.ceil(maxDay/6));
  var ticks=[]; for(var v=0;v<=maxDay+0.001;v+=step)ticks.push(Math.round(v*10)/10); if(ticks[ticks.length-1]<maxDay)ticks.push(maxDay);
  var pct=function(x){return (x/maxDay*100)};
  // osa
  var axis='<div class="gantt-row gantt-axis"><div class="gantt-lab"></div><div class="gantt-track">';
  ticks.forEach(function(t){axis+='<div class="gantt-grid" style="left:'+pct(t)+'%"></div><div class="gantt-tick" style="left:'+pct(t)+'%">'+t+'</div>'});
  axis+='</div><div class="gantt-sum"></div></div>';
  // stavba jednoho pruhu (plán / skutečnost)
  var bar=function(vals,lab,total,cls){
    var segs=''; var cum=0;
    for(var i=0;i<PHASES.length;i++){
      var dv=vals[i]; if(dv==null||dv<=0){ if(dv==null&&cls==='act'){} continue; }
      var w=pct(dv), left=pct(cum), gap=(i<PHASES.length-1)?2:0;
      var show=(w>7);
      segs+='<div class="gantt-seg '+cls+'" title="'+esc(PHASES[i].lab)+' — '+dv+' prac. dní" style="left:'+left+'%;width:calc('+w+'% - '+gap+'px);background:'+PHASES[i].col+'">'+(show?dv:'')+'</div>';
      cum+=dv;
    }
    var grid=''; ticks.forEach(function(t){grid+='<div class="gantt-grid" style="left:'+pct(t)+'%"></div>'});
    return '<div class="gantt-row"><div class="gantt-lab">'+lab+'</div><div class="gantt-track"><div class="gantt-plot"></div>'+grid+segs+'</div>'+
      '<div class="gantt-sum">'+(total==null?'—':total)+' d<span class="lab">celkem</span></div></div>';
  };
  var g='<div class="gantt">'+axis+
    bar(tgt,'Plán (cíl)',totT,'plan')+
    bar(act,'Skutečnost&nbsp;(Ø)',(totA?Math.round(totA*10)/10:(pa.total!=null?pa.total:null)),'act')+
    '</div>';
  // legenda s cílovými dny — ODVOZENÉ z lhůt kroků (Postup / Role a číselník), jen pro čtení
  var STEPS={obchod:'Přidělení',konstrukce:'Zkreslení + Interní kontrola',schvaleni:'Potvrzení + U klienta',vyroba:'Předání + Ve středisku'};
  var leg='<div class="ph-legend">';
  PHASES.forEach(function(p){
    var a=pa[p.k];
    leg+='<div class="ph-item"><div class="nm"><span class="dotc" style="background:'+p.col+'"></span>'+esc(p.lab)+'</div>'+
      '<div class="ctl"><b style="font-size:16px">'+(pd[p.k]!=null?pd[p.k]:'—')+'</b> <span class="muted">prac. dní (cíl)</span></div>'+
      '<div class="sub">z kroků: '+esc(STEPS[p.k]||'')+'</div>'+
      '<div class="sub">Ø skutečně: '+(a==null?'—':a+' prac. dní')+'</div></div>';
  });
  leg+='</div>';
  return g+leg;
}

/* ================= PLÁTNO — pravidlo toku (workflow editor) ================= */
var PL={wf:null,sel:null,dirty:false,conn:null,drag:null,full:false};
var PL_LHUTY=[['','bez termínu'],['lhutaPrideleniDays','Přidělení (od zadání)'],['lhutaZkresleniDays','Zkreslení (od zadání)'],['lhutaKontrolaDays','Kontrola (od zadání)'],['lhutaObchodnikDays','Obchodník (od zadání)'],['lhutaKlientDays','Klient (od zadání)'],['lhutaVyrobaDays','Výrobní dok. (od zadání)'],['lhutaRevizeDays','Revize (od zahájení)']];
var PL_PHASES=[['','—'],['obchod','Obchod'],['konstrukce','Konstrukce'],['schvaleni','Schválení'],['vyroba','Výroba']];
var PL_KINDS=[['start','Start (zadání)'],['normal','Běžný krok'],['klient','Klient (veřejný náhled)'],['hold','Pozastavení'],['end','Konec (terminál)']];
var PL_EKINDS=[['forward','Vpřed'],['reject','Zamítnout / vrátit'],['revize','Revize'],['hold','Pozastavit'],['self','Beze změny stavu'],['klient','Klient'],['system','Systém']];
function plRoles(){var r=D.roleLabels||{obchodnik:'Obchodník',sef:'Šéf konstrukce',konstrukter:'Konstruktér',reditel:'Ředitel','vykonny-reditel':'Výkonný ředitel výroby',klient:'Klient'};return r;}
function plRoleLabel(r){return (D.roleLabels&&D.roleLabels[r])||r||'—';}
function plClone(o){return JSON.parse(JSON.stringify(o))}
function plNode(id){return (PL.wf.nodes||[]).find(function(n){return n.id===id})}
function plNodeColor(n){
  if(n.terminal||n.kind==='end')return '#546e7a';
  if(n.hold||n.kind==='hold')return 'var(--amber)';
  var r=n.onTurn;
  if(n.kind==='klient'||r==='klient')return 'var(--g)';
  if(r==='sef')return 'var(--purple)';
  if(r==='konstrukter')return '#e65100';
  if(r==='obchodnik')return 'var(--blue)';
  if(r==='vykonny-reditel'||r==='vyrobni-reditel')return '#00838f';
  return 'var(--gray)';
}
function plEdgeColor(k){return {forward:'var(--g)',reject:'var(--red)',revize:'var(--amber)',hold:'#b06f00',self:'var(--gray)',klient:'var(--blue)',system:'#90a4ae'}[k]||'var(--g)'}
function plInit(){PL.wf=plClone(D.workflow||{nodes:[],edges:[]});PL.sel=null;PL.dirty=false;PL.conn=null;}
function plDrawable(e){return e.from&&e.from!=='*'&&plNode(e.from)&&e.to&&String(e.to).charAt(0)!=='@'&&plNode(e.to);}

function renderPlatno(m){

    '<button class="btn sm ghost" onclick="plReset()">Zahodit změny</button>'+
    '<button class="btn sm ghost" onclick="plSeed()">Obnovit výchozí (seed)</button>'+

    dirty+'</div>';

    '<p class="muted" style="margin:0 0 8px;font-size:12.5px">Táhni uzel za hlavičku, plátno posuneš tažením prázdné plochy, přechod nakreslíš tažením ze zeleného kolečka. Klikni na uzel/šipku pro úpravu. Změny se projeví v reálném toku po uložení.</p>'+
    tb+legend+
    '<div class="pl-wrap">'+stage+'<div class="pl-insp hidden" id="plInsp"></div></div>'+

function plNodeHtml(n){
  var col=plNodeColor(n);
  var sel=(PL.sel&&PL.sel.t==='node'&&PL.sel.id===n.id)?' sel':'';
  var sub=[];
  sub.push('<b>'+esc(plRoleLabel(n.onTurn))+'</b>');
  if(n.phase)sub.push(esc((PL_PHASES.find(function(p){return p[0]===n.phase})||['',n.phase])[1]));
  var kindLbl=(PL_KINDS.find(function(k){return k[0]===n.kind})||['','']);
  var tag=n.terminal?'konec':(n.hold?'pauza':(n.kind==='start'?'start':(n.kind==='klient'?'klient':'')));
  return '<div class="pl-node'+sel+'" id="pln_'+esc(n.id)+'" data-id="'+esc(n.id)+'" style="left:'+(n.x||20)+'px;top:'+(n.y||20)+'px">'+
    '<div class="hd" style="background:'+col+'" data-drag="'+esc(n.id)+'"><span>'+esc(n.label||n.id)+'</span>'+(tag?'<span class="pl-badge">'+esc(tag)+'</span>':'')+'</div>'+
    '<div class="bd">'+sub.join(' · ')+'</div>'+
    '<div class="pl-dot" data-dot="'+esc(n.id)+'" title="Táhni pro spojení"></div></div>';
}
function plNodeAnchor(id,side){
  var el=document.getElementById('pln_'+id);if(!el)return null;
  var x=el.offsetLeft,y=el.offsetTop,w=el.offsetWidth,h=el.offsetHeight;
  if(side==='r')return {x:x+w,y:y+h/2};
  if(side==='l')return {x:x,y:y+h/2};
  if(side==='t')return {x:x+w/2,y:y};
  if(side==='b')return {x:x+w/2,y:y+h};
  return {x:x+w/2,y:y+h/2};
}
function plDrawEdges(){
  var svg=document.getElementById('plSvg');if(!svg)return;
  // vyčisti staré cesty (nech defs)
  Array.prototype.slice.call(svg.querySelectorAll('.pl-edge,.pl-edge-hit,.pl-elabel')).forEach(function(e){e.remove()});
  (PL.wf.edges||[]).forEach(function(e,i){
    if(!plDrawable(e))return;
    var a,b,path;
    if(e.to===e.from){ // self-smyčka nahoře
      var t=plNodeAnchor(e.from,'t');if(!t)return;
      path='M'+(t.x-16)+','+t.y+' C'+(t.x-30)+','+(t.y-46)+' '+(t.x+30)+','+(t.y-46)+' '+(t.x+16)+','+t.y;
      a={x:t.x-16,y:t.y}; b={x:t.x+16,y:t.y}; var lx=t.x,ly=t.y-40;
    }else{
      var s=plNode(e.from),d=plNode(e.to);
      var down=(d.y||0)>=(s.y||0)-30;
      a=plNodeAnchor(e.from, ((d.x||0)>=(s.x||0))?'r':'l');
      b=plNodeAnchor(e.to, ((d.x||0)>=(s.x||0))?'l':'r');
      if(!a||!b)return;
      var dx=Math.max(40,Math.abs(b.x-a.x)/2);
      path='M'+a.x+','+a.y+' C'+(a.x+dx)+','+a.y+' '+(b.x-dx)+','+b.y+' '+b.x+','+b.y;
      var lx=(a.x+b.x)/2,ly=(a.y+b.y)/2-6;
    }
    var col=plEdgeColor(e.kind);
    var hit=document.createElementNS('http://www.w3.org/2000/svg','path');
    hit.setAttribute('class','pl-edge-hit');hit.setAttribute('d',path);hit.setAttribute('data-ei',i);
    hit.addEventListener('click',function(){PL.sel={t:'edge',i:i};plRefresh();});
    svg.appendChild(hit);
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','pl-edge');p.setAttribute('d',path);p.setAttribute('stroke',col);
    p.setAttribute('marker-end','url(#plArrow)');
    if(e.kind==='reject'||e.kind==='revize')p.setAttribute('stroke-dasharray','6 4');
    if(PL.sel&&PL.sel.t==='edge'&&PL.sel.i===i){p.setAttribute('stroke-width','3.6');}
    p.addEventListener('click',function(){PL.sel={t:'edge',i:i};plRefresh();});
    svg.appendChild(p);
    var lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('class','pl-elabel');lbl.setAttribute('x',lx);lbl.setAttribute('y',ly);lbl.setAttribute('text-anchor','middle');
    lbl.textContent=e.label||e.action;
    lbl.addEventListener('click',function(){PL.sel={t:'edge',i:i};plRefresh();});
    svg.appendChild(lbl);
  });
}
function plRefresh(){ // překreslí uzly (výběr/barvy), hrany i inspektor bez ztráty PL.wf
  var canvas=document.getElementById('plCanvas');if(!canvas){renderMain();return}
  // aktualizuj třídy výběru na uzlech
  (PL.wf.nodes||[]).forEach(function(n){var el=document.getElementById('pln_'+n.id);if(el)el.className='pl-node'+((PL.sel&&PL.sel.t==='node'&&PL.sel.id===n.id)?' sel':'');});
  plDrawEdges();plRenderInsp();
  var dd=document.querySelector('.pl-dirty');
  if(PL.dirty&&!dd){var tb=document.querySelector('.pl-tb');if(tb)tb.insertAdjacentHTML('beforeend','<span class="pl-dirty">● neuložené změny</span>');}
}
function plWireCanvas(){
  var canvas=document.getElementById('plCanvas');if(!canvas)return;
  canvas.addEventListener('mousedown',function(ev){
    var dotEl=ev.target.closest?ev.target.closest('[data-dot]'):null;
    if(dotEl){ev.preventDefault();plStartConn(dotEl.getAttribute('data-dot'),ev);return;}
    var dragEl=ev.target.closest?ev.target.closest('[data-drag]'):null;
    if(dragEl){ev.preventDefault();plStartDrag(dragEl.getAttribute('data-drag'),ev);return;}
    // klik/tažení do prázdna = posun plátna (pan) + zrušení výběru
    if(!ev.target.closest||!ev.target.closest('.pl-node')){plStartPan(ev);}
  });
}
function plStartPan(ev){
  var stage=document.getElementById('plStage');if(!stage)return;
  var sx=ev.clientX,sy=ev.clientY,sl=stage.scrollLeft,st=stage.scrollTop,moved=false;
  stage.classList.add('panning');ev.preventDefault();
  function mm(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;stage.scrollLeft=sl-dx;stage.scrollTop=st-dy;}
  function mu(){document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);stage.classList.remove('panning');if(!moved){PL.sel=null;plRefresh();}}
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}
function plStartDrag(id,ev){
  var n=plNode(id);if(!n)return;
  var sx=ev.clientX,sy=ev.clientY,ox=n.x||0,oy=n.y||0,moved=false;
  var el=document.getElementById('pln_'+id);
  document.body.style.cursor='grabbing';
  function mm(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;n.x=Math.max(0,Math.round(ox+dx));n.y=Math.max(0,Math.round(oy+dy));el.style.left=n.x+'px';el.style.top=n.y+'px';plDrawEdges();}
  function mu(){document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);document.body.style.cursor='';if(moved){PL.dirty=true;}PL.sel={t:'node',id:id};plRefresh();}
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}
function plFull(){PL.full=!PL.full;document.body.style.overflow=PL.full?'hidden':'';renderMain();}
function plStartConn(id,ev){
  var canvas=document.getElementById('plCanvas'),svg=document.getElementById('plSvg');
  var start=plNodeAnchor(id,'r');
  var tmp=document.createElementNS('http://www.w3.org/2000/svg','path');
  tmp.setAttribute('class','pl-edge');tmp.setAttribute('stroke','var(--g3)');tmp.setAttribute('stroke-dasharray','5 4');tmp.setAttribute('marker-end','url(#plArrow)');
  svg.appendChild(tmp);
  var rect=canvas.getBoundingClientRect();
  function mm(e){var mx=e.clientX-rect.left+canvas.parentNode.scrollLeft,my=e.clientY-rect.top+canvas.parentNode.scrollTop;tmp.setAttribute('d','M'+start.x+','+start.y+' L'+mx+','+my);}
  function mu(e){
    document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);tmp.remove();
    var tgt=e.target.closest?e.target.closest('.pl-node'):null;
    if(tgt){var to=tgt.getAttribute('data-id');plAddEdge(id,to);}
  }
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}
function plAddEdge(from,to){
  PL.wf.edges.push({action:'akce'+(PL.wf.edges.length+1),from:from,to:to,roles:[],kind:(from===to?'self':'forward'),source:'user',label:'nový přechod',needNote:false});
  PL.dirty=true;PL.sel={t:'edge',i:PL.wf.edges.length-1};plRefresh();
}
function plAddNode(){
  var id='stav'+(PL.wf.nodes.length+1),i=1;while(plNode(id)){i++;id='stav'+(PL.wf.nodes.length+i);}
  PL.wf.nodes.push({id:id,label:'Nový stav',onTurn:'konstrukter',kind:'normal',phase:'konstrukce',x:60,y:420});
  PL.dirty=true;PL.sel={t:'node',id:id};renderMain();
}
function plField(label,html){return '<label>'+esc(label)+'</label>'+html}
function plSelect(val,opts,onchange){return '<select onchange="'+onchange+'">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val||'')?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>'}
function plRenderInsp(){

function plInspEdge(box){

function plNodeLbl(id){if(id===null)return '(zadání)';if(id==='*')return '(odkudkoli)';if(String(id).charAt(0)==='@')return id;var n=plNode(id);return n?(n.label||n.id):id;}
function plSetNode(k,v){var n=plNode(PL.sel.id);if(!n)return;if(v===null)delete n[k];else n[k]=v;PL.dirty=true;if(k==='label'){var el=document.getElementById('pln_'+n.id);if(el){el.querySelector('.hd span').textContent=v||n.id;}}else{plRefresh();}}
function plSetEdge(k,v){var e=PL.wf.edges[PL.sel.i];if(!e)return;e[k]=v;PL.dirty=true;if(k==='label'||k==='action'){plDrawEdges();}else{plRefresh();}}
function plSetEdgeRole(r,on){var e=PL.wf.edges[PL.sel.i];if(!e)return;e.roles=e.roles||[];var i=e.roles.indexOf(r);if(on&&i<0)e.roles.push(r);if(!on&&i>=0)e.roles.splice(i,1);PL.dirty=true;}
function plDelNode(){var n=plNode(PL.sel.id);if(!n)return;if(!confirm('Smazat stav "'+(n.label||n.id)+'" a jeho přechody?'))return;var id=n.id;PL.wf.nodes=PL.wf.nodes.filter(function(x){return x.id!==id});PL.wf.edges=PL.wf.edges.filter(function(x){return x.from!==id&&x.to!==id});PL.dirty=true;PL.sel=null;renderMain();}
function plDelEdge(){if(!confirm('Smazat tento přechod?'))return;PL.wf.edges.splice(PL.sel.i,1);PL.dirty=true;PL.sel=null;renderMain();}
function plReset(){if(PL.dirty&&!confirm('Zahodit neuložené změny a načíst uložené pravidlo?'))return;plInit();renderMain();}
function plSeed(){api('/admin/workflow','GET').then(function(o){if(!o.ok){alert('Nelze načíst seed.');return}if(!confirm('Nahradit plátno výchozím (seed) pravidlem? Neuloží se, dokud nekliknete Uložit.'))return;PL.wf=plClone(o.j.seed);PL.sel=null;PL.dirty=true;renderMain();});}
function plSave(){
  api('/admin/workflow','POST',{workflow:PL.wf}).then(function(o){
    if(!o.ok){alert('Uložení selhalo: '+((o.j&&o.j.chyba)||'chyba'));return}
    PL.dirty=false;
    reloadData();
    setTimeout(function(){PL.wf=plClone(D.workflow);PL.sel=null;renderMain();},60);
    alert('Pravidlo toku uloženo. Projeví se v reálném workflow.');
  });
}

function stepDays(z){
  var order=['novy','prideleni','prace','kontrola','obchodnik','klient','schvaleno','dokonceno'];
  var starts={novy:z.createdAt};
  var map=[['Rozděleno do závodu','prideleni'],['Přidělení','prace'],['Zkreslení hotovo','kontrola'],['Interní kontrola OK','obchodnik'],['Odesláno klientovi','klient'],['Klient schválil','schvaleno']];
  (z.audit||[]).forEach(function(a){
    var ac=a.action||'';
    map.forEach(function(m){if(ac.indexOf(m[0])>=0)starts[m[1]]=a.at});
    if(ac.indexOf('výrobní dokumentace')>=0||ac.indexOf('Vyrobeno')>=0||ac.indexOf('Dokončeno')>=0)starts.dokonceno=a.at;
  });
  var days={};
  order.forEach(function(k,i){
    if(starts[k]==null||k==='dokonceno')return;
    var end=null;
    for(var j=i+1;j<order.length;j++){if(starts[order[j]]!=null){end=starts[order[j]];break}}
    if(end==null)end=Date.now();
    days[k]=Math.max(0,Math.round((end-starts[k])/86400000));
  });
  return days;
}
function stepFlow(z){
  var stages=[{k:'novy',l:'Rozdělení do závodu',r:'vyr'},{k:'prideleni',l:'Přidělení',r:'sef'},{k:'prace',l:'Zkreslení',r:'kon'},{k:'kontrola',l:'Kontrola',r:'sef'},{k:'obchodnik',l:'Obchodník',r:'obch'},{k:'klient',l:'U klienta',r:'kli'},{k:'schvaleno',l:'Výrobní dok.',r:'kon'},{k:'dokonceno',l:'Ve výrobě',r:'sys'}];
  var order=stages.map(function(s){return s.k});
  var cur=z.stav, eff=cur;
  if(cur==='revize')eff='prace';
  if(cur==='podklady')eff=z.prevStav||'prace';
  if(cur==='zamitnuto')eff='';
  var ci=order.indexOf(eff);
  var days=stepDays(z);
  var h='<div class="flow">';
  stages.forEach(function(s,i){
    var cls='st';
    if(ci>=0&&i<ci)cls+=' done';
    else if(i===ci)cls+=' cur r-'+s.r;
    var label=s.l;
    if(i===ci&&cur==='revize')label='Revize v'+z.versionCount;
    if(s.k==='novy'&&z.strediskoName)label='Závod: '+z.strediskoName;
    var dtxt=(days[s.k]!=null)?(' <span class="dd">'+days[s.k]+' d</span>'):'';
    h+=(i?'<span class="arw">→</span>':'')+'<span class="'+cls+'"><span class="rd"></span>'+esc(label)+dtxt+'</span>';
  });
  h+='</div>';
  if(cur==='podklady')h+='<div style="margin:-4px 0 8px;color:var(--amber);font-size:13px;font-weight:600">⏸ Pozastaveno — čeká na podklady'+(z.holdReason?': '+esc(z.holdReason):'')+'</div>';
  if(cur==='zamitnuto')h+='<div style="margin:-4px 0 8px;color:var(--red);font-size:13px;font-weight:600">✕ Zamítnuto / storno</div>';
  return h;
}

/* ---- akce dle role a stavu ---- */
function actionsFor(z){
  var me=ME, h='', canObch=me.isAdmin||(me.role==='obchodnik'&&z.obchodnikEmail===me.email);
  var canSef=me.isAdmin||me.role==='sef';
  var canKon=me.isAdmin||(me.role==='konstrukter'&&z.assignedTo===me.email);
  var canVyr=me.isAdmin||me.role==='vyrobni-reditel';
  var canVykonny=me.isAdmin||me.role==='vykonny-reditel';
  var blocks=[];

  if(z.stav==='novy'&&(canVykonny||canSef)){blocks.push(rozdelZavodBlock(z))}
  if(z.stav==='prideleni'&&canSef){blocks.push(assignBlock(z))}

  if((z.stav==='prace'||z.stav==='revize')&&canKon){blocks.push(konstrukterBlock(z))}
  if((z.stav==='prace'||z.stav==='revize')&&canSef&&!canKon){blocks.push('<div class="actions">'+assignReassign(z)+'</div>')}

  if(z.stav==='kontrola'&&canSef){blocks.push(
    '<div class="card" style="background:#faf7fc"><b>Interní kontrola</b>'+
    '<textarea id="kontrolaNote" rows="2" placeholder="Komentář (u vrácení povinný)…" style="margin-top:6px"></textarea>'+
    '<div class="actions"><button class="btn sm" onclick="doAction(\''+z.id+'\',\'kontrola-ok\',\'kontrolaNote\')">✓ V pořádku → obchodník</button>'+
    '<button class="btn warn sm" onclick="doAction(\''+z.id+'\',\'kontrola-vrat\',\'kontrolaNote\')">↩ Vrátit konstruktérovi</button></div></div>')}

  if(z.stav==='obchodnik'&&canObch){blocks.push(obchodnikBlock(z))}

  if(z.stav==='klient'&&canObch){blocks.push(
    '<div class="card" style="background:#eef7f0"><b>U klienta</b><p class="muted" style="margin:6px 0">Odkaz odeslán klientovi'+(z.link?(', platí do '+fdate(z.link.expiresAt)+', '+z.link.accesses+'× otevřen'):'')+'. Čekáme na jeho rozhodnutí.</p>'+
    '<div class="actions"><button class="btn ghost sm" onclick="copyLink(\''+(z.link?z.link.url:'')+'\')">Kopírovat odkaz</button>'+
    '<button class="btn warn sm" onclick="askStorno(\''+z.id+'\')">Storno</button></div></div>')}

  if(z.stav==='schvaleno'&&(canKon||canSef)){blocks.push(vyrobniDokBlock(z))}

  // pozastavení / obnovení
  if(!isTerminal(z.stav)&&z.stav!=='schvaleno'){
    if(z.stav==='podklady'&&(canObch||canSef))blocks.push('<div class="actions"><button class="btn sm" onclick="doAction(\''+z.id+'\',\'unhold\')">▶ Podklady doplněny — pokračovat</button></div>');
    else if(z.stav!=='podklady'&&(canObch||canSef))blocks.push('<div class="actions" style="margin-top:4px"><button class="btn ghost sm" onclick="askHold(\''+z.id+'\')">⏸ Čeká na podklady</button>'+((canObch||canSef)?'<button class="btn ghost sm" onclick="askTermin(\''+z.id+'\')">Změnit termín</button>':'')+((me.role==='obchodnik'||me.role==='reditel'||me.isAdmin)?'<button class="btn warn sm" onclick="askStorno(\''+z.id+'\')">Storno</button>':'')+'</div>');
  }
  h=blocks.join('');
  return h;
}

  return '<div class="card" style="background:#fff8f0"><b>Zkreslení výkresu'+(z.stav==='revize'?' (revize v'+(z.versionCount)+')':'')+'</b>'+

function flash(z){}
function doAction(id,action,noteId){
  var note=noteId?(document.getElementById(noteId)||{}).value||'':'';
  api('/stav','POST',{id:id,action:action,note:note}).then(function(o){
    if(!o.ok){alert(o.j.chyba||'Chyba.');return}
    reloadData();
  });
}
function assign(id,selId){
  var k=(document.getElementById(selId)||{}).value;
  if(!k){alert('Vyberte konstruktéra.');return}
  api('/prideli','POST',{id:id,konstrukter:k}).then(function(o){if(!o.ok){alert(o.j.chyba||'Chyba.');return}reloadData()});
}
function addComment(id){
  var t=(document.getElementById('cmtx')||{}).value||'';if(!t.trim())return;
  api('/komentar','POST',{id:id,text:t}).then(function(o){if(!o.ok){alert(o.j.chyba||'Chyba.');return}reloadData()});
}
function timer(id,action){api('/timer','POST',{id:id,action:action}).then(function(o){if(!o.ok){alert(o.j.chyba);return}reloadData()})}
function manualTime(id){var m=prompt('Kolik minut připsat?');if(!m)return;api('/timer','POST',{id:id,action:'manual',minutes:parseInt(m,10)}).then(function(){reloadData()})}
function uploadFile(id,kind,inp){
  var f=inp.files[0];if(!f)return;
  var errEl=document.getElementById('upErr_'+id);if(errEl)errEl.textContent='Nahrávám '+f.name+'…';
  var rd=new FileReader();
  rd.onload=function(){
    api('/upload','POST',{id:id,kind:kind,name:f.name,dataUrl:rd.result}).then(function(o){
      if(!o.ok){if(errEl)errEl.textContent=o.j.chyba||'Chyba nahrání.';return}
      if(errEl)errEl.textContent='';reloadData();
    });
  };
  rd.readAsDataURL(f);
}
function sendClient(id){
  var mail=(document.getElementById('clMail_'+id)||{}).value||'';
  var pin=(document.getElementById('clPin_'+id)||{}).value||'';
  var text=(document.getElementById('clText_'+id)||{}).value||'';
  var errEl=document.getElementById('sendErr_'+id);errEl.textContent='';
  // pokud změnil e-mail, uložíme přes komentář? — jednoduše pošleme rovnou, backend má kontaktEmail; upravený mail nepřepisujeme, ale respektujeme
  api('/stav','POST',{id:id,action:'odeslat-klientovi',text:text,pin:pin}).then(function(o){
    if(!o.ok){errEl.textContent=o.j.chyba||'Nepodařilo se odeslat.';return}
    reloadData();alert('Náhled odeslán klientovi.');
  });
}
function copyLink(url){var full=location.origin+url;navigator.clipboard&&navigator.clipboard.writeText(full);prompt('Odkaz pro klienta (Ctrl+C):',full)}
function askStorno(id){var d=prompt('Důvod storna:');if(!d)return;api('/stav','POST',{id:id,action:'storno',note:d}).then(function(o){if(!o.ok){alert(o.j.chyba);return}reloadData()})}
function askHold(id){var d=prompt('Na jaké podklady se čeká? (důvod)');if(!d)return;api('/stav','POST',{id:id,action:'hold',note:d}).then(function(o){if(!o.ok){alert(o.j.chyba);return}reloadData()})}

var DQ_LANG='cs', DQ_PREFILL=null, DQ_ART='', KAT=null;
function ensureKat(cb){ if(KAT){cb&&cb();return;} fetch('/api/konstrukce/katalog',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){KAT=j.polozky||[];cb&&cb();}).catch(function(){KAT=[];cb&&cb();}); }
function artReset(){DQ_ART='';var i=document.getElementById('artInput');if(i)i.value='';var f=document.getElementById('artInfo');if(f)f.innerHTML='';artClose();}
function artLookup(inp){
  var dd=inp.parentNode.querySelector('.art-dd'); if(!dd)return;
  if(!KAT){ensureKat(function(){artLookup(inp);});return;}
  var tk=((document.getElementById('nTyp')||{}).value||'').toUpperCase();
  var rada=tk?('ABR-'+tk):'';
  var q=inp.value.trim().toLowerCase();
  var res=(KAT||[]).filter(function(x){ if(rada&&x.rada!==rada)return false; if(!q)return true; return (x.art+' '+(x.rozmery||'')+' '+x.provedeni+' '+(x.objem||'')+'m3').toLowerCase().indexOf(q)>=0; }).slice(0,14);
  if(!res.length){dd.style.display='none';return;}
  dd.innerHTML=res.map(function(x){return '<div class="art-i" onmousedown="artPick('+KAT.indexOf(x)+')"><b>'+esc(x.art)+'</b> <span class="art-prov">'+esc(x.provedeni)+'</span> <span class="muted">'+esc(x.rozmery||'')+' · '+(x.objem||'?')+' m³ · '+(x.hmotnost||'?')+' kg'+(x.pcCzk?' · '+x.pcCzk.toLocaleString('cs-CZ')+' Kč':'')+'</span></div>';}).join('');
  dd.style.display='block';
}
function artClose(){document.querySelectorAll('.art-dd').forEach(function(d){d.style.display='none'});}
function artPick(i){
  var x=KAT&&KAT[i]; if(!x)return;
  DQ_ART=x.art+(x.art.indexOf(x.provedeni)<0?' — '+x.provedeni:'');
  var inp=document.getElementById('artInput'); if(inp)inp.value=DQ_ART; artClose();
  var rz=document.getElementById('dq_rozmery'); if(rz&&x.rozmery)rz.value=x.rozmery;
  var seg=document.querySelector('.dq2[data-k="provedeni"]');
  if(seg&&x.provedeni){
    var std=seg.querySelector('.seg[data-v=standard]');
    var opceMatch=null;seg.querySelectorAll('.seg[data-v=opce]').forEach(function(o){if(!opceMatch&&((o.getAttribute('data-optval')||'')+' '+o.textContent).indexOf(x.provedeni)>=0)opceMatch=o;});
    if(std&&std.textContent.indexOf(x.provedeni)>=0)segClick(std);
    else if(opceMatch)segClick(opceMatch);
    else{var poz=seg.querySelector('.seg[data-v=pozadavek]');if(poz){segClick(poz);var rq=document.getElementById('dqr_provedeni');if(rq)rq.value=x.provedeni;}}
  }
  var info=document.getElementById('artInfo');
  if(info)info.innerHTML='<span class="art-tag">'+esc(x.rada)+'</span> '+esc(x.rozmery||'')+' · '+(x.objem||'?')+' m³ · '+(x.hmotnost||'?')+' kg · '+esc(x.provedeni)+(x.pcCzk?' · orient. '+x.pcCzk.toLocaleString('cs-CZ')+' Kč / '+(x.pcEur||'?')+' €':'');
}

var ADR_T=null;
function adrLookup(inp){
  var dd=inp.parentNode.querySelector('.adr-dd'); if(!dd)return;
  var q=inp.value.trim();
  var local=(D.adresy||[]).filter(function(a){return a.toLowerCase().indexOf(q.toLowerCase())>=0}).slice(0,4);
  renderAdrDD(dd,local,[],q.length>=3);
  clearTimeout(ADR_T);
  if(q.length<3)return;
  ADR_T=setTimeout(function(){
    fetch('/api/konstrukce/geocode?q='+encodeURIComponent(q)+'&lang='+(DQ_LANG==='cs'?'default':(DQ_LANG==='ua'?'uk':DQ_LANG)),{cache:'no-store'})
      .then(function(r){return r.json()}).then(function(j){renderAdrDD(dd,local,(j.items||[]),false)}).catch(function(){});
  },350);
}
function renderAdrDD(dd,local,osm,loading){
  var h='';
  local.forEach(function(a){h+=adrRow(a,'saved')});
  osm.forEach(function(a){if(local.indexOf(a)>=0)return;h+=adrRow(a,'osm')});
  if(loading&&!osm.length)h+='<div class="adr-load">'+esc(tr('hledám v OpenStreetMap…'))+'</div>';
  if(!h){dd.style.display='none';return}
  dd.innerHTML=h;dd.style.display='block';
}
function adrRow(a,kind){
  var tag=kind==='osm'?'<span class="adr-b osm">OSM</span>':'<span class="adr-b">'+(DQ_LANG==='en'?'saved':DQ_LANG==='de'?'gesp.':DQ_LANG==='pl'?'zapis.':DQ_LANG==='ua'?'збереж.':'uloženo')+'</span>';
  return '<div class="adr-i" onmousedown="adrPick(this)" data-v="'+esc(a)+'">'+tag+'<span>'+esc(a)+'</span></div>';

function adrPick(el){var o=el.closest('.dq-o');var inp=o.querySelector('input');inp.value=el.getAttribute('data-v');var dd=o.querySelector('.adr-dd');if(dd)dd.style.display='none';}

/* ---- evidence práce (timesheet) ---- */
function monthStart(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hnum(h){return (Math.round((h||0)*10)/10).toString().replace('.',',')}
function renderTimesheet(m){
  if(!TS.from){TS.from=monthStart();TS.to=todayStr()}
  m.innerHTML='<div class="head"><h2>Evidence práce</h2></div><p class="muted">Načítám…</p>';
  var qs='from='+TS.from+'&to='+TS.to+(TS.user?('&user='+encodeURIComponent(TS.user)):'');
  api('/timesheet?'+qs).then(function(o){
    if(!o.ok){m.innerHTML='<div class="empty">'+esc(o.j.chyba||'Chyba.')+'</div>';return}
    TS.data=o.j; drawTimesheet(m);
  });
}
function drawTimesheet(m){
  var j=TS.data, e=j.entries, all=j.me.canSeeAll;
  // souhrny
  var tot=0,zak=0,rez=0,days={};
  e.forEach(function(x){tot+=x.hours;if(x.kind==='zakazka')zak+=x.hours;else rez+=x.hours;days[x.date]=1});
  var nd=Object.keys(days).length;
  // reporty
  var byAct={},byZak={};
  e.forEach(function(x){byAct[x.activity]=(byAct[x.activity]||0)+x.hours;var k=x.zakCislo||x.zakazka;if(k)byZak[k]=(byZak[k]||0)+x.hours});
  var actRows=Object.keys(byAct).map(function(k){return [k,byAct[k]]}).sort(function(a,b){return b[1]-a[1]});
  var zakRows=Object.keys(byZak).map(function(k){return [k,byZak[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,15);

  var h='<div class="head"><h2>Evidence práce</h2><div class="row">'+
    '<input type="date" value="'+TS.from+'" onchange="TS.from=this.value;renderMain()" style="width:150px">'+
    '<span class="muted">–</span><input type="date" value="'+TS.to+'" onchange="TS.to=this.value;renderMain()" style="width:150px">'+
    (all?userFilter(j):'')+'</div></div>';

  // formulář zápisu
  h+=tsForm(j);

  // KPI karty
  h+='<div class="kpi">'+kc(hnum(tot)+' h','Celkem hodin')+kc(hnum(zak)+' h','Na zakázky')+kc(hnum(rez)+' h','Režie')+kc(nd,'Dní se zápisem')+kc(e.length,'Záznamů')+'</div>';

  // reporty
  h+='<div class="two"><div><div class="sec">Hodiny podle činnosti</div><div class="card">'+
    (actRows.length?actRows.map(function(r){return repRow(r[0],r[1],tot)}).join(''):'<p class="muted" style="margin:0">Žádná data.</p>')+'</div></div>'+
    '<div><div class="sec">Top zakázky podle hodin</div><div class="card">'+
    (zakRows.length?zakRows.map(function(r){return repRow(r[0],r[1],tot)}).join(''):'<p class="muted" style="margin:0">Žádná data.</p>')+'</div></div></div>';

  // seznam záznamů podle dní
  h+='<div class="sec">Záznamy ('+e.length+')</div>';
  if(!e.length)h+='<div class="empty">V tomto období nejsou žádné záznamy.</div>';
  else{
    var curd='';
    e.forEach(function(x){
      if(x.date!==curd){curd=x.date;h+='<div class="muted" style="font-weight:700;margin:12px 0 4px">'+fdate(new Date(x.date+'T00:00:00Z').getTime())+(all?'':'')+'</div>'}
      h+='<div class="card" style="padding:9px 12px;margin-bottom:6px"><div class="row" style="justify-content:space-between">'+
        '<div style="min-width:0"><b>'+esc(x.activity)+'</b> <span class="tag">'+(x.kind==='zakazka'?'zakázka':'režie')+'</span>'+
        (x.zakCislo||x.zakazka?'<div class="sub">'+esc(x.zakCislo||x.zakazka)+(x.percent!=null?(' · '+x.percent+' %'):'')+(x.note?(' · '+esc(x.note)):'')+'</div>':(x.note?'<div class="sub">'+esc(x.note)+'</div>':''))+
        (all?'<div class="sub" style="opacity:.7">'+esc(x.userName||x.user)+'</div>':'')+'</div>'+
        '<div class="row" style="gap:6px"><b style="white-space:nowrap">'+hnum(x.hours)+' h</b>'+
        ((all||x.user===ME.email)?'<button class="btn ghost sm" onclick="tsEdit(\''+x.id+'\')">Upravit</button><button class="btn warn sm" onclick="tsDelete(\''+x.id+'\')">×</button>':'')+'</div>'+
      '</div></div>';
    });
  }
  m.innerHTML=h;
}
function userFilter(j){
  var opts='<option value="">Všichni</option>';
  (j.users||[]).forEach(function(u){opts+='<option value="'+esc(u.email)+'"'+(TS.user===u.email?' selected':'')+'>'+esc(u.name)+' ('+hnum(u.hours)+' h)</option>'});

    '<div class="two" style="margin-top:8px"><div><label>Datum</label><input type="date" id="tsDate" value="'+(ed?ed.date:todayStr())+'"></div>'+
    '<div><label>Druh práce</label><select id="tsAct">'+actOpts+'</select></div></div>'+
    '<div class="two"><div><label>Zakázka (workflow)</label><select id="tsZak" onchange="if(this.value)document.getElementById(\'tsZakFree\').value=\'\'">'+zakOpts+'</select></div>'+
    '<div><label>…nebo vlastní kód zakázky</label><input id="tsZakFree" value="'+esc(ed?ed.zakazka:'')+'" placeholder="např. 25B876 nebo ABR-…"></div></div>'+
    '<div class="two">'+userSel+'<div class="two" style="gap:12px"><div><label>Hodiny</label><input id="tsHours" inputmode="decimal" value="'+(ed?hnum(ed.hours):'')+'" placeholder="2,5"></div><div><label>% dokončení</label><input id="tsPct" inputmode="numeric" value="'+(ed&&ed.percent!=null?ed.percent:'')+'" placeholder="volitelné"></div></div></div>'+
    '<label>Poznámka</label><input id="tsNote" value="'+esc(ed?ed.note:'')+'" placeholder="volitelné">'+
    '<div class="err" id="tsErr"></div>'+
    '<div class="actions" style="margin-top:10px"><button class="btn sm" onclick="tsSave()">'+(ed?'Uložit změny':'Přidat záznam')+'</button>'+(ed?'<button class="btn ghost sm" onclick="TS.editing=null;renderMain()">Zrušit úpravu</button>':'')+'</div></div>';
}
function tsSave(){
  function v(id){return (document.getElementById(id)||{}).value}
  var b={id:TS.editing?TS.editing.id:'',date:v('tsDate'),activityKey:v('tsAct'),zakId:v('tsZak'),zakazka:v('tsZakFree'),hours:v('tsHours'),percent:v('tsPct'),note:v('tsNote')};

}
function delActivity(key){if(!confirm('Smazat činnost z číselníku? (existující záznamy zůstanou)'))return;api('/admin/activity','POST',{key:key,delete:true}).then(function(){reloadData();renderMain()})}

function roleCard(title,role,people,desc,withFond,withGroups){
  var h='<div class="card"><b>'+esc(title)+'</b><p class="muted" style="margin:4px 0 8px">'+esc(desc)+'</p>';
  (people||[]).forEach(function(p){
    h+='<div style="padding:6px 0;border-bottom:1px solid var(--line)">'+
      '<div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap"><div style="min-width:170px"><b>'+esc(p.name)+'</b><div class="sub">'+esc(p.email)+'</div></div>'+
      (withFond?'<input type="number" style="width:130px" placeholder="fond h/týd" value="'+(p.fond||'')+'" onchange="setFond(\''+esc(p.email)+'\',this.value)">':'')+
      '<button class="btn ghost sm" onclick="setRole(\''+esc(p.email)+'\',\'\')">Odebrat</button></div>'+
      (withGroups?groupChecks(p):'')+
      '</div>';
  });
  if(!people||!people.length)h+='<p class="muted" style="margin:6px 0">Zatím nikdo.</p>';
  h+='<div class="row" style="margin-top:8px">'+personPicker('add_'+role,'','addRolePerson(\''+role+'\',this.value)','+ přidat osobu…')+'</div></div>';
  return h;

function groupChecks(p){
  var fams=D.families||[]; var g=p.groups||[];
  var boxes=fams.map(function(f){
    var ck=g.indexOf(f.key)>=0?' checked':'';
    return '<label style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#3a4a41"><input type="checkbox" style="width:auto" data-fam="'+esc(f.key)+'"'+ck+' onchange="saveKonstrGroups(\''+esc(p.email)+'\')"> '+esc(f.label)+'</label>';
  }).join('');
  return '<div class="kgrp" data-kemail="'+esc(p.email)+'" style="margin-top:7px"><div class="sub" style="margin-bottom:4px">Skupiny výrobků, které zpracovává <span class="muted">(nic zaškrtnuté = všechny)</span>:</div><div class="row" style="gap:8px 16px;flex-wrap:wrap">'+boxes+'</div></div>';
}
function saveKonstrGroups(email){
  var wrap=document.querySelector('.kgrp[data-kemail="'+email+'"]'); if(!wrap)return;
  var groups=[].slice.call(wrap.querySelectorAll('input[type=checkbox]:checked')).map(function(c){return c.getAttribute('data-fam')});
  api('/admin/konstrukter-groups','POST',{email:email,groups:groups}).then(function(o){if(!o.ok){alert((o.j&&o.j.chyba)||'Chyba');return} reloadData();});
}
function addRolePerson(role,email){if(!email)return;setRole(email,role)}
function setReditel(key,selId){var email=(document.getElementById(selId)||{}).value||'';api('/admin/stredisko','POST',{key:key,reditel:email}).then(function(o){if(!o.ok){alert(o.j.chyba);return}reloadData()})}
function editTyp(key){
  var t=(D.types||[]).find(function(x){return x.key===key})||{key:'',name:'',normohodiny:8,revizeNh:2,lhutaZkresleniDays:3,lhutaRevizeDays:2,lhutaPrideleniDays:1,lhutaKontrolaDays:1,lhutaObchodnikDays:1,lhutaKlientDays:5,linkValidDays:30,internalCheck:true,params:[]};
  var m=document.getElementById('modal');
  function num(id,l,v){return '<div><label>'+l+'</label><input id="'+id+'" type="number" value="'+(v==null?'':v)+'"></div>'}
  m.innerHTML='<div class="sheet"><h3>'+(key?'Upravit typ výrobku':'Nový typ výrobku')+'</h3>'+
    '<div class="two"><div><label>Klíč (bez mezer)</label><input id="tKey" value="'+esc(t.key)+'"'+(key?' readonly':'')+'></div><div><label>Název</label><input id="tName" value="'+esc(t.name)+'"></div></div>'+
    '<div class="two">'+num('tNh','Normohodiny zkreslení',t.normohodiny)+num('tRnh','Normohodiny revize',t.revizeNh)+'</div>'+
    '<div class="two">'+num('tZd','Lhůta zkreslení (dny)',t.lhutaZkresleniDays)+num('tRd','Lhůta revize (dny)',t.lhutaRevizeDays)+'</div>'+
    '<div class="two">'+num('tPd','Lhůta přidělení',t.lhutaPrideleniDays)+num('tKd','Lhůta kontroly',t.lhutaKontrolaDays)+'</div>'+
    '<div class="two">'+num('tOd','Lhůta obchodník',t.lhutaObchodnikDays)+num('tCd','Lhůta reakce klienta',t.lhutaKlientDays)+'</div>'+
    '<div class="two">'+num('tLv','Platnost odkazu (dny)',t.linkValidDays)+'<div><label>Interní kontrola</label><select id="tIc"><option value="1"'+(t.internalCheck?' selected':'')+'>ano (povinná)</option><option value="0"'+(!t.internalCheck?' selected':'')+'>ne</option></select></div></div>'+
    '<label>Parametry (jeden na řádek, formát: Název | příklad hodnot)</label><textarea id="tParams" rows="6">'+esc((t.params||[]).map(function(p){return p.label+' | '+(p.examples||'')}).join('\n'))+'</textarea>'+
    '<div class="err" id="tErr"></div>'+
    '<div class="actions" style="margin-top:14px"><button class="btn" onclick="saveTyp()">Uložit</button>'+(key&&t.key!=='abroll'?'<button class="btn warn" onclick="delTyp(\''+esc(key)+'\')">Smazat</button>':'')+'<button class="btn ghost" onclick="closeModal()">Zrušit</button></div></div>';
  m.classList.add('open');
}
function saveTyp(){
  function v(id){return (document.getElementById(id)||{}).value}
  var params=v('tParams').split('\n').map(function(l){var p=l.split('|');return {label:(p[0]||'').trim(),examples:(p[1]||'').trim()}}).filter(function(p){return p.label});
  var b={key:v('tKey'),name:v('tName'),normohodiny:v('tNh'),revizeNh:v('tRnh'),lhutaZkresleniDays:v('tZd'),lhutaRevizeDays:v('tRd'),lhutaPrideleniDays:v('tPd'),lhutaKontrolaDays:v('tKd'),lhutaObchodnikDays:v('tOd'),lhutaKlientDays:v('tCd'),linkValidDays:v('tLv'),internalCheck:v('tIc')==='1',params:params};
  if(!b.key||!b.name){document.getElementById('tErr').textContent='Vyplňte klíč i název.';return}
  api('/admin/typ','POST',b).then(function(o){if(!o.ok){document.getElementById('tErr').textContent=o.j.chyba;return}closeModal();reloadData()});
}
function delTyp(key){if(!confirm('Smazat typ výrobku?'))return;api('/admin/typ','POST',{key:key,delete:true}).then(function(){closeModal();reloadData()})}

document.addEventListener('click',function(e){var pop=document.getElementById('notifpop');if(pop.classList.contains('open')&&!pop.contains(e.target)&&!(e.target.closest('.iconbtn')))pop.classList.remove('open')});
reloadData();
</script>
</body>
