<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOXXER — poptávky a nabídky</title>
<style>
  :root{--green:#2f7d32;--green-d:#1f5e22;--ink:#12211a;--mut:#6b7a70;--line:#e2e8e0;--paper:#fff;--bg:#f4f7f2;--amber:#b96f00;--amber-soft:#fbf0dc;--red:#c0392b;--red-soft:#fbecea;--blue:#1e63c4;--blue-soft:#e8f0fb;--violet:#5b3fa0;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 20px 60px}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:21px;margin:0}
  .sub{color:var(--mut);font-size:13.5px;margin:4px 0 0}
  .btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:9px;padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--green-d)}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{background:#eef2ec}
  .btn.sm{padding:5px 10px;font-size:13px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:14px}
  /* statistiky */
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}
  @media(max-width:820px){.stats{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
  .st{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  .st .n{font-size:24px;font-weight:800;line-height:1}
  .st .l{font-size:11.5px;color:var(--mut);margin-top:5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
  .st.sell .n{color:var(--green-d)} .st.rent .n{color:var(--blue)} .st.off .n{color:var(--amber)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .req{border:1px solid var(--line);border-radius:14px;background:#fff;padding:15px 17px;margin-bottom:13px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .name{font-size:16px;font-weight:700}
  .contact{color:var(--mut);font-size:13px;margin-top:3px}
  .contact a{color:var(--green-d)}
  .zajem{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#eef2ec;color:var(--mut);margin-left:6px;text-transform:uppercase;letter-spacing:.03em}
  .zajem.koupe{background:#dff2e4;color:var(--green-d)} .zajem.pronajem{background:var(--blue-soft);color:var(--blue)}
  .badge{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .b-nova{background:var(--blue-soft);color:var(--blue)}
  .b-kontakt{background:var(--amber-soft);color:var(--amber)}
  .b-schuzka{background:#efeafb;color:var(--violet)}
  .b-nabidka{background:#e6eefb;color:#274b8f}
  .b-uzavreno{background:#dff2e4;color:var(--green-d)}
  .b-zamitnuto{background:var(--red-soft);color:var(--red)}
  .answers{margin-top:11px;border-collapse:collapse;width:100%}
  .answers td{padding:4px 12px 4px 0;font-size:13.5px;vertical-align:top}
  .answers td.k{color:var(--mut);white-space:nowrap;width:1%;font-size:12.5px}
  .answers td.v{font-weight:600}
  .zprava{margin-top:10px;padding:9px 12px;background:#f7f9f5;border-radius:8px;font-size:13.5px;line-height:1.6}
  .nab{margin-top:10px;padding:9px 12px;background:#eef5ea;border:1px solid #cfe0c2;border-radius:8px;font-size:13px}
  .assigned{margin-top:10px;font-size:13px}
  .assigned .who{font-weight:700;color:var(--green-d)}
  .actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
  .actions select,.actions input{font-family:inherit;font-size:13.5px;padding:6px 9px;border:1px solid var(--line);border-radius:8px}
  .actions input.note{flex:1;min-width:120px}
  .hist{margin-top:10px;font-size:12.5px;color:var(--mut)}
  .empty{color:var(--mut);padding:14px 2px}
  .lbl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#12211a;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>🔋 LOXXER — poptávky a nabídky</h1><p class="sub" id="sub">Načítám…</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn ghost sm" href="/loxxer/smlouva/prodej" target="_blank" rel="noopener">📄 Smlouva — prodej</a>
      <a class="btn ghost sm" href="/loxxer/smlouva/pronajem" target="_blank" rel="noopener">📄 Smlouva — pronájem</a>
      <button class="btn ghost sm" onclick="load()">↻ Obnovit</button>
    </div>
  </div>

  <div id="statsCard"></div>
  <div id="cfgCard"></div>
  <div class="filters" id="filters" style="display:none"></div>
  <div id="list"><p class="empty">Načítám…</p></div>
</div>
<div class="toast" id="toast"></div>

<script>
var STATE={items:[],role:{},stavy:{},nabidkaTypy:{},zajemy:{},stats:null,employees:[],notify:[],reditel:[],report:{},bg:false,filter:''};
var CFGOPEN=false;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2600)}
function fmtDate(ts){try{return new Date(ts).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return''}}

async function load(){
  try{
    var r=await fetch('/api/loxxer',{cache:'no-store'});
    if(!r.ok){ $('#list').innerHTML='<div class="card"><b>Chyba '+r.status+'</b></div>'; return; }
    var j=await r.json();
    STATE.items=j.items||[]; STATE.role=j.role||{}; STATE.stavy=j.stavy||{}; STATE.nabidkaTypy=j.nabidkaTypy||{}; STATE.zajemy=j.zajemy||{};
    STATE.stats=j.stats||null; STATE.employees=j.employees||[]; STATE.notify=j.notify||[]; STATE.reditel=j.reditel||[]; STATE.report=j.report||{}; STATE.bg=!!j.bg;
    render();
  }catch(e){ $('#list').innerHTML='<div class="card"><b>Chyba</b> — '+esc(e.message)+'</div>'; }
}

function render(){
  var role=STATE.role;
  $('#sub').textContent=role.isAdmin?'Poptávky z webu LOXXER. Přiřaďte obchodníka, zaznamenejte odeslané nabídky a sledujte stav.':(role.isReditel?'Přehled poptávek a odeslaných nabídek LOXXER.':'Poptávky LOXXER. Zpracujte přiřazené, zaznamenejte nabídku a aktualizujte stav.');
  renderStats();
  if(role.isAdmin) renderCfg(); else $('#cfgCard').innerHTML='';
  var fl=$('#filters'); fl.style.display='';
  var counts={'':STATE.items.length}; Object.keys(STATE.stavy).forEach(function(k){counts[k]=STATE.items.filter(function(x){return x.stav===k}).length});
  var chips=[['','Vše']].concat(Object.keys(STATE.stavy).map(function(k){return [k,STATE.stavy[k]]}));
  fl.innerHTML=chips.map(function(c){return '<span class="chip'+(STATE.filter===c[0]?' on':'')+'" onclick="setFilter(\''+c[0]+'\')">'+esc(c[1])+' <b>'+(counts[c[0]]||0)+'</b></span>'}).join('');

  var items=STATE.items.slice();
  if(STATE.filter) items=items.filter(function(x){return x.stav===STATE.filter});
  var list=$('#list');
  if(!items.length){ list.innerHTML='<div class="card"><p class="empty" style="margin:0">Žádné poptávky v této kategorii.</p></div>'; return; }
  list.innerHTML=items.map(card).join('');
}

function renderStats(){
  var s=STATE.stats;
  if(!s){ $('#statsCard').innerHTML=''; return; }
  $('#statsCard').innerHTML='<div class="stats">'
    +'<div class="st"><div class="n">'+s.celkem+'</div><div class="l">Poptávek</div></div>'
    +'<div class="st"><div class="n">'+s.nove+'</div><div class="l">Nových</div></div>'
    +'<div class="st off"><div class="n">'+s.nabidky+'</div><div class="l">Nabídek odesláno</div></div>'
    +'<div class="st sell"><div class="n">'+s.prodej+'</div><div class="l">z toho prodej</div></div>'
    +'<div class="st rent"><div class="n">'+s.pronajem+'</div><div class="l">z toho pronájem</div></div>'
    +'<div class="st"><div class="n">'+s.uzavreno+'</div><div class="l">Uzavřeno</div></div>'
    +'</div>';
}

function card(it){
  var st=it.stav||'nova';
  var isAdmin=!!STATE.role.isAdmin;
  var zj=it.zajem?('<span class="zajem '+(it.zajem==='koupe'?'koupe':(it.zajem==='pronajem'?'pronajem':''))+'">'+esc(STATE.zajemy[it.zajem]||it.zajem)+'</span>'):'';
  var h='<div class="req">';
  h+='<div class="top"><div style="min-width:0">'
    +'<div class="name">#'+it.cislo+' · '+esc(it.firma||'—')+zj+'</div>'
    +'<div class="contact">'+esc(it.jmeno||'')+(it.pozice?' <span style="color:#9aa79d">('+esc(it.pozice)+')</span>':'')+'<br>'
    +(it.email?'✉ <a href="mailto:'+esc(it.email)+'">'+esc(it.email)+'</a>':'')+(it.email&&it.telefon?' · ':'')+(it.telefon?'📞 <a href="tel:'+esc(it.telefon)+'">'+esc(it.telefon)+'</a>':'')+'</div>'
    +'</div><div><span class="badge b-'+st+'">'+esc(STATE.stavy[st]||st)+'</span></div></div>';
  var pr=(it.prehled||[]).filter(function(r){return r[0]!=='Zájem'&&r[0]!=='Pozice kontaktu'});
  if(pr.length){ h+='<table class="answers">'+pr.map(function(r){return '<tr><td class="k">'+esc(r[0])+'</td><td class="v">'+esc(r[1])+'</td></tr>'}).join('')+'</table>'; }
  if(it.zprava) h+='<div class="zprava"><b>Poznámka zákazníka:</b> „'+esc(it.zprava)+'"</div>';
  if(it.nabidka&&it.nabidka.typ){ h+='<div class="nab">📤 <b>Odeslána nabídka:</b> '+esc(STATE.nabidkaTypy[it.nabidka.typ]||it.nabidka.typ)+(it.nabidka.castka?' · '+esc(it.nabidka.castka):'')+' <span style="color:#9aa79d">('+fmtDate(it.nabidka.at)+(it.nabidka.by&&it.nabidka.by.name?', '+esc(it.nabidka.by.name):'')+')</span></div>'; }
  h+='<div class="assigned">'+(it.obchodnik?('Obchodník: <span class="who">'+esc(it.obchodnik.name)+'</span>'):'<span style="color:var(--amber)">⚠ Nepřiřazeno</span>')+' · <span style="color:#9aa79d">'+fmtDate(it.createdAt)+'</span></div>';
  var hs=(it.historie||[]).slice(-3).reverse();
  if(hs.length){ h+='<div class="hist">'+hs.map(function(x){return '<div>'+fmtDate(x.at)+' — '+esc(STATE.stavy[x.stav]||x.stav)+(x.note?': '+esc(x.note):'')+(x.by&&x.by.name?' ('+esc(x.by.name)+')':'')+'</div>'}).join('')+'</div>'; }

  // akce: stav + poznámka + přiřazení (správce)
  h+='<div class="actions">';
  if(isAdmin){
    var oOpts='<option value="">— nepřiřazeno —</option>'+STATE.employees.map(function(e){return '<option value="'+esc(e.email)+'"'+(it.obchodnik&&it.obchodnik.email===e.email?' selected':'')+'>'+esc(e.name)+'</option>'}).join('');
    h+='<span class="lbl">Obchodník</span><select id="ob_'+it.id+'">'+oOpts+'</select>';
  }
  var sOpts=Object.keys(STATE.stavy).map(function(k){return '<option value="'+k+'"'+(k===st?' selected':'')+'>'+esc(STATE.stavy[k])+'</option>'}).join('');
  h+='<span class="lbl">Stav</span><select id="st_'+it.id+'">'+sOpts+'</select>';
  h+='<input class="note" id="nt_'+it.id+'" placeholder="poznámka (nepovinné)">';
  h+='<button class="btn sm" onclick="saveChange(\''+it.id+'\','+(isAdmin?'true':'false')+')">Uložit</button>';
  h+='</div>';
  // akce: zaznamenat odeslanou nabídku
  h+='<div class="actions" style="border-top:0;padding-top:4px">';
  h+='<span class="lbl">Odeslal(a) jsem nabídku</span>';
  h+='<select id="nb_'+it.id+'">'+Object.keys(STATE.nabidkaTypy).map(function(k){return '<option value="'+k+'"'+(it.nabidka&&it.nabidka.typ===k?' selected':'')+'>'+esc(STATE.nabidkaTypy[k])+'</option>'}).join('')+'</select>';
  h+='<input class="note" id="nc_'+it.id+'" placeholder="částka / poznámka k nabídce (nepovinné)" value="'+(it.nabidka&&it.nabidka.castka?esc(it.nabidka.castka):'')+'">';
  h+='<button class="btn sm" onclick="saveNabidka(\''+it.id+'\')">📤 Zaznamenat nabídku</button>';
  if(isAdmin) h+='<button class="btn ghost sm" style="border-color:#e0b4ae;color:#c0392b;margin-left:auto" onclick="smazat(\''+it.id+'\','+it.cislo+')">🗑 Smazat</button>';
  h+='</div>';
  h+='</div>';
  return h;
}

function setFilter(f){ STATE.filter=f; render(); }

async function saveChange(id, isAdmin){
  var body={id:id};
  var stSel=document.getElementById('st_'+id); if(stSel) body.stav=stSel.value;
  var nt=document.getElementById('nt_'+id); if(nt&&nt.value.trim()) body.note=nt.value.trim();
  if(isAdmin){ var obSel=document.getElementById('ob_'+id); if(obSel) body.obchodnik=obSel.value; }
  try{
    var r=await fetch('/api/loxxer/prirad',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var j=await r.json();
    if(!r.ok||j.chyba){ toast('Chyba: '+(j.chyba||r.status)); return; }
    toast('Uloženo'+((body.obchodnik)?' — obchodník informován e-mailem':''));
    load();
  }catch(e){ toast('Chyba: '+e.message); }
}
async function saveNabidka(id){
  var typ=document.getElementById('nb_'+id).value;
  var castka=(document.getElementById('nc_'+id).value||'').trim();
  try{
    var r=await fetch('/api/loxxer/nabidka',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,typ:typ,castka:castka})});
    var j=await r.json();
    if(!r.ok||j.chyba){ toast('Chyba: '+(j.chyba||r.status)); return; }
    toast('Nabídka zaznamenána — stav „Nabídka odeslána"');
    load();
  }catch(e){ toast('Chyba: '+e.message); }
}
async function smazat(id,cislo){
  if(!confirm('Opravdu smazat poptávku #'+cislo+'? Akci nelze vzít zpět.')) return;
  try{
    var r=await fetch('/api/loxxer/smazat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})});
    var j=await r.json();
    if(!r.ok||j.chyba){ toast('Chyba: '+(j.chyba||r.status)); return; }
    toast('Poptávka smazána'); load();
  }catch(e){ toast('Chyba: '+e.message); }
}

/* ---- Nastavení (jen správce): obchodníci + obchodní ředitel + report + úvodní fotka ---- */
function renderCfg(){
  var box=$('#cfgCard');
  var chosen={}; STATE.notify.forEach(function(b){chosen[b.email]=1});
  var opts=STATE.employees.filter(function(e){return !chosen[e.email]}).map(function(e){return '<option value="'+esc(e.email)+'">'+esc(e.name)+'</option>'}).join('');
  var notifyChips=STATE.notify.length?STATE.notify.map(function(b){return '<span class="chip on" style="cursor:default">'+esc(b.name||b.email)+' <b title="Odebrat" style="cursor:pointer;margin-left:4px" onclick="notifyRemove(\''+esc(b.email)+'\')">✕</b></span>'}).join(' '):'<span style="color:var(--mut)">Nikdo — nové poptávky nechodí e-mailem (uvidíte je tady v seznamu).</span>';
  var rchosen={}; STATE.reditel.forEach(function(b){rchosen[b.email]=1});
  var ropts=STATE.employees.filter(function(e){return !rchosen[e.email]}).map(function(e){return '<option value="'+esc(e.email)+'">'+esc(e.name)+'</option>'}).join('');
  var reditelChips=STATE.reditel.length?STATE.reditel.map(function(b){return '<span class="chip on" style="cursor:default;background:var(--blue);border-color:var(--blue)">'+esc(b.name||b.email)+' <b title="Odebrat" style="cursor:pointer;margin-left:4px" onclick="reditelRemove(\''+esc(b.email)+'\')">✕</b></span>'}).join(' '):'<span style="color:var(--mut)">Zatím nenastaven — nastavte, kdo z vedení dostává kopie a vidí statistiku.</span>';
  var rep=STATE.report||{}; var repTo=rep.to||[];
  var repChips=repTo.length?repTo.map(function(b){return '<span class="chip on" style="cursor:default;background:#274b8f;border-color:#274b8f">'+esc(b.name||b.email)+' <b title="Odebrat" style="cursor:pointer;margin-left:4px" onclick="reportRemove(\''+esc(b.email)+'\')">✕</b></span>'}).join(' '):'<span style="color:var(--mut)">Nikdo — týdenní report se neposílá.</span>';
  var dny=['neděli','pondělí','úterý','středu','čtvrtek','pátek','sobotu'];
  var wdOpts=dny.map(function(d,i){return '<option value="'+i+'"'+((rep.weekday==null?1:rep.weekday)===i?' selected':'')+'>'+d.charAt(0).toUpperCase()+d.slice(1)+'</option>'}).join('');

  box.innerHTML='<div class="card" style="background:#eef5ea;border-color:#cfe0c2">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="cfgToggle()"><div style="font-weight:700">⚙️ Nastavení — kam „sbíhají" poptávky, obchodní ředitel, report a úvodní fotka</div><span class="btn ghost sm">'+(CFGOPEN?'Skrýt':'Upravit')+'</span></div>'
    +(CFGOPEN?(
        '<div style="margin-top:12px"><div style="font-weight:700;font-size:13.5px;margin-bottom:4px">🔔 Obchodníci — komu chodí každá nová poptávka</div>'
        +'<div style="color:var(--mut);font-size:13px;margin-bottom:9px">Obchodník / obchodníci, kterým mají poptávky LOXXER „sbíhat". Konkrétní přiřazení pak řešíte u každé poptávky níže.</div>'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:9px">'+notifyChips+'</div>'
        +(opts?'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select id="notifySel" style="min-width:220px;font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px">'+opts+'</select><button class="btn sm" onclick="notifyAdd()">Přidat</button></div>':'<div style="color:var(--mut);font-size:13px">Všichni zaměstnanci už jsou přidáni.</div>')
        +'</div>'
        +'<hr style="border:0;border-top:1px solid #cfe0c2;margin:16px 0">'
        +'<div><div style="font-weight:700;font-size:13.5px;margin-bottom:4px">👔 Obchodní ředitel</div>'
        +'<div style="color:var(--mut);font-size:13px;margin-bottom:9px">Dostává kopii každé nové poptávky i odeslané nabídky a vidí statistiku odeslaných nabídek.</div>'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:9px">'+reditelChips+'</div>'
        +(ropts?'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select id="reditelSel" style="min-width:220px;font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px">'+ropts+'</select><button class="btn sm" onclick="reditelAdd()">Přidat</button></div>':'<div style="color:var(--mut);font-size:13px">Všichni zaměstnanci už jsou přidáni.</div>')
        +'</div>'
        +'<hr style="border:0;border-top:1px solid #cfe0c2;margin:16px 0">'
        +'<div><div style="font-weight:700;font-size:13.5px;margin-bottom:4px">📧 Týdenní report — souhrn poptávek a nabídek</div>'
        +'<div style="color:var(--mut);font-size:13px;margin-bottom:9px">Posílá se 1× týdně v <select id="repWeekday" onchange="reportWeekday(this.value)" style="font-family:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:7px">'+wdOpts+'</select>. Příjemci mohou být i mimo firmu.</div>'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:9px">'+repChips+'</div>'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="repEmail" type="email" placeholder="e-mail příjemce" style="min-width:220px;font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px"><button class="btn sm" onclick="reportAdd()">Přidat příjemce</button></div>'
        +'<label style="display:flex;gap:8px;align-items:center;margin-top:11px;font-size:13.5px;color:var(--mut)"><input type="checkbox" id="repEnabled" '+(rep.enabled===false?'':'checked')+' onchange="reportEnabled(this.checked)" style="width:16px;height:16px"> Týdenní report zapnutý</label>'
        +'</div>'
        +'<hr style="border:0;border-top:1px solid #cfe0c2;margin:16px 0">'
        +'<div style="color:var(--mut);font-size:13px">Veřejná prezentace a konfigurátor: <a href="/loxxer" target="_blank" rel="noopener">otevřít stránku ↗</a> (design a obsah spravuje ELKOPLAST CMS).</div>'
      ):'')
    +'</div>';
}
function cfgToggle(){ CFGOPEN=!CFGOPEN; renderCfg(); }

async function cfgSave(patch, okMsg){
  try{
    var r=await fetch('/api/loxxer/nastaveni',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
    var j=await r.json();
    if(!r.ok||j.chyba){ toast('Chyba: '+(j.chyba||r.status)); return false; }
    STATE.notify=j.notify||[]; STATE.reditel=j.reditel||[]; STATE.report=j.report||{}; renderCfg(); if(okMsg) toast(okMsg); return true;
  }catch(e){ toast('Chyba: '+e.message); return false; }
}
function notifyAdd(){
  var sel=$('#notifySel'); if(!sel||!sel.value) return;
  var em=sel.value; var emp=STATE.employees.find(function(e){return e.email===em});
  var list=STATE.notify.map(function(b){return {email:b.email,name:b.name}}); list.push({email:em,name:emp?emp.name:em});
  cfgSave({notify:list},'Obchodník přidán');
}
function notifyRemove(em){ cfgSave({notify:STATE.notify.filter(function(b){return b.email!==em}).map(function(b){return {email:b.email,name:b.name}})},'Obchodník odebrán'); }
function reditelAdd(){
  var sel=$('#reditelSel'); if(!sel||!sel.value) return;
  var em=sel.value; var emp=STATE.employees.find(function(e){return e.email===em});
  var list=STATE.reditel.map(function(b){return {email:b.email,name:b.name}}); list.push({email:em,name:emp?emp.name:em});
  cfgSave({reditel:list},'Obchodní ředitel přidán');
}
function reditelRemove(em){ cfgSave({reditel:STATE.reditel.filter(function(b){return b.email!==em}).map(function(b){return {email:b.email,name:b.name}})},'Odebráno'); }
function reportAdd(){
  var inp=$('#repEmail'); if(!inp) return; var em=(inp.value||'').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast('Zadejte platný e-mail.'); return; }
  var to=(STATE.report.to||[]).map(function(b){return {email:b.email,name:b.name}}); if(to.some(function(b){return b.email===em})){ toast('Už je v seznamu.'); return; }
  to.push({email:em,name:em}); inp.value=''; cfgSave({report:{to:to}},'Příjemce reportu přidán');
}
function reportRemove(em){ var to=(STATE.report.to||[]).filter(function(b){return b.email!==em}).map(function(b){return {email:b.email,name:b.name}}); cfgSave({report:{to:to}},'Příjemce reportu odebrán'); }
function reportWeekday(v){ cfgSave({report:{weekday:+v}},'Den odeslání změněn'); }
function reportEnabled(on){ cfgSave({report:{enabled:!!on}}, on?'Report zapnutý':'Report vypnutý'); }
function bgUpload(file){
  if(!file) return;
  if(file.size>6*1024*1024){ toast('Obrázek je větší než 6 MB.'); return; }
  var rd=new FileReader();
  rd.onload=async function(){
    try{
      var r=await fetch('/api/loxxer/pozadi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataUrl:rd.result})});
      var j=await r.json().catch(function(){return {};});
      if(!r.ok){ toast(j.chyba||'Nahrání selhalo.'); return; }
      STATE.bg=true; renderCfg(); toast('Úvodní fotka nastavena');
    }catch(e){ toast('Chyba: '+e.message); }
  };
  rd.readAsDataURL(file);
}
async function bgRemove(){
  if(!confirm('Odebrat úvodní fotku?')) return;
  try{
    var r=await fetch('/api/loxxer/pozadi',{method:'DELETE'});
    if(!r.ok){ var j=await r.json().catch(function(){return {};}); toast(j.chyba||'Odebrání selhalo.'); return; }
    STATE.bg=false; renderCfg(); toast('Úvodní fotka odebrána');
  }catch(e){ toast('Chyba: '+e.message); }
}

load();
</script>
</body>
