<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lodní kontejnery — poptávky</title>
<style>
  :root{--green:#2f7d32;--green-d:#1f5e22;--ink:#16211a;--mut:#6b7a70;--line:#e2e8e0;--paper:#fff;--bg:#f4f7f2;--amber:#a86a00;--amber-soft:#fbf0dc;--red:#c0392b;--red-soft:#fbecea;--blue:#1e63c4;--blue-soft:#e8f0fb;--steel:#2b3a42;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 20px 60px}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:21px;margin:0}
  .sub{color:var(--mut);font-size:13.5px;margin:4px 0 0}
  .btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:9px;padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--green-d)}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{background:#eef2ec}
  .btn.sm{padding:5px 10px;font-size:13px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:14px}
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .req{border:1px solid var(--line);border-radius:14px;background:#fff;padding:15px 17px;margin-bottom:13px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .name{font-size:16px;font-weight:700}
  .contact{color:var(--mut);font-size:13px;margin-top:3px}
  .contact a{color:var(--green-d)}
  .badge{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .b-nova{background:var(--blue-soft);color:var(--blue)}
  .b-vresenu{background:var(--amber-soft);color:var(--amber)}
  .b-nabidka{background:#e6eefb;color:#274b8f}
  .b-uzavreno{background:#dff2e4;color:var(--green-d)}
  .b-zamitnuto{background:var(--red-soft);color:var(--red)}
  .meta{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:11px;font-size:13.5px}
  .meta b{font-weight:700}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef3ea;color:#3f6a43}
  .zprava{margin-top:10px;padding:9px 12px;background:#f7f9f5;border-radius:8px;font-size:13.5px;line-height:1.6}
  .assigned{margin-top:10px;font-size:13px}
  .assigned .who{font-weight:700;color:var(--green-d)}
  .actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
  .actions select,.actions input{font-family:inherit;font-size:13.5px;padding:6px 9px;border:1px solid var(--line);border-radius:8px}
  .actions input{flex:1;min-width:140px}
  .hist{margin-top:10px;font-size:12.5px;color:var(--mut)}
  .empty{color:var(--mut);padding:14px 2px}
  .lbl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#16211a;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>Lodní kontejnery — poptávky</h1><p class="sub" id="sub">Načítám…</p></div>
    <button class="btn ghost sm" onclick="load()">↻ Obnovit</button>
  </div>

  <div id="cfgCard"></div>
  <div class="filters" id="filters" style="display:none"></div>
  <div id="list"><p class="empty">Načítám…</p></div>
</div>
<div class="toast" id="toast"></div>

<script>
var STATE={items:[],role:{},stavy:{},employees:[],notify:[],filter:''};
var CFGOPEN=false;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}
function fmtDate(ts){try{return new Date(ts).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return''}}

async function load(){
  try{
    var r=await fetch('/api/kontejnery',{cache:'no-store'});
    if(!r.ok){ $('#list').innerHTML='<div class="card"><b>Chyba '+r.status+'</b></div>'; return; }
    var j=await r.json();
    STATE.items=j.items||[]; STATE.role=j.role||{}; STATE.stavy=j.stavy||{}; STATE.employees=j.employees||[]; STATE.notify=j.notify||[];
    render();
  }catch(e){ $('#list').innerHTML='<div class="card"><b>Chyba</b> — '+esc(e.message)+'</div>'; }
}

function render(){
  var role=STATE.role;
  $('#sub').textContent=role.isAdmin?'Poptávky z webu. Přiřaďte obchodníka a sledujte stav.':'Poptávky z webu. Zpracujte přiřazené a aktualizujte stav.';
  // config (admin)
  if(role.isAdmin) renderCfg(); else $('#cfgCard').innerHTML='';
  // filtry
  var fl=$('#filters'); fl.style.display='';
  var counts={'':STATE.items.length}; Object.keys(STATE.stavy).forEach(function(k){counts[k]=STATE.items.filter(function(x){return x.stav===k}).length});
  var chips=[['','Vše']].concat(Object.keys(STATE.stavy).map(function(k){return [k,STATE.stavy[k]]}));
  fl.innerHTML=chips.map(function(c){return '<span class="chip'+(STATE.filter===c[0]?' on':'')+'" onclick="setFilter(\''+c[0]+'\')">'+esc(c[1])+' <b>'+(counts[c[0]]||0)+'</b></span>'}).join('');

  var items=STATE.items.slice();
  if(STATE.filter) items=items.filter(function(x){return x.stav===STATE.filter});
  var list=$('#list');
  if(!items.length){ list.innerHTML='<div class="card"><p class="empty" style="margin:0">Žádné poptávky v této kategorii.</p></div>'; return; }
  list.innerHTML=items.map(card).join('');
}

function card(it){
  var st=it.stav||'nova';
  var isAdmin=!!STATE.role.isAdmin;
  var h='<div class="req">';
  h+='<div class="top"><div style="min-width:0">'
    +'<div class="name">#'+it.cislo+' · '+esc(it.jmeno||'—')+(it.firma?' <span style="color:var(--mut);font-weight:500">('+esc(it.firma)+')</span>':'')+'</div>'
    +'<div class="contact">'+(it.email?'✉ <a href="mailto:'+esc(it.email)+'">'+esc(it.email)+'</a>':'')+(it.email&&it.telefon?' · ':'')+(it.telefon?'📞 <a href="tel:'+esc(it.telefon)+'">'+esc(it.telefon)+'</a>':'')+'</div>'
    +'</div><div><span class="badge b-'+st+'">'+esc(STATE.stavy[st]||st)+'</span></div></div>';
  var m=[];
  if(it.typ) m.push('<span class="tag">'+esc(it.typ)+'</span>');
  if(it.rezim) m.push('<span><b>Režim:</b> '+esc(it.rezim)+'</span>');
  if(it.pocet) m.push('<span><b>Počet:</b> '+esc(String(it.pocet))+' ks</span>');
  if(it.mesto) m.push('<span><b>Místo:</b> '+esc(it.mesto)+'</span>');
  m.push('<span style="color:#8a938a">'+fmtDate(it.createdAt)+'</span>');
  h+='<div class="meta">'+m.join('')+'</div>';
  if(it.zprava) h+='<div class="zprava">„'+esc(it.zprava)+'"</div>';
  h+='<div class="assigned">'+(it.obchodnik?('Obchodník: <span class="who">'+esc(it.obchodnik.name)+'</span>'):'<span style="color:var(--amber)">⚠ Nepřiřazeno</span>')+'</div>';
  var hs=(it.historie||[]).slice(-3).reverse();
  if(hs.length){ h+='<div class="hist">'+hs.map(function(x){return '<div>'+fmtDate(x.at)+' — '+esc(STATE.stavy[x.stav]||x.stav)+(x.note?': '+esc(x.note):'')+(x.by&&x.by.name?' ('+esc(x.by.name)+')':'')+'</div>'}).join('')+'</div>'; }
  // akce
  h+='<div class="actions">';
  if(isAdmin){
    var oOpts='<option value="">— nepřiřazeno —</option>'+STATE.employees.map(function(e){return '<option value="'+esc(e.email)+'"'+(it.obchodnik&&it.obchodnik.email===e.email?' selected':'')+'>'+esc(e.name)+'</option>'}).join('');
    h+='<span class="lbl">Obchodník</span><select id="ob_'+it.id+'">'+oOpts+'</select>';
  }
  var sOpts=Object.keys(STATE.stavy).map(function(k){return '<option value="'+k+'"'+(k===st?' selected':'')+'>'+esc(STATE.stavy[k])+'</option>'}).join('');
  h+='<span class="lbl">Stav</span><select id="st_'+it.id+'">'+sOpts+'</select>';
  h+='<input id="nt_'+it.id+'" placeholder="poznámka (nepovinné)">';
  h+='<button class="btn sm" onclick="saveChange(\''+it.id+'\','+(isAdmin?'true':'false')+')">Uložit</button>';
  h+='</div></div>';
  return h;
}

function setFilter(f){ STATE.filter=f; render(); }

async function saveChange(id, isAdmin){
  var it=STATE.items.find(function(x){return x.id===id}); if(!it) return;
  var body={id:id};
  var stSel=document.getElementById('st_'+id); if(stSel) body.stav=stSel.value;
  var nt=document.getElementById('nt_'+id); if(nt&&nt.value.trim()) body.note=nt.value.trim();
  if(isAdmin){ var obSel=document.getElementById('ob_'+id); if(obSel) body.obchodnik=obSel.value; }
  try{
    var r=await fetch('/api/kontejnery/prirad',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var j=await r.json();
    if(!r.ok||j.chyba){ toast('Chyba: '+(j.chyba||r.status)); return; }
    toast('Uloženo'+((body.obchodnik)?' — obchodník informován e-mailem':''));
    load();
  }catch(e){ toast('Chyba: '+e.message); }
}

/* ---- Nastavení příjemců nových poptávek (jen správce) ---- */
function renderCfg(){
  var box=$('#cfgCard');
  var chosen={}; STATE.notify.forEach(function(b){chosen[b.email]=1});
  var opts=STATE.employees.filter(function(e){return !chosen[e.email]}).map(function(e){return '<option value="'+esc(e.email)+'">'+esc(e.name)+'</option>'}).join('');
  var chips=STATE.notify.length?STATE.notify.map(function(b){return '<span class="chip on" style="cursor:default">'+esc(b.name||b.email)+' <b title="Odebrat" style="cursor:pointer;margin-left:4px" onclick="cfgRemove(\''+esc(b.email)+'\')">✕</b></span>'}).join(' '):'<span style="color:var(--mut)">Nikdo — nové poptávky nechodí e-mailem (uvidíte je tady v seznamu).</span>';
  box.innerHTML='<div class="card" style="background:#eef5ea;border-color:#cfe0c2">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="cfgToggle()"><div style="font-weight:700">🔔 Komu chodí nová poptávka e-mailem</div><span class="btn ghost sm">'+(CFGOPEN?'Skrýt':'Upravit')+'</span></div>'
    +(CFGOPEN?('<div style="color:var(--mut);font-size:13px;margin:8px 0 10px">Vyberte, kdo dostane e-mail o každé nové poptávce z webu (typicky vedoucí obchodu). Přiřazení konkrétního obchodníka k poptávce se dělá níže u každé poptávky.</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">'+chips+'</div>'
    +(opts?'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select id="cfgSel" style="min-width:220px;font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px">'+opts+'</select><button class="btn sm" onclick="cfgAdd()">Přidat příjemce</button></div>':'<div style="color:var(--mut);font-size:13px">Všichni zaměstnanci už jsou přidáni.</div>')):'')
    +'</div>';
}
function cfgToggle(){ CFGOPEN=!CFGOPEN; renderCfg(); }
async function cfgSave(list){
  try{
    var r=await fetch('/api/kontejnery/nastaveni',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notify:list})});
    var j=await r.json();
    if(!r.ok||j.chyba){ toast('Chyba: '+(j.chyba||r.status)); return false; }
    STATE.notify=j.notify||[]; renderCfg(); return true;
  }catch(e){ toast('Chyba: '+e.message); return false; }
}
async function cfgAdd(){
  var sel=$('#cfgSel'); if(!sel||!sel.value) return;
  var em=sel.value; var emp=STATE.employees.find(function(e){return e.email===em});
  var list=STATE.notify.map(function(b){return {email:b.email,name:b.name}}); list.push({email:em,name:emp?emp.name:em});
  if(await cfgSave(list)) toast('Příjemce přidán');
}
async function cfgRemove(em){
  var list=STATE.notify.filter(function(b){return b.email!==em}).map(function(b){return {email:b.email,name:b.name}});
  if(await cfgSave(list)) toast('Příjemce odebrán');
}

load();
</script>
</body>
</html>
